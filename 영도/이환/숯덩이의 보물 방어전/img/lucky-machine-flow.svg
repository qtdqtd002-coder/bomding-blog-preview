<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="숯덩이의 보물 러키 머신 교환 흐름" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title>숯덩이의 보물 러키 머신 교환 흐름</title><desc>몬스터 처치, 전용 재화 드롭, 맵의 러키 머신, 랜덤 아이템 교환 순서의 도식</desc><rect width="680" height="230" fill="#ffffff"/><text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0a8a44">러키 머신 교환 흐름</text><rect x="20" y="70" width="130" height="90" rx="10" fill="#fff4e5" stroke="#f0a63a" stroke-width="2"/><text x="85.0" y="109.95" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2f2f">몬스터 처치</text><text x="85.0" y="131.95" text-anchor="middle" font-size="14" font-weight="400" fill="#5b6b73">몰려오는 몬스터</text><rect x="190" y="70" width="130" height="90" rx="10" fill="#eefaf2" stroke="#03c75a" stroke-width="2"/><text x="255.0" y="109.95" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2f2f">전용 재화 드롭</text><text x="255.0" y="131.95" text-anchor="middle" font-size="14" font-weight="400" fill="#5b6b73">몬스터가 떨어뜨림</text><rect x="360" y="70" width="130" height="90" rx="10" fill="#eefaf2" stroke="#03c75a" stroke-width="2"/><text x="425.0" y="109.95" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2f2f">맵의 러키 머신</text><text x="425.0" y="131.95" text-anchor="middle" font-size="14" font-weight="400" fill="#5b6b73">재화로 교환</text><rect x="530" y="70" width="130" height="90" rx="10" fill="#e8f1ff" stroke="#2d6cdf" stroke-width="2"/><text x="595.0" y="109.95" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2f2f">랜덤 아이템</text><text x="595.0" y="131.95" text-anchor="middle" font-size="14" font-weight="400" fill="#5b6b73">HP 회복·전체 동결 등</text><line x1="154" y1="115" x2="178" y2="115" stroke="#03c75a" stroke-width="3"/><polygon points="186,115 176,109 176,121" fill="#03c75a"/><line x1="324" y1="115" x2="348" y2="115" stroke="#03c75a" stroke-width="3"/><polygon points="356,115 346,109 346,121" fill="#03c75a"/><line x1="494" y1="115" x2="518" y2="115" stroke="#03c75a" stroke-width="3"/><polygon points="526,115 516,109 516,121" fill="#03c75a"/><text x="340" y="205" text-anchor="middle" font-size="13" fill="#7a8a92">인벤·뉴스투온 1.4 방송 정리 기준 · 재화 이름과 품목 전체는 방송에서 공개되지 않음</text></svg>