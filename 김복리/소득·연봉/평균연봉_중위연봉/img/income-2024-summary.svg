<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Malgun Gothic','Apple SD Gothic Neo','맑은 고딕',sans-serif">
  <rect width="720" height="320" rx="16" fill="#f5faf7"/>
  <rect width="720" height="66" rx="16" fill="#0B7A4B"/>
  <rect y="42" width="720" height="24" fill="#0B7A4B"/>
  <text x="30" y="31" font-size="22" font-weight="800" fill="#ffffff">2024년 임금근로자, 내 월급은 어디쯤?</text>
  <text x="30" y="53" font-size="13" fill="#d8f0e4">통계청 「임금근로일자리 소득(보수) 결과」 · 월 세전 기준</text>

  <rect x="30" y="92" width="315" height="150" rx="12" fill="#ffffff" stroke="#d6e9df" stroke-width="1.5"/>
  <text x="187" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#7c8a82">평균소득</text>
  <text x="187" y="172" text-anchor="middle" font-size="44" font-weight="800" fill="#1f2a24">375<tspan font-size="22" font-weight="700">만원</tspan></text>
  <text x="187" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6d1f">소수 고소득자가 끌어올린 숫자</text>
  <text x="187" y="227" text-anchor="middle" font-size="12" fill="#9aa8a0">절반이 넘는 사람은 이보다 아래</text>

  <rect x="375" y="92" width="315" height="150" rx="12" fill="#eef6f1" stroke="#0B7A4B" stroke-width="2"/>
  <text x="532" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0B7A4B">중위소득 · 딱 한가운데</text>
  <text x="532" y="172" text-anchor="middle" font-size="44" font-weight="800" fill="#0B7A4B">288<tspan font-size="22" font-weight="700">만원</tspan></text>
  <text x="532" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#0B7A4B">'보통 사람'의 진짜 자리</text>
  <text x="532" y="227" text-anchor="middle" font-size="12" fill="#4a5750">극단값에 흔들리지 않아요</text>

  <text x="360" y="279" text-anchor="middle" font-size="16" font-weight="800" fill="#C0892E">평균 − 중위 = 87만원 격차</text>
  <text x="360" y="303" text-anchor="middle" font-size="12.5" fill="#7c8a82">격차가 클수록 '평균'은 현실보다 부풀려 보입니다 · 자료: 통계청 2024년</text>
</svg>
