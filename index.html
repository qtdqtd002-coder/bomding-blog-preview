<link rel="icon" type="image/svg+xml" href="app/icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="app/icons/icon-192.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   쓰담 운영 허브 — Design System v4 「작업실 (The Studio)」
   2026-08-04. v3「편집국」 피드백 반영 전면 재설계.

   v3에서 뭐가 틀렸나:
     세리프 헤드라인 + 1px 룰/점선 + 10px 모노 마이크로라벨로 '신문'을 흉내냈더니
     ① 영역 경계가 안 보이고 ② 버튼이 텍스트처럼 보이고 ③ 글씨가 눈에 안 들어왔다.
     은유(편집국)가 도구의 명료함을 이겼다 → 은유를 버린다.

   v4 원칙:
     1) 영역은 '선'이 아니라 '면'으로 나눈다 — 모든 블록이 패널(배경+테두리+여백).
     2) 폰트는 읽히는 게 먼저 — Pretendard 단일, 라벨 12~13px, 모노는 숫자에만.
     3) 1920×1080 기준 — maxw 1560, 2컬럼을 실제로 쓴다.
     4) 버튼은 버튼처럼 — 높이 36px 고정, 면·테두리·상태 전환이 분명하게.
     5) 밀도는 낮추고 여백을 준다. 정보는 줄이지 않되 숨 쉴 자리를 만든다.
   ============================================================ */
:root{
  /* ── 면(surface) 램프 — 따뜻한 뉴트럴. 배경과 패널을 확실히 다른 밝기로 ── */
  --paper:#F2F0EC;            /* 앱 배경(패널보다 어둡게 — 이래야 패널이 떠 보인다) */
  --paper-2:#E9E6E0;          /* 더 깊은 배경(구분 띠) */
  --surface:#FFFFFF;          /* 패널 */
  --surface-2:#F6F4F1;        /* 인셋·칩 */
  --surface-3:#EDEAE5;        /* hover 인셋 */
  --ink:#1A1815; --ink-2:#514B44; --ink-3:#6F6961;
  --line:#E2DED7; --line-2:#CFC9C0; --line-3:#B6AFA4;
  /* 구 토큰 별칭 — 레거시 규칙·인라인 스타일 호환(제거 금지) */
  --bg:#F2F0EC; --bg-subtle:#F6F4F1; --line-strong:#CFC9C0; --sub:#514B44; --muted:#6F6961;
  --rule:#E2DED7; --rule-2:#CFC9C0; --rule-hard:#1A1815;
  /* ── 브랜드 ── */
  --accent:#C4482A; --accent-h:#A93A20; --accent-soft:#FBEAE4; --accent-line:#EFC7B9;
  --brand:#C4482A; --brand-h:#A93A20; --brand-ink:#C4482A; --brand-solid:#C4482A;
  --brand-weak:#FBEAE4; --brand-tint:#FDF4F1; --on-brand:#FFFFFF;
  --warm:#C4482A; --warm-weak:#FBEAE4; --danger:#B3261E;
  /* ── 작성자 정체성(출처 전용) ── */
  --a-bomding:#D9603C; --a-bomding-weak:#FBEDE7;
  --a-yeongdo:#2A8574; --a-yeongdo-weak:#E4F1EE;
  --a-gemdeokku:#7355C9; --a-gemdeokku-weak:#EFEAFB;
  --a-yeonbom:#3F7EC0; --a-yeonbom-weak:#E6EFF9;
  --a-harusari:#BC3D73; --a-harusari-weak:#FBE9F1;
  --a-trend:#C4482A; --a-news:#8A5D08; --a-about:#C4482A; --a-queue:#1B5FA8; --a-ops:#166E3F;
  /* ── 토픽 데스크 분류(2026-08-14 신설 · 08-15 pin 추가/con 폐지) ──
     작성자 색과 다른 '주제 분류' 축이다. 트렌드 탭엔 작성자 색이 아예 렌더되지 않으므로 출처와 혼동되지 않고,
     전 색이 이미 대비 검증된 상태 토큰(warn·info·ok·accent)에서 왔다 — 새로 만든 값이 없다.
     ★색만으로 분류를 전달하지 않는다 — 섹션마다 아이콘 + 한글 라벨을 항상 같이 둔다. */
  --c-pin:#8A5D08;      /* 꼭 다룰 게임 — 종이 위 5.6:1(--warn 과 같은 앰버, 이미 대비 검증된 값) */
  --c-core:#9C3F6E;     /* 주로 다루는 게임 — 종이 위 5.5:1 */
  --c-new:#1B5FA8;      /* 신작 게임 */
  --c-upd:#15703C;      /* 최근 업데이트 게임 */
  --c-hot:#C4482A;      /* 최근 화제 게임 */
  --c-par:#6A46BE;      /* 육아 제품 — 종이 위 5.71:1(실측). 08-14 개편 때 유실된 🍼육아 트랙을 08-18 복원하며 신설.
                           남은 색상환에서 5분류(앰버·자주·파랑·초록·주황빨강)와 가장 멀리 떨어진 보라를 골랐다.
                           봄딩 주황(--a-bomding)을 쓰지 않은 이유는 --c-hot 과 같은 계열이라 분류가 뭉개지기 때문. */
  /* ~~--c-con(콘솔)~~ = 2026-08-15 분류 폐지로 사용처 없음 — 토큰도 함께 제거했다(죽은 토큰 금지) */
  /* ── 상태 ── */
  --ok:#15703C; --ok-weak:#E1F0E7; --warn:#8A5D08; --warn-weak:#F8EEDA;
  --bad:#B3261E; --bad-weak:#FAE7E5; --info:#1B5FA8; --info-weak:#E5EEF8;
  --ac-mixfloor:#1A1815; --ac-fg:#FFFFFF;
  /* ── 깊이 ── */
  --sh-xs:0 1px 2px rgba(52,42,30,.05);
  --sh-sm:0 1px 3px rgba(52,42,30,.07), 0 1px 2px rgba(52,42,30,.04);
  --sh-md:0 4px 14px rgba(52,42,30,.09), 0 2px 5px rgba(52,42,30,.05);
  --sh-lg:0 16px 40px rgba(40,30,18,.16);
  --sh-ring:0 0 0 3px var(--accent-soft);
  --r-xs:6px; --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
  --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-xl:20px;   /* 레거시 별칭 */
  --maxw:1560px; --head-h:60px;
  --ease:cubic-bezier(.22,1,.36,1); --ease-soft:cubic-bezier(.33,.86,.34,1);
  --z-head:50; --z-menu:60; --z-fab:80; --z-admchip:90; --z-pop:120; --z-modal:200; --z-toast:220;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,"맑은 고딕",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:var(--font);   /* v4에서 세리프 폐기 — 남은 참조가 있어도 본문 폰트로 흡수 */
}
:root{ --ac-fill:color-mix(in srgb, var(--ac,var(--accent)) 82%, var(--ac-mixfloor));
       --ac-ink:color-mix(in srgb, var(--ac,var(--accent)) 74%, var(--ac-mixfloor)); }
[style*="--ac:"]{ --ac-fill:color-mix(in srgb, var(--ac,var(--accent)) 82%, var(--ac-mixfloor));
                  --ac-ink:color-mix(in srgb, var(--ac,var(--accent)) 74%, var(--ac-mixfloor)); }
:root[data-theme="dark"]{
  --paper:#121110; --paper-2:#0D0C0B; --surface:#1C1A18; --surface-2:#242220; --surface-3:#2C2926;
  --ink:#F3F0EB; --ink-2:#B5ADA3; --ink-3:#8E867C;
  --line:#2E2B27; --line-2:#403C37; --line-3:#524C45;
  --bg:#121110; --bg-subtle:#242220; --line-strong:#403C37; --sub:#B5ADA3; --muted:#8E867C;
  --rule:#2E2B27; --rule-2:#403C37; --rule-hard:#F3F0EB;
  --accent:#FF8A62; --accent-h:#FFA284; --accent-soft:#2E1C15; --accent-line:#5A3325;
  --brand:#FF8A62; --brand-h:#FFA284; --brand-ink:#FF8A62; --brand-solid:#FF8A62;
  --brand-weak:#2E1C15; --brand-tint:#231713; --on-brand:#121110;
  --warm:#FF8A62; --warm-weak:#2E1C15; --danger:#F58D82;
  --a-bomding:#F09067; --a-yeongdo:#4CB6A1; --a-gemdeokku:#A98BEC;
  --a-yeonbom:#6BA6E0; --a-harusari:#EC85AF;
  --a-trend:#FF8A62; --a-queue:#7BB4EE; --a-ops:#4ED88E; --a-news:#E7B34A;
  --c-pin:#E7B34A; --c-core:#E58AB4; --c-new:#7BB4EE; --c-upd:#4CD98D; --c-hot:#FF8A62;  /* 토픽 데스크 분류(다크) */
  --c-par:#B79BF2;  /* 육아 제품(다크) — 배경 위 8.07:1(실측) */
  --ok:#4CD98D; --ok-weak:#11241A; --warn:#E7B34A; --warn-weak:#261E10;
  --bad:#F58D82; --bad-weak:#2A1614; --info:#7BB4EE; --info-weak:#121E2B;
  --ac-fg:#121110;
  --sh-xs:0 1px 2px rgba(0,0,0,.3); --sh-sm:0 1px 3px rgba(0,0,0,.4);
  --sh-md:0 4px 14px rgba(0,0,0,.45); --sh-lg:0 16px 40px rgba(0,0,0,.6);
  --sh-ring:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);
}
:root[data-theme="dark"]{ --ac-fill:var(--ac,var(--accent)); --ac-ink:var(--ac,var(--accent)); }
:root[data-theme="dark"] [style*="--ac:"]{ --ac-fill:var(--ac,var(--accent)); --ac-ink:var(--ac,var(--accent)); }

*{box-sizing:border-box;}
html{color-scheme:light;} :root[data-theme="dark"]{color-scheme:dark;}
html,body{margin:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.72;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background-color .2s var(--ease),color .2s var(--ease);}
/* 배경에 아주 옅은 온기 — 단색 평면이 주는 삭막함만 덜어낸다 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 620px at 15% -10%, color-mix(in srgb,var(--accent) 5%,transparent), transparent 62%);}
body>*{position:relative;z-index:1;}
a{color:inherit;text-decoration:none;}
svg{display:block;}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
.num{font-family:var(--mono);font-feature-settings:"tnum";}

/* ══════════ 진입 모션 ══════════ */
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.reveal{animation:rise .46s var(--ease) both;animation-delay:calc(var(--i,0)*55ms);}

/* ══════════ 헤더 ══════════ */
.site-head{position:sticky;top:0;z-index:var(--z-head);background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.5) blur(10px);-webkit-backdrop-filter:saturate(1.5) blur(10px);
  border-bottom:1px solid var(--line);}
.head-inner{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
.head-row{height:var(--head-h);display:flex;align-items:center;justify-content:space-between;gap:20px;}
.logo{display:flex;align-items:center;gap:10px;flex:none;}
.logo .mark{width:30px;height:30px;flex:none;color:var(--accent);border-radius:8px;overflow:hidden;}
.logo .wm{display:flex;align-items:baseline;gap:9px;line-height:1;white-space:nowrap;}
.logo .wm b{font-size:20px;font-weight:800;letter-spacing:-.035em;color:var(--ink);}
.logo .wm span{font-size:12.5px;font-weight:500;color:var(--ink-3);letter-spacing:-.01em;}
.head-tools{display:flex;align-items:center;gap:8px;flex:none;}
.search{position:relative;display:flex;align-items:center;}
.search .ic{position:absolute;left:12px;color:var(--ink-3);width:15px;height:15px;pointer-events:none;}
.search input{width:250px;max-width:40vw;height:38px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);border-radius:var(--r-sm);padding:0 13px 0 34px;font-size:13.5px;font-family:inherit;
  outline:none;transition:.16s var(--ease);}
.search input::placeholder{color:var(--ink-3);}
.search input:focus{border-color:var(--accent);box-shadow:var(--sh-ring);width:290px;}

/* ── 버튼 공통 — 높이 고정, 면과 테두리로 존재를 분명히 ── */
.app-cta,.icon-btn,.sbtn,.btn,.tbtn{font-family:inherit;cursor:pointer;transition:.15s var(--ease);}
.app-cta{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border:1px solid transparent;
  border-radius:var(--r-sm);background:var(--ink);color:var(--paper);font-size:13.5px;font-weight:700;letter-spacing:-.01em;}
.app-cta .ic{width:15px;height:15px;}
.app-cta:hover{background:var(--accent);transform:translateY(-1px);box-shadow:var(--sh-md);}
.app-cta:active{transform:none;box-shadow:none;}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:var(--r-sm);}
.icon-btn .ic{width:16px;height:16px;}
.icon-btn:hover{color:var(--ink);border-color:var(--line-3);background:var(--surface-2);}
.icon-btn.on{background:var(--accent);color:#fff;border-color:transparent;}

/* ══════════ 네비 — 세그먼트 탭 + 작성자 칩 ══════════ */
.nav-wrap{background:var(--surface);border-bottom:1px solid var(--line);}
.topnav{max-width:var(--maxw);margin:0 auto;padding:9px 28px;display:flex;align-items:center;gap:8px;
  overflow-x:auto;scrollbar-width:none;}
.topnav::-webkit-scrollbar{display:none;}
.nav-seg{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:3px;flex:none;}
.nav-seg button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border:0;
  background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:600;letter-spacing:-.012em;
  border-radius:8px;cursor:pointer;transition:.15s var(--ease);white-space:nowrap;}
.nav-seg button:hover{color:var(--ink);background:color-mix(in srgb,var(--surface) 70%,transparent);}
.nav-seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm);font-weight:700;}
.topnav .cnt{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink-3);font-feature-settings:"tnum";}
.nav-seg button.on .cnt{color:var(--accent);font-weight:700;}
.nav-div{width:1px;height:26px;background:var(--line-2);margin:0 6px;flex:none;}
.nav-grp{display:none;}
.wchip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px 0 6px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-family:inherit;font-size:13px;font-weight:600;
  border-radius:99px;cursor:pointer;transition:.15s var(--ease);white-space:nowrap;flex:none;}
.wchip .av{width:24px;height:24px;}
.wchip .cnt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);}
.wchip:hover{border-color:var(--ac,var(--line-3));color:var(--ink);background:var(--surface-2);transform:translateY(-1px);}
.wchip.on{background:var(--ac-fill);border-color:transparent;color:var(--ac-fg);box-shadow:var(--sh-sm);}
.wchip.on .cnt{color:var(--ac-fg);opacity:.75;}
.teambtn,.teammenu{display:none!important;}

/* ══════════ 본문 셸 ══════════ */
.main{max-width:var(--maxw);margin:0 auto;padding:22px 28px 80px;min-height:60vh;}
.viewhead{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin:0 0 18px;}   /* 부제가 우측 끝으로 날아가 읽기 나빴다 → 제목 바로 아래로 */
.viewhead h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.25;}
.viewhead .sub{margin:4px 0 0;font-size:13px;color:var(--ink-3);line-height:1.6;}
.viewhead .sub b{color:var(--ink-2);font-weight:700;font-family:var(--mono);font-size:12.5px;font-feature-settings:"tnum";}
.main.has-hero .viewhead{display:none;}
.loading{padding:60px 0;text-align:center;color:var(--ink-3);font-size:14px;}

/* ══════════ KPI 카드 — 구 '상태 스트립' 승격 ══════════ */
.strip{margin:0 0 20px;}
.strip-in{display:flex;flex-wrap:wrap;gap:10px;}
.sc{flex:1 1 160px;min-width:150px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:15px 18px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;
  font-family:inherit;text-align:left;transition:.18s var(--ease);position:relative;overflow:hidden;}
.sc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line-2);
  transform:scaleX(0);transform-origin:left;transition:transform .28s var(--ease);}
.sc:hover{border-color:var(--line-3);transform:translateY(-2px);box-shadow:var(--sh-md);}
.sc:hover::after{transform:scaleX(1);}
.sc .v{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.03em;
  font-feature-settings:"tnum";color:var(--ink);}
.sc .l{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em;}
.sc.hot .v{color:var(--accent);} .sc.hot::after{background:var(--accent);}
.sc.ok .v{color:var(--ok);} .sc.ok::after{background:var(--ok);}
.sc[hidden]{display:none;}
.sc-end{flex:1 0 100%;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);
  padding:3px 2px 0;cursor:default;}
.sc-end::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;}
.sc-end.off::before{background:var(--line-3);}

/* ══════════ 패널 — v4의 핵심. 영역은 면으로 나눈다 ══════════ */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-xs);overflow:hidden;}
.panel-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);
  background:var(--surface);}
.panel-h h2{font-size:16.5px;font-weight:700;letter-spacing:-.022em;margin:0;line-height:1.35;}
.panel-h .pn{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-3);
  background:var(--surface-2);border-radius:99px;padding:2px 9px;font-feature-settings:"tnum";}
.panel-h .sp{flex:1;}
.panel-b{padding:16px 20px 18px;}
.panel-b.flush{padding:0;}
.panel-f{padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2);}

/* 링크형 작은 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;
  border-radius:var(--r-sm);white-space:nowrap;}
.btn .ic{width:14px;height:14px;}
.btn:hover{border-color:var(--line-3);color:var(--ink);background:var(--surface-2);}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:transparent;}
.btn.primary:hover{background:var(--accent);}
.btn.wide{width:100%;}

/* ══════════ 오늘 — 2컬럼 (1920 기준) ══════════ */
.front{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(340px,1fr);gap:20px;align-items:start;}
.side{display:flex;flex-direction:column;gap:20px;min-width:0;padding:0;}
.lead-col{min-width:0;padding:0;border:0;}
/* 사이드 요약 행(오늘의 데스크·큐) */
.srow{display:flex;gap:11px;padding:11px 0;align-items:flex-start;border-bottom:1px solid var(--line);}
.srow:first-child{padding-top:0;} .srow:last-child{border-bottom:0;padding-bottom:0;}
.srow .p{font-size:12.5px;font-weight:700;color:var(--paper);background:var(--ink);border-radius:6px;
  padding:3px 8px;flex:none;letter-spacing:-.01em;line-height:1.4;}
.srow .p.a{background:var(--accent);color:var(--on-brand);}
.srow .p.cat{background:var(--ac-fill);color:var(--ac-fg);}   /* 토픽 데스크 분류 라벨(라이트/다크 자동 반전) */
.srow .p.q{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-2);
  font-family:var(--mono);font-size:11px;}
.srow>span:last-child{color:var(--ink-2);font-size:14px;line-height:1.68;min-width:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.srow b{color:var(--ink);font-weight:700;}
.srow .dim{color:var(--ink-3);font-size:12px;}
.srow-empty{font-size:13.5px;color:var(--ink-3);padding:26px 0;text-align:center;}
/* 서고 패널 */
.vault{display:block;width:100%;text-align:left;border:1px solid transparent;font-family:inherit;
  background:linear-gradient(150deg,#26221E,#171412 70%);color:#F3F0EB;border-radius:var(--r-lg);
  padding:20px 22px;cursor:pointer;transition:.2s var(--ease);box-shadow:var(--sh-sm);}
.vault:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);}
.vault .vk{display:block;font-size:12px;font-weight:600;opacity:.62;letter-spacing:-.005em;}
.vault .vn{display:block;font-family:var(--mono);font-size:38px;font-weight:700;line-height:1.05;
  margin-top:6px;letter-spacing:-.035em;font-feature-settings:"tnum";}
.vault .vl{display:block;font-size:12.5px;line-height:1.65;opacity:.68;margin-top:6px;}
.vault .vbars{display:flex;gap:4px;margin-top:16px;height:44px;align-items:flex-end;}
.vault .vbars i{flex:1;border-radius:3px 3px 0 0;opacity:.88;min-height:4px;transition:opacity .2s var(--ease);}
.vault:hover .vbars i{opacity:1;}
:root[data-theme="dark"] .vault{background:linear-gradient(150deg,var(--surface-2),var(--surface) 70%);
  border-color:var(--line-2);color:var(--ink);}

/* ══════════ 툴바 ══════════ */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.tcount{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);}
.tcount .ic{width:15px;height:15px;}
.tcount b{color:var(--ink-2);font-weight:700;}
.tools-r{display:flex;gap:7px;flex-wrap:wrap;}
.sbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;border-radius:var(--r-sm);white-space:nowrap;}
.sbtn .ic{width:14px;height:14px;}
.sbtn:hover{border-color:var(--line-3);color:var(--ink);background:var(--surface-2);}
.sbtn.on{background:var(--ink);color:var(--paper);border-color:transparent;}

/* ══════════ 목록 — 행 ══════════ */
.feed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--sh-xs);}
.panel .feed{border:0;border-radius:0;box-shadow:none;background:transparent;}
.card{position:relative;display:grid;grid-template-columns:4px 132px minmax(0,1fr) 172px 66px 78px;
  gap:16px;align-items:center;padding:0 20px 0 0;min-height:58px;border-bottom:1px solid var(--line);
  transition:background-color .14s var(--ease);}
.card:last-child{border-bottom:0;}
.card:hover{background:var(--surface-2);}
.card>*,.card .c-top>*{grid-row:1;}
.card .c-top{display:contents;}
/* 좌측 작성자 색 바 — hover 시 자란다 */
.card::before{content:"";grid-column:1;grid-row:1;align-self:stretch;background:var(--ac,var(--line-2));
  opacity:.55;transition:opacity .18s var(--ease);}
.card:hover::before{opacity:1;}
.card.pub::before{background:var(--ok);} .card.hidden-on::before{background:var(--line-3);}
.card .who{grid-column:2;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;min-width:0;}
.card .who .av{width:24px;height:24px;}
.card .who .wnm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
.card .c-title{grid-column:3;margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.018em;line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink);}
.card:hover .c-title{color:var(--accent);}
.card .c-ex{display:none;}
.card .chip{grid-column:4;justify-self:start;font-size:12.5px;font-weight:500;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px 11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.card .chip:empty{display:none;}
.card:hover .chip{background:var(--surface-3);}
.card .c-meta{grid-column:5;display:flex;justify-content:flex-end;font-family:var(--mono);font-size:12px;
  color:var(--ink-3);font-feature-settings:"tnum";}
.card .c-meta .m{display:none;}
.card .c-meta .m.rm{display:inline-flex;gap:5px;align-items:center;}
.card .c-meta .m.rm .ic{width:12px;height:12px;}
.card .badge-new,.card .badge-pub,.card .badge-hid{grid-column:6;justify-self:start;}
/* 배지 */
.badge-new,.badge-pub,.badge-hid{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  letter-spacing:-.005em;padding:3.5px 9px;border-radius:99px;white-space:nowrap;flex:none;line-height:1.35;}
.badge-new{background:var(--info-weak);color:var(--info);}
.badge-pub{background:var(--ok-weak);color:var(--ok);}
.badge-hid{background:var(--surface-2);color:var(--ink-3);border:1px dashed var(--line-2);}
.badge-pub .ic,.badge-hid .ic{width:11px;height:11px;}
.card.pub{opacity:.72;} .card.pub:hover{opacity:1;}
.card.hidden-on{opacity:.6;} .card.hidden-on:hover{opacity:.95;}

/* 갤러리 모드 */
.feed.grid{border:0;background:transparent;box-shadow:none;border-radius:0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.panel .feed.grid{padding:16px 20px 18px;}
.feed.grid .card{display:block;grid-template-columns:none;padding:18px 20px 17px;min-height:0;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-xs);}
.feed.grid .card:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--line-2);}
.feed.grid .card::before{position:absolute;top:18px;left:0;width:3px;height:22px;border-radius:0 3px 3px 0;opacity:1;}
.feed.grid .card .c-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px;}
.feed.grid .card .who,.feed.grid .card .chip,.feed.grid .card .c-title,.feed.grid .card .c-meta,
.feed.grid .card .badge-new,.feed.grid .card .badge-pub,.feed.grid .card .badge-hid{grid-column:auto;justify-self:auto;}
.feed.grid .card .c-title{white-space:normal;font-size:16px;line-height:1.45;margin:0 0 9px;}
.feed.grid .card .c-ex{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin:0 0 12px;font-size:13px;line-height:1.72;color:var(--ink-2);}
.feed.grid .card .c-meta{justify-content:flex-start;gap:12px;flex-wrap:wrap;}
.feed.grid .card .c-meta .m{display:inline-flex;align-items:center;gap:5px;}
.feed.grid .card .c-meta .ic{width:13px;height:13px;}
.feed.grid .card .c-meta .edited{color:var(--accent);}

/* 머리기사(.feat) — v4에서 화면에선 미사용. 잔존 호출 대비 최소 스타일만 유지 */
.feat{position:relative;display:block;padding:20px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);margin-bottom:16px;}
.feat .f-k{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px;}
.feat .f-title{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.35;margin:0 0 10px;}
.feat .f-ex{font-size:14px;line-height:1.8;color:var(--ink-2);margin:0 0 12px;}
.feat .c-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px;}
.feat .c-meta{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-3);}
.feat .c-meta .m{display:inline-flex;align-items:center;gap:5px;}

/* 아바타 */
.av{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;display:block;background:var(--surface-2);
  box-shadow:inset 0 0 0 2px var(--ac,var(--line-2)), 0 0 0 2px var(--surface);}
.av img{width:100%;height:100%;object-fit:cover;display:block;}
.av-fb{display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;
  color:var(--ac-fg);background:var(--ac-fill);box-shadow:0 0 0 2px var(--surface);}
.av.s{width:22px;height:22px;} .av.s.av-fb{font-size:10.5px;}
.av.xl{width:64px;height:64px;} .av.xl.av-fb{font-size:27px;}
.who.has-av{display:inline-flex;align-items:center;gap:8px;}

/* ══════════ 작성자 헤더 ══════════ */
.whero{display:flex;align-items:center;gap:20px;padding:22px 24px;border:1px solid var(--line);
  border-radius:var(--r-lg);background:linear-gradient(105deg,color-mix(in srgb,var(--ac) 12%,var(--surface)),var(--surface) 52%);
  position:relative;overflow:hidden;margin-bottom:18px;box-shadow:var(--sh-xs);}
.whero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ac);}
.whero-tx{flex:1;min-width:0;}
.whero-name{font-size:24px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:11px;
  line-height:1.25;flex-wrap:wrap;}
.whero-plat{font-size:11.5px;font-weight:700;background:var(--ac-fill);color:var(--ac-fg);
  border-radius:99px;padding:4px 11px;letter-spacing:-.01em;}
.whero-tag{font-size:13.5px;color:var(--ink-2);margin-top:5px;}
.whero-cnt{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-top:7px;font-feature-settings:"tnum";}

/* ══════════ 서고 클러스터 ══════════ */
.clus{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:11px;margin-bottom:20px;}
.cl{border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;background:var(--surface);
  cursor:pointer;transition:.18s var(--ease);text-align:left;font-family:inherit;box-shadow:var(--sh-xs);}
.cl:hover{border-color:var(--ac,var(--line-3));transform:translateY(-3px);box-shadow:var(--sh-md);}
.cl.on{border-color:var(--ac,var(--ink));box-shadow:0 0 0 2px color-mix(in srgb,var(--ac,var(--ink)) 30%,transparent);}
.cl .cn{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.018em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--ink);}
.cl .cc{display:flex;align-items:baseline;gap:6px;margin-top:7px;}
.cl .cv{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ac-ink);font-feature-settings:"tnum";
  letter-spacing:-.03em;}
.cl .cu{font-size:12px;color:var(--ink-3);}
.cl .cbar{display:block;height:4px;border-radius:3px;background:var(--surface-3);margin-top:10px;overflow:hidden;}
.cl .cbar i{display:block;height:100%;background:var(--ac,var(--accent));border-radius:3px;
  transition:width .5s var(--ease);}

/* ══════════ 페이저 ══════════ */
.pager{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:22px;flex-wrap:wrap;}
.pager button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink-2);font-family:var(--mono);font-size:12.5px;font-weight:600;min-width:36px;height:36px;
  padding:0 11px;border-radius:var(--r-sm);cursor:pointer;transition:.15s var(--ease);font-feature-settings:"tnum";}
.pager button .ic{width:13px;height:13px;}
.pager button:hover:not(:disabled){border-color:var(--line-3);color:var(--ink);background:var(--surface-2);}
.pager button:disabled{opacity:.35;cursor:default;}
.pager button.cur{background:var(--ink);color:var(--paper);border-color:transparent;}
.pager .gap{color:var(--ink-3);padding:0 4px;font-family:var(--mono);}

/* ══════════ 빈 상태 ══════════ */
.empty{padding:52px 20px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r-lg);
  background:var(--surface);}
.panel .empty{border:0;background:transparent;padding:34px 20px;}
.empty-il{width:112px;height:112px;object-fit:contain;margin:0 auto 14px;opacity:.9;}
.empty-msg{font-size:14px;color:var(--ink-2);line-height:1.8;}

/* ══════════ 트렌드 ══════════ */
.news{display:block;}
.masthead{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:20px 24px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:var(--sh-xs);}
.masthead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ac,var(--accent));}
.masthead .mk{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ac-ink,var(--accent));}
.masthead .mk .ic{width:15px;height:15px;}
.masthead .mt{font-size:20px;font-weight:800;letter-spacing:-.028em;margin-top:8px;line-height:1.35;}
.masthead .ms{font-size:13.5px;color:var(--ink-2);line-height:1.75;margin-top:8px;max-width:88ch;}
.dpager{display:flex;align-items:center;gap:9px;padding:11px 15px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);margin-bottom:16px;box-shadow:var(--sh-xs);}
.dpsel{flex:1;border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:14px;
  font-weight:700;text-align:center;outline:none;cursor:pointer;}
.dpbtn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-family:inherit;font-size:13px;font-weight:600;
  border-radius:var(--r-sm);cursor:pointer;transition:.15s var(--ease);}
.dpbtn .ic{width:13px;height:13px;}
.dpbtn:hover:not(:disabled){border-color:var(--line-3);color:var(--ink);background:var(--surface-2);}
.dpbtn:disabled{opacity:.35;cursor:default;}
.dpos{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex:none;font-feature-settings:"tnum";}
/* ── 일간 토픽 데스크 (2026-08-14 전면 개편) ─────────────────────────────
   구조: 에디션 마스트헤드 → 일자 페이저 → 분류 4섹션(신작·업데이트·화제·콘솔) → 주제 카드.
   카드는 '트레이 안의 판' 구조(외곽 셸 = surface-2 + 내부 코어 = surface)로 물리적 깊이를 만든다.
   ★hover 로만 나타나는 컨트롤 없음 — [발주 요청]은 항상 보인다(터치 기기 대응, DESIGN.md §6). */
.ed-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;}
.ed-stat{display:inline-flex;align-items:baseline;gap:7px;padding:6px 13px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);}
.ed-stat b{font-family:var(--mono);font-size:14.5px;font-weight:700;color:var(--cc,var(--ink));
  font-feature-settings:"tnum";line-height:1;}
/* 데스크 노트 — 08-14~09-01 은 1,100~3,700자 한 문단이라 화면에서 벽이 됐다(사용자 지적 09-02).
   이제 줄 목록으로 그린다. 줄마다 앞에 표식을 두어 '어디서 끊기는지'를 눈으로 잡게 한다. */
.ed-note{margin:15px 0 0;padding:12px 15px 12px 15px;border-radius:var(--r-sm);background:var(--surface-2);
  border-left:3px solid var(--accent);font-size:13.5px;line-height:1.7;color:var(--ink-2);
  word-break:keep-all;list-style:none;display:grid;gap:8px;}
.ed-note li{position:relative;padding-left:15px;}
.ed-note li::before{content:"";position:absolute;left:3px;top:0.62em;width:4px;height:4px;border-radius:50%;
  background:var(--ink-3);}
/* ★ 줄 = "확인 못 했다·빼 두었다" 경고. 사실 줄과 같은 굵기로 두면 안 읽힌다. */
.ed-note li.warn{color:var(--ink);}
.ed-note li.warn::before{content:"!";left:1px;top:0;width:auto;height:auto;border-radius:0;background:none;
  font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--warn);line-height:1.7;}
.ed-note b{color:var(--ink);}
.ed-empty{padding:34px 20px;text-align:center;font-size:13.5px;color:var(--ink-3);line-height:1.8;}

.tsec{margin-bottom:20px;}
.tsec-h{display:flex;align-items:center;gap:11px;padding:14px 20px;border:1px solid var(--line);border-bottom:0;
  border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--surface);position:relative;overflow:hidden;}
.tsec-h::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac,var(--accent));}
.tsec-ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;
  border-radius:10px;color:var(--ac-ink);
  background:color-mix(in srgb,var(--ac,var(--accent)) 13%,var(--surface));
  border:1px solid color-mix(in srgb,var(--ac,var(--accent)) 24%,var(--surface));}
.tsec-ic .ic{width:16px;height:16px;}
.tsec-t{font-size:16.5px;font-weight:700;letter-spacing:-.022em;color:var(--ink);}
.tsec-d{font-size:12.5px;color:var(--ink-3);margin-left:2px;}
.tsec-n{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ac-ink);
  background:color-mix(in srgb,var(--ac,var(--accent)) 11%,var(--surface));border-radius:999px;
  padding:4px 11px;font-feature-settings:"tnum";flex:none;}
.tsec-b{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-lg) var(--r-lg);
  background:var(--surface);padding:16px 18px 18px;box-shadow:var(--sh-xs);}
/* ── 꼭 다룰 게임 상자 (2026-08-15 신설) ──
   트렌드 탭 최상단. 여기 적은 게임은 다음 회차 데스크가 게임마다 주제 3~5개를 반드시 낸다.
   ★설명문을 넣지 않는다(회사 규칙) — 남긴 한 줄 "다음 회차부터"는 읽지 않으면 잘못 쓰게 되는 정보다
     (오늘 판에 즉시 반영된다고 오해하는 게 이 UI 의 유일한 함정). */
.pinbox{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  box-shadow:var(--sh-xs);overflow:hidden;margin-bottom:18px;}
.pin-h{display:flex;align-items:center;gap:10px;padding:13px 18px;position:relative;
  background:color-mix(in srgb,var(--ac) 7%,var(--surface));border-bottom:1px solid var(--line);}
.pin-h::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac);}
.pin-ic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;
  border-radius:8px;color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,var(--surface));}
.pin-ic .ic{width:15px;height:15px;}
.pin-t{font-size:15.5px;font-weight:700;letter-spacing:-.022em;color:var(--ink);}
.pin-note{font-size:12.5px;color:var(--ink-3);letter-spacing:-.01em;}
.pin-n{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink-3);
  font-feature-settings:"tnum";flex:none;}
.pin-n.full{color:var(--ac);}
.pin-b{padding:14px 18px 16px;}
.pin-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.pin-chip{display:inline-flex;align-items:center;gap:3px;padding:5px 5px 5px 12px;border-radius:999px;
  background:color-mix(in srgb,var(--ac) 9%,var(--surface));
  border:1px solid color-mix(in srgb,var(--ac) 32%,transparent);max-width:100%;}
.pin-nm{font-size:13.5px;font-weight:700;letter-spacing:-.015em;color:var(--ac-ink,var(--ink));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pin-x{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;
  border:0;border-radius:50%;background:transparent;color:var(--ink-3);cursor:pointer;transition:.15s var(--ease);}
.pin-x .ic{width:12px;height:12px;stroke-width:2.4;}
.pin-x:hover{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ink);}
.pin-x:disabled{opacity:.4;cursor:default;}
.pin-add{display:flex;gap:8px;align-items:center;}
.pin-i{flex:1;min-width:0;height:40px;padding:0 14px;font:inherit;font-size:14px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-sm);
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease);}
.pin-i::placeholder{color:var(--ink-4,var(--ink-3));}
.pin-i:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent);}
.pin-i:disabled{background:var(--surface-2);color:var(--ink-3);}
.pin-go{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;flex:none;
  border:0;border-radius:var(--r-sm);background:var(--ink);color:var(--paper);font:inherit;font-size:13.5px;
  font-weight:700;letter-spacing:-.015em;cursor:pointer;white-space:nowrap;transition:.2s var(--ease);}
.pin-go .ic{width:14px;height:14px;stroke-width:2.4;}
.pin-go:hover:not(:disabled){background:var(--ac);color:var(--on-brand,var(--paper));}
.pin-go:disabled{opacity:.42;cursor:default;}
@media(max-width:600px){
  .pin-h{padding:12px 15px;gap:8px;flex-wrap:wrap;}
  .pin-note{order:3;flex-basis:100%;}
  .pin-b{padding:13px 15px 15px;}
  .pin-add{flex-wrap:wrap;}
  .pin-i{flex-basis:100%;}
  .pin-go{flex:1;justify-content:center;}
}

/* ── 주제 목록 (2026-08-14 2차 목록 전환 → 08-15 3차 간소화) ──
   08-14: 카드 그리드는 게임명이 흩어져 세로로 훑을 수가 없어 **게임명을 고정 열로** 세웠다.
   08-15(사용자 지시): 그 위에 남아 있던 플랫폼·화제도·작성자·왜지금·목적·시점·출처를 **전부 뺐다**.
     "불필요한 설명이 많아 모바일에서 보기 힘들다" — 훑는 자리에 판단 재료를 다 얹으면 훑을 수가 없다.
     그 정보는 사라진 게 아니라 [발주 요청] 모달(.rf-brief)로 옮겨 갔다.
   열 = 4px 색바 · 게임명 · 주제(+겹침 경고) · 발주 */
.tlist{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-lg) var(--r-lg);
  background:var(--surface);box-shadow:var(--sh-xs);overflow:hidden;}
.trow{display:grid;grid-template-columns:4px 170px minmax(0,1fr) auto;align-items:center;
  gap:0 15px;padding:0 16px 0 0;border-bottom:1px solid var(--line);
  transition:background .16s var(--ease);}
.trow:last-child{border-bottom:0;}
.trow:hover{background:var(--surface-2);}
/* ★모든 셀에 grid-row:1 — DESIGN.md Row 규칙. 안 하면 메타가 2행으로 흘러 줄이 깨진다. */
.trow>*{grid-row:1;}
.tr-bar{align-self:stretch;background:var(--ac,var(--accent));opacity:.5;transition:opacity .16s var(--ease);}
.trow:hover .tr-bar{opacity:1;}
.tr-g{min-width:0;padding:13px 0;font-size:14px;font-weight:700;letter-spacing:-.02em;
  color:var(--ac-ink);line-height:1.4;word-break:keep-all;}
.tr-m{min-width:0;padding:13px 0;display:flex;align-items:center;gap:8px;}
.tr-h{min-width:0;font-size:14.5px;font-weight:600;line-height:1.5;letter-spacing:-.018em;
  color:var(--ink);word-break:keep-all;}
.tr-heat{display:inline-flex;align-items:center;gap:3px;}
.tr-heat i{width:5px;height:5px;border-radius:50%;background:var(--line-2);}
.tr-heat i.on{background:var(--ac,var(--accent));}
/* 겹침 경고 — 행에 유일하게 남긴 메타. 아이콘+숫자만(제목은 title 툴팁), 색만으로 뜻을 전하지 않게 숫자를 둔다. */
.tr-warn{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:12px;font-weight:700;
  color:var(--warn);background:var(--warn-weak);
  border:1px solid color-mix(in srgb,var(--warn) 34%,transparent);
  border-radius:var(--r-xs);padding:2px 7px;cursor:help;font-feature-settings:"tnum";}
.tr-warn .ic{width:12px;height:12px;flex:none;}
.tr-a{display:flex;align-items:center;gap:7px;justify-content:flex-end;padding:13px 0;}
.tr-req{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 5px 0 13px;
  border:0;border-radius:999px;background:var(--ink);color:var(--paper);font:inherit;font-size:13px;
  font-weight:700;cursor:pointer;letter-spacing:-.015em;white-space:nowrap;
  transition:background .28s var(--ease),color .28s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease);}
.tr-req .lbl{white-space:nowrap;}
.tr-req .knob{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;
  border-radius:50%;background:color-mix(in srgb,var(--paper) 20%,transparent);
  transition:transform .34s var(--ease),background .28s var(--ease);}
.tr-req .knob .ic{width:13px;height:13px;}
.tr-req:hover{background:var(--accent);color:var(--on-brand);transform:translateY(-1px);box-shadow:var(--sh-sm);}
.tr-req:hover .knob{transform:translate(2px,-1px) scale(1.07);
  background:color-mix(in srgb,var(--on-brand) 22%,transparent);}
.tr-req:active{transform:translateY(0) scale(.985);}
.tr-req.done{background:var(--ok);color:var(--paper);cursor:default;}
.tr-req.done:hover{transform:none;box-shadow:none;background:var(--ok);color:var(--paper);}
.tr-req.done:hover .knob{transform:none;}
/* 860px: 게임 열을 좁힌다 · 620px: 게임명↑/주제↓ 2줄 + 발주 버튼은 오른쪽에 두 줄 걸침.
   ★행이 세 요소뿐이라 옛 3단 스택(게임/주제/버튼)이 필요 없어졌다 — 모바일에서 한 항목이 3줄→2줄로 줄었다. */
@media(max-width:860px){
  .trow{grid-template-columns:4px 140px minmax(0,1fr) auto;gap:0 12px;padding-right:14px;}
}
@media(max-width:620px){
  .trow{grid-template-columns:4px minmax(0,1fr) auto;grid-template-areas:"bar game act" "bar main act";
    gap:0 12px;padding:0 14px 0 0;}
  .trow>*{grid-row:auto;}
  .tr-bar{grid-area:bar;}
  .tr-g{grid-area:game;padding:11px 0 0;font-size:12.5px;}
  .tr-m{grid-area:main;padding:2px 0 11px;align-items:flex-start;}
  .tr-h{font-size:14px;}
  .tr-warn{margin-top:2px;}
  .tr-a{grid-area:act;padding:0;}
  .tr-req{height:34px;padding:0 4px 0 11px;font-size:12.5px;}
  .tr-req .knob{width:24px;height:24px;}
}
@media(max-width:720px){ .tsec-h{padding:13px 15px;} }
@media(max-width:600px){ .tsec-d{display:none;} }   /* 분류 설명은 좁은 화면에서 접는다(라벨+아이콘으로 충분) */

/* ── 발주 요청 모달 ── */
.mdl-back{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;
  padding:24px;background:color-mix(in srgb,var(--ink) 48%,transparent);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  opacity:0;transition:opacity .28s var(--ease);}
.mdl-back.on{opacity:1;}
.mdl{width:min(640px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:22px;padding:6px;
  box-shadow:var(--sh-lg);opacity:0;transform:translateY(20px) scale(.982);
  transition:transform .42s var(--ease),opacity .3s var(--ease);}
.mdl-back.on .mdl{opacity:1;transform:none;}
.mdl-core{display:flex;flex-direction:column;min-height:0;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;}
.mdl-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 15px;border-bottom:1px solid var(--line);flex:none;}
.mdl-h .hic{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none;
  border-radius:11px;color:var(--ac-ink);background:color-mix(in srgb,var(--ac,var(--accent)) 13%,var(--surface));
  border:1px solid color-mix(in srgb,var(--ac,var(--accent)) 24%,var(--surface));}
.mdl-h .hic .ic{width:17px;height:17px;}
.mdl-ht{font-size:16.5px;font-weight:700;letter-spacing:-.022em;line-height:1.35;}
.mdl-hs{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.6;word-break:keep-all;}
.mdl-x{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;
  border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink-3);
  cursor:pointer;transition:.18s var(--ease);}
.mdl-x .ic{width:15px;height:15px;}
.mdl-x:hover{border-color:var(--line-3);color:var(--ink);background:var(--surface-2);}
.mdl-b{padding:18px 20px 20px;overflow-y:auto;flex:1;min-height:0;}
.mdl-b .rf-sec:first-of-type{margin-top:0;}
.mdl-f{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);
  background:var(--surface-2);border-radius:0 0 15px 15px;flex:none;flex-wrap:wrap;}
.mdl-go{flex:1;min-width:170px;display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 6px 0 18px;
  border:0;border-radius:999px;background:var(--ink);color:var(--paper);font:inherit;font-size:14px;font-weight:700;
  cursor:pointer;transition:background .28s var(--ease),color .28s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease);}
.mdl-go .lbl{flex:1;text-align:left;}
.mdl-go .knob{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;
  border-radius:50%;background:color-mix(in srgb,var(--paper) 20%,transparent);
  transition:transform .34s var(--ease),background .28s var(--ease);}
.mdl-go .knob .ic{width:15px;height:15px;}
.mdl-go:hover:not(:disabled){background:var(--accent);color:var(--on-brand);transform:translateY(-1px);box-shadow:var(--sh-md);}
.mdl-go:hover:not(:disabled) .knob{transform:translate(2px,-1px) scale(1.07);
  background:color-mix(in srgb,var(--on-brand) 22%,transparent);}
.mdl-go:active:not(:disabled){transform:translateY(0) scale(.985);}
.mdl-go:disabled{opacity:.55;cursor:default;}
.mdl-cancel{display:inline-flex;align-items:center;height:44px;padding:0 18px;border:1px solid var(--line-2);
  border-radius:999px;background:var(--surface);color:var(--ink-2);font:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:.18s var(--ease);}
.mdl-cancel:hover{border-color:var(--line-3);color:var(--ink);background:var(--surface-2);}
.mdl-copy{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 15px;border:1px solid var(--line-2);
  border-radius:999px;background:var(--surface);color:var(--ink-2);font:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:.18s var(--ease);}
.mdl-copy .ic{width:14px;height:14px;}
.mdl-copy:hover{border-color:var(--line-3);color:var(--ink);background:var(--surface-2);}
.mdl-msg{width:100%;font-size:13px;line-height:1.7;color:var(--ink-2);}
.mdl-msg.err{color:var(--bad);font-weight:600;} .mdl-msg.ok{color:var(--ok);font-weight:600;}
/* 주제 브리핑 — 08-15 개편에서 목록 행이 버린 맥락이 여기 모인다(훑는 자리 ≠ 정하는 자리). */
.rf-brief{border:1px solid var(--line);border-radius:var(--r-md,10px);background:var(--surface-2);
  padding:13px 15px;margin-bottom:18px;}
.rf-bh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.rf-bg{font-size:14.5px;font-weight:700;letter-spacing:-.02em;color:var(--ac-ink,var(--ink));word-break:keep-all;}
.rf-bp{font-size:12.5px;font-weight:600;color:var(--ink-3);}
.rf-bw{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-3);font-feature-settings:"tnum";}
.rf-bwhy{font-size:13px;line-height:1.65;color:var(--ink-2);margin-top:7px;word-break:keep-all;}
/* 09-02: 왜지금·확인된 사실·각도를 라벨 붙은 줄로 세운다.
   전에는 detail 이 소재 메모 textarea 안에만 있어서, 발주할지 정하려면 스크롤부터 해야 했다. */
.rf-bf{display:grid;grid-template-columns:62px 1fr;gap:10px;margin-top:10px;align-items:baseline;}
.rf-bk{font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-3);white-space:nowrap;}
.rf-bv{font-size:13px;line-height:1.65;color:var(--ink-2);word-break:keep-all;display:grid;gap:5px;}
.rf-bl{display:block;}
.rf-bcau{margin-top:10px;padding:9px 12px;border-radius:var(--r-sm);background:var(--surface);
  border-left:3px solid var(--warn);font-size:12.5px;line-height:1.6;color:var(--ink-2);
  word-break:keep-all;display:grid;gap:5px;}
@media(max-width:520px){ .rf-bf{grid-template-columns:1fr;gap:3px;} }
.rf-bsrc{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:11px;}
.rf-bsrc a{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-3);
  text-decoration:none;border-bottom:1px solid var(--line-2);transition:.15s var(--ease);}
.rf-bsrc a .ic{width:11px;height:11px;}
.rf-bsrc a:hover{color:var(--accent);border-color:var(--accent);}
@media(max-width:640px){ .mdl-back{padding:12px;} .mdl{max-height:94vh;} .mdl-f{flex-direction:column-reverse;align-items:stretch;}
  .mdl-cancel,.mdl-copy{justify-content:center;} }
@media(prefers-reduced-motion:reduce){
  .titem,.ti-req,.ti-req .knob,.mdl,.mdl-back,.mdl-go,.mdl-go .knob{transition:none!important;}
  .titem:hover,.ti-req:hover,.mdl-go:hover{transform:none!important;}
  .mdl{opacity:1;transform:none;} .mdl-back{opacity:1;}
}

/* ══════════ 큐 ══════════ */
.q-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:52px 0;color:var(--ink-3);font-size:14px;}
.q-loading .ic{width:16px;height:16px;}
.q-maint{display:flex;gap:12px;padding:16px 18px;border:1px solid var(--warn);background:var(--warn-weak);
  border-radius:var(--r);margin-bottom:16px;}
.q-maint .ic{width:18px;height:18px;color:var(--warn);flex:none;margin-top:2px;}
.q-maint-tx{font-size:13.5px;line-height:1.75;}
.q-maint-tx b{display:block;color:var(--ink);margin-bottom:3px;}
.q-maint-tx span{color:var(--ink-2);}
.qstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.qstat{display:flex;flex-direction:column;gap:1px;padding:14px 17px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-xs);}
.qstat b{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.03em;
  font-feature-settings:"tnum";}
.qstat span{font-size:12.5px;font-weight:600;color:var(--ink-3);}
.qstat.s-received b{color:var(--info);} .qstat.s-processing b{color:var(--warn);} .qstat.s-failed b{color:var(--bad);}
.q-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.q-refresh{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-family:inherit;font-size:13px;font-weight:600;
  border-radius:var(--r-sm);cursor:pointer;transition:.15s var(--ease);}
.q-refresh .ic{width:14px;height:14px;}
.q-refresh:hover:not(:disabled){border-color:var(--line-3);color:var(--ink);background:var(--surface-2);}
.q-refresh:disabled{opacity:.6;cursor:default;}
.q-hint{font-size:12.5px;color:var(--ink-3);}
.q-sec{margin-bottom:22px;}
.q-sec-h{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:var(--ink);
  padding-bottom:11px;border-bottom:1px solid var(--line);margin:0 0 12px;letter-spacing:-.02em;}
.q-sec-h .ic{width:16px;height:16px;color:var(--ink-3);}
.q-sec-h span{font-weight:700;}
.q-sec-n{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink-3);background:var(--surface-2);
  border-radius:99px;padding:2px 10px;font-feature-settings:"tnum";}
.q-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:11px;}
.q-item{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:16px 18px 16px 21px;overflow:hidden;box-shadow:var(--sh-xs);transition:.16s var(--ease);}
.q-item:hover{border-color:var(--line-2);box-shadow:var(--sh-sm);}
.q-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--wac,var(--line-2));}

.q-cancel{display:inline-flex;align-items:center;gap:6px;margin-top:12px;height:32px;padding:0 12px;

/* ══════════ 큐 상단 — 작성자 사용량(발주·토큰) ══════════ */
/* 두 축의 출처가 다르다: 발주=백엔드 /requests 실측 · 토큰=_trend/_usage.json(데스크 회차가 굽는 «추정» 귀속).
   그래서 패널 머리에 «토큰=추정» 칩을 박는다 — 정확한 과금 분해로 읽히면 안 된다. */
.upan{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-xs);
  padding:13px 17px 15px;margin-bottom:16px;}
.upan-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:12px;}
.upan-h b{font-size:14px;font-weight:700;letter-spacing:-.02em;}
.upan-h .u-sub{font-size:12.5px;color:var(--ink-3);}
.upan-h .u-est{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink-3);background:var(--surface-2);
  border:1px solid var(--line);border-radius:99px;padding:2.5px 10px;}
.upan-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(158px,200px);gap:20px;align-items:start;}
.uch{min-width:0;}
.uch-t{display:flex;align-items:baseline;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 0 9px;}
.uch-t i{font-style:normal;font-family:var(--mono);font-weight:700;color:var(--ink-3);font-feature-settings:"tnum";}
.ucols{display:flex;gap:7px;align-items:flex-end;height:64px;}
.ucol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;}
.ustack{display:flex;flex-direction:column-reverse;gap:1px;width:100%;}
.ustack i{min-height:2px;border-radius:2px;opacity:.92;transition:opacity .15s var(--ease);}
.ucol:hover .ustack i,.ucol.on .ustack i{opacity:1;}
.ucol .zero{height:3px;border-radius:2px;background:var(--line-2);}
.uaxis{display:flex;gap:7px;margin-top:8px;}
.uaxis span{flex:1;min-width:0;text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--ink-3);
  font-feature-settings:"tnum";}
.uaxis span.on{color:var(--ink);font-weight:700;}
.uleg{display:flex;flex-direction:column;gap:8px;}
.uleg-r{display:flex;align-items:center;gap:9px;font-size:13px;line-height:1.35;min-width:0;}

.uleg-r .nm{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.uleg-r .vv{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap;
  font-feature-settings:"tnum";}
.uleg-r .vv em{font-style:normal;color:var(--ink-3);}
.uempty{display:flex;align-items:center;justify-content:center;height:64px;padding:0 12px;text-align:center;
  border:1px dashed var(--line-2);border-radius:var(--r-sm);font-size:12.5px;color:var(--ink-3);line-height:1.6;}
@media(max-width:1080px){
  .upan-b{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}

  .uleg-r{flex:1 1 190px;}
}

/* ══════════ 새 글 요청 ══════════ */
.reqwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:20px;align-items:start;}

.rc-t{font-size:18px;font-weight:800;letter-spacing:-.028em;}
.rc-s{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin-top:2px;}

.rf-l{display:block;font-size:13.5px;font-weight:700;margin:0 0 8px;letter-spacing:-.015em;}
.rf-req{color:var(--accent);} .rf-opt{color:var(--ink-3);font-weight:500;font-size:12.5px;}
.rf-i{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:14px;padding:11px 13px;outline:none;transition:.16s var(--ease);margin-bottom:16px;}
.rf-i:focus{border-color:var(--accent);box-shadow:var(--sh-ring);}
.rf-ta{min-height:104px;resize:vertical;line-height:1.75;}
.rf-hint{display:flex;gap:9px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;margin:-8px 0 18px;line-height:1.75;}
.rf-hint .ic{width:15px;height:15px;color:var(--ink-3);flex:none;margin-top:2px;}
.rf-hint.on{background:var(--accent-soft);border-color:var(--accent-line);} .rf-hint.on .ic{color:var(--accent);}
.rf-hint b{color:var(--ink);}
.rf-hint-list{align-items:flex-start;}
.rf-hl{margin:0;padding-left:18px;} .rf-hl li{margin-bottom:4px;}
.rf-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px;}
.rf-chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-family:inherit;font-size:13px;font-weight:600;
  border-radius:99px;cursor:pointer;transition:.15s var(--ease);white-space:nowrap;}
.rf-wchip{padding:0 15px 0 5px;}
.rf-chip .av{width:26px;height:26px;}
.rf-chip:hover{border-color:var(--ac,var(--line-3));color:var(--ink);background:var(--surface-2);}
.rf-chip.on{background:var(--ac-fill);border-color:transparent;color:var(--ac-fg);box-shadow:var(--sh-sm);}
.rf-chip-plat{font-size:12.5px;color:var(--ink-3);}
.rf-chip.on .rf-chip-plat{color:var(--ac-fg);opacity:.78;}
.rf-chip-dot{width:8px;height:8px;border-radius:50%;background:var(--ac,var(--line-2));}
.rf-winfo{font-size:12.5px;color:var(--ink-3);margin-bottom:18px;line-height:1.7;}
.rf-file{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:12px;}
.rf-fbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;border-radius:var(--r-sm);cursor:pointer;
  transition:.15s var(--ease);}
.rf-fbtn .ic{width:14px;height:14px;}
.rf-fbtn:hover{border-color:var(--line-3);color:var(--ink);background:var(--surface-2);}
.rf-fname{font-size:12.5px;color:var(--ink-3);}
.rf-fclear{border:0;background:transparent;color:var(--bad);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.rf-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}
.rf-submit{flex:1;min-width:180px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:var(--ink);color:var(--paper);border:0;border-radius:var(--r-sm);font-family:inherit;font-size:15px;
  font-weight:700;height:48px;cursor:pointer;transition:.15s var(--ease);}
.rf-submit .ic{width:16px;height:16px;}
.rf-submit:hover:not(:disabled){background:var(--accent);transform:translateY(-1px);box-shadow:var(--sh-md);}
.rf-submit:disabled{opacity:.6;cursor:default;}
.rf-push{display:inline-flex;align-items:center;gap:7px;height:48px;padding:0 18px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-family:inherit;font-size:14px;font-weight:700;
  border-radius:var(--r-sm);cursor:pointer;transition:.15s var(--ease);}
.rf-push .ic{width:15px;height:15px;}
.rf-push:disabled{opacity:.8;cursor:default;color:var(--ok);}
.rf-msg{font-size:13.5px;margin-top:16px;line-height:1.7;color:var(--ink-2);}
.rf-msg.err{color:var(--bad);} .rf-msg.ok{color:var(--ok);}
.reqlist{min-width:0;}
.rl-h{font-size:14px;font-weight:700;color:var(--ink);padding-bottom:11px;border-bottom:1px solid var(--line);
  margin-bottom:12px;letter-spacing:-.02em;}
.rl-item{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:16px 18px 40px;margin-bottom:10px;box-shadow:var(--sh-xs);}
.rl-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.rl-top b{font-size:14px;font-weight:600;letter-spacing:-.018em;line-height:1.55;min-width:0;}
.rl-sub{font-size:12.5px;color:var(--ink-3);line-height:1.7;display:flex;align-items:center;gap:6px;}

.rl-meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.75;}
.rl-meta a{color:var(--accent);font-weight:700;}
.rl-del{position:absolute;right:14px;bottom:12px;height:28px;padding:0 10px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-3);font-family:inherit;font-size:12px;font-weight:600;
  border-radius:var(--r-xs);cursor:pointer;transition:.15s var(--ease);}

/* ══════════ 푸터 · FAB ══════════ */
.site-foot{border-top:1px solid var(--line);background:var(--surface);margin-top:40px;padding:26px 28px 30px;
  text-align:center;font-size:12.5px;color:var(--ink-3);line-height:1.9;}

.fab .ic{width:17px;height:17px;}
.fab:hover{background:var(--accent);transform:translateY(-3px);}
.fab:active{transform:none;}
:root[data-theme="dark"] .fab{background:var(--accent);color:var(--on-brand);}

@media(prefers-reduced-motion: reduce){

/* ════════════════════════════════════════════════════════════
   부팅 시퀀스 (v4.1 · 2026-08-04)
   "프로그램이 켜지는 느낌" — 로고가 그려지고, 마음이 담기고, 화면이 열린다.
   세션당 1회(sessionStorage). 재방문·새로고침은 0.3초 페이드만.
   ★안전장치: 데이터 로드가 실패해도 타임아웃으로 반드시 걷힌다(§boot JS).
   ════════════════════════════════════════════════════════════ */
#boot{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;
  background:var(--paper);overflow:hidden;
  /* 종이 온기 — 중앙에서 은은하게 밝아지는 조명 */
  background-image:
    radial-gradient(120% 90% at 50% 42%, color-mix(in srgb,var(--accent) 7%,transparent), transparent 58%),
    radial-gradient(80% 60% at 50% 108%, color-mix(in srgb,var(--ink) 6%,transparent), transparent 60%);}
#boot[hidden]{display:none;}
/* 미세 그레인 — 크림 종이 질감 */
#boot::after{content:"";position:absolute;inset:-50%;pointer-events:none;opacity:.5;
  background-image:radial-gradient(currentColor .5px, transparent .5px);
  background-size:3px 3px;color:color-mix(in srgb,var(--ink) 7%,transparent);
  animation:bootGrain 6s steps(4) infinite;}
@keyframes bootGrain{0%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}
  50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0,0)}}

.boot-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;
  transform:translateY(-8px);}

/* ── 로고 마크: 노트 위에 두 줄이 그어지고, 하트가 얹힌다 ── */
.boot-mark{width:118px;height:118px;overflow:visible;}
.boot-mark .bm-plate{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;
  stroke-dasharray:145;stroke-dashoffset:145;
  animation:bmDraw .72s var(--ease) .12s forwards;}
.boot-mark .bm-fill{fill:var(--ink);opacity:0;transform-origin:50% 62%;
  animation:bmFill .5s var(--ease) .74s forwards;}
.boot-mark .bm-line{stroke:var(--paper);stroke-width:2.2;stroke-linecap:round;
  stroke-dasharray:18;stroke-dashoffset:18;}
.boot-mark .bm-line.l1{animation:bmDraw2 .34s var(--ease) 1.0s forwards;}
.boot-mark .bm-line.l2{stroke-dasharray:24;stroke-dashoffset:24;opacity:.5;
  animation:bmDraw2 .34s var(--ease) 1.16s forwards;}
.boot-mark .bm-heart{fill:var(--accent);opacity:0;transform-origin:75% 22%;
  animation:bmHeart .62s cubic-bezier(.34,1.7,.5,1) 1.34s forwards;}
@keyframes bmDraw{to{stroke-dashoffset:0}}
@keyframes bmDraw2{from{stroke-dashoffset:var(--sd,20)}to{stroke-dashoffset:0}}
@keyframes bmFill{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes bmHeart{0%{opacity:0;transform:scale(.2) translateY(6px)}
  60%{opacity:1;transform:scale(1.14) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}

/* ── 워드마크: 글자가 한 자씩 올라온다 ── */
.boot-wm{display:flex;align-items:baseline;gap:1px;font-size:44px;font-weight:800;
  letter-spacing:-.045em;color:var(--ink);line-height:1;}
.boot-wm span{display:inline-block;opacity:0;transform:translateY(14px);
  animation:bootChar .54s var(--ease) forwards;}
.boot-wm span:nth-child(1){animation-delay:1.52s}
.boot-wm span:nth-child(2){animation-delay:1.62s}
.boot-wm .dot{color:var(--accent);animation:bootDot .6s cubic-bezier(.34,1.8,.5,1) 1.78s forwards;}
@keyframes bootChar{to{opacity:1;transform:none}}
@keyframes bootDot{0%{opacity:0;transform:translateY(-16px) scale(.4)}
  70%{opacity:1;transform:translateY(2px) scale(1.2)}100%{opacity:1;transform:none}}
.boot-tag{font-size:13.5px;font-weight:500;color:var(--ink-3);letter-spacing:-.01em;
  opacity:0;animation:bootChar .5s var(--ease) 1.98s forwards;margin-top:-14px;}

/* ── 진행 바 ── */
.boot-bar{width:186px;height:3px;border-radius:99px;background:color-mix(in srgb,var(--ink) 11%,transparent);
  overflow:hidden;opacity:0;animation:bootChar .4s var(--ease) 2.1s forwards;}
.boot-bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--ink)));
  transition:width .34s var(--ease);}
.boot-status{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.02em;
  opacity:0;animation:bootChar .4s var(--ease) 2.16s forwards;min-height:1.2em;
  font-feature-settings:"tnum";}

/* ── 사운드 토글 ── */
.boot-snd{position:absolute;right:22px;top:22px;display:inline-flex;align-items:center;gap:7px;
  height:34px;padding:0 13px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink-3);font-family:inherit;font-size:12.5px;font-weight:600;border-radius:99px;
  cursor:pointer;transition:.15s var(--ease);opacity:0;animation:bootChar .4s var(--ease) 2.3s forwards;}

/* ════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════ */

  if(!boot) return;
  var body=document.body, barEl=document.getElementById("bootBar"),
      stEl=document.getElementById("bootStatus"), sndBtn=document.getElementById("bootSnd"),

  try{ FORCE=(location.search||"").indexOf("boot=1")>=0; }catch(e){}
  /* 로컬스토리지 1회용 플래그 — 주소창을 못 쓰는 자동화·검증 환경용 */
  try{ if(localStorage.getItem("sseudam_bootforce")==="1"){ FORCE=true; localStorage.removeItem("sseudam_bootforce"); } }catch(e){}
  if(FORCE){ try{ document.documentElement.setAttribute("data-motion","force"); }catch(e){} }
  var QUICK = FORCE ? false : (SEEN || REDUCED);

    try{ sessionStorage.setItem("sseudam_booted","1"); }catch(e){}

    step:function(label){
      hit++; paintBar();
      if(stEl && label && !ready) stEl.textContent=label;
    },
    ready:function(){ ready=true; hit=STEPS; paintBar(); tryFinish(); },
    finish:finish

 const RequestService={
   isConnected(){ return !!REQ_CFG.API_BASE; },
   list(){ return reqLoad().sort((a,b)=>b.createdAt-a.createdAt); },
   /* req: {purpose, topic, material, writer, source?, file?:File}. 첨부 있으면 multipart, 없으면 JSON.
      source 기본 'site'(새 글 요청 폼) · 트렌드 데스크 발주는 'trend-desk' 로 구분해 큐에서 출처가 보이게 한다. */
   async submit(req){
     const src=(req.source||"site").slice(0,32);
     const rec=Object.assign({id:"req_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),createdAt:Date.now(),status:"local",
       fileName:(req.file&&req.file.name)||null},
       {purpose:req.purpose,topic:req.topic,material:req.material,writer:req.writer,source:src});
     if(this.isConnected()){
       try{
         let res;
         if(req.file){
           const fd=new FormData();
           fd.append("topic",req.topic||""); fd.append("material",req.material||"");
           if(req.writer)fd.append("writer",req.writer);
           if(req.purpose)fd.append("purpose",req.purpose);
           fd.append("source",src);
           fd.append("attachment",req.file,req.file.name);
           res=await fetch(apiBase()+"/requests",{method:"POST",body:fd});
         }else{
           res=await fetch(apiBase()+"/requests",{method:"POST",headers:{"Content-Type":"application/json"},
             body:JSON.stringify({purpose:req.purpose,topic:req.topic,material:req.material,writer:req.writer,source:src})});
         }
         if(!res.ok)throw new Error("HTTP "+res.status);
         const body=await res.json().catch(()=>({}));
         rec.status="submitted"; rec.serverId=body.id||null;
       }catch(err){ rec.status=req.file?"failed":"queued"; rec.error=String((err&&err.message)||err); }
     }
     const all=reqLoad(); all.push(rec); reqSave(all); return rec;
   },
   remove(id){ reqSave(reqLoad().filter(r=>r.id!==id)); },
   /* 백엔드 GET /requests 로 내 요청들의 실제 상태를 동기화한다.

   async syncStatuses(){

     let remote;

         if(r.status!==rm.status){ r.status=rm.status; changed=true; }

 const PINS_MAX=8;
 const PIN_LS="sseudam_pins_cache";
 let PINS=[];                 /* 현재 지정 목록(순서 유지) — GET /pins 로 채움 */
 let PINS_AT=null;            /* 마지막 저장 시각(ms) — 서버 기준 */
 const PinSvc={
   isConnected(){ return !!REQ_CFG.API_BASE; },
   /* 캐시 우선 표시 → 서버 응답으로 교체. 오프라인에서도 상자가 비어 보이지 않게 한다. */
   loadCache(){ try{ const a=JSON.parse(localStorage.getItem(PIN_LS)||"[]"); if(Array.isArray(a))PINS=a.map(String).slice(0,PINS_MAX); }catch(_){ } },
   async load(){
     if(!this.isConnected())return;
     try{ const r=await fetch(apiBase()+"/pins?ts="+Date.now()); if(!r.ok)return;
          const d=await r.json(); if(!d||!Array.isArray(d.games))return;
          PINS=d.games.map(String).slice(0,PINS_MAX); PINS_AT=d.updatedAt||null;
          try{ localStorage.setItem(PIN_LS,JSON.stringify(PINS)); }catch(_){ } }catch(_){ }
   },
   /* 전체 교체 저장. 부분 연산(add/remove)이 아니라 최종 상태를 보내는 이유는 백엔드 주석 참조. */
   async save(games){

   refreshQueueBadge();   /* 큐 깊이 배지 + 스트립 큐 수치(백엔드 연결 시) */
 }).catch(e=>{

   titleEl.textContent="글"; subEl.textContent="목록을 불러오지 못했어요.";
   contentEl.innerHTML='<div class="empty">목록을 불러오지 못했어요(잠시 후 새로고침).<br>'+esc(String(e&&e.message||e))+'</div>';
 });

 /* ---------- 네비: 작성자 그룹 ‖ 코너 그룹 ---------- */
 /* 네비(v3 편집국) — 섹션 5개 + 작성자 색 칩 6개를 최상위에 평면 노출.
    구 '작성팀 ▾' 드롭다운은 폐기: 작성자 진입이 2클릭→1클릭이 되고, "색이 곧 출처"가 네비에서부터 보인다.
    아카이브는 드롭다운 안에서 최상위 '서고'로 승격(자산 666편이 2뎁스에 묻혀 있던 문제). */
 function buildNav(ordered){
   const cnt=n=>POSTS.filter(p=>p.author===n&&!isArchived(p)).length;   /* 작성자별=비아카이브만 */
   const writers=ordered.slice();
   const sel=v=>'[data-k="'+String(v).replace(/["\\]/g,"\\$&")+'"]';
   const allCnt=POSTS.filter(p=>!isArchived(p)).length;   /* 글=발행·숨김 뺀 글만 */
   const archCnt=POSTS.filter(isArchived).length;
   /* v4: 섹션은 세그먼트 컨트롤(하나의 면 안에서 선택), 작성자는 칩 — 두 종류의 선택을 형태로 구분한다 */
   let h=`<div class="nav-seg" role="tablist">`;
   h+=`<button data-k="__today__" role="tab">오늘</button>`;
   h+=`<button data-k="__all__" role="tab">글<span class="cnt">${allCnt}</span></button>`;
   h+=`<button data-k="__archive__" role="tab">서고<span class="cnt">${archCnt}</span></button>`;
   /* 트렌드 뱃지 = '오늘 고를 수 있는 주제 수'(최신 에디션 아이템 합). 누적 일수가 아니라 지금 쓸 거리를 센다. */
   h+=`<button data-k="__trend__" role="tab">트렌드<span class="cnt">${TREND.length?edItems(TREND[0]).length:0}</span></button>`;
   h+=`<button data-k="__queue__" role="tab">큐<span class="cnt" id="navQueueCnt" hidden></span></button>`;
   h+=`</div><span class="nav-div" aria-hidden="true"></span>`;
   h+=writers.map(n=>`<button class="wchip" data-k="${esc(n)}" style="--ac:${ACCENT[n]}">${avatar(n,"s")}${esc(n)}<span class="cnt">${cnt(n)}</span></button>`).join("");
   navEl.innerHTML=h;

   const teamMenu=document.getElementById("teamMenu");
   if(teamMenu){ teamMenu.innerHTML=""; teamMenu.hidden=true; }   /* 레거시 드롭다운 비활성 */

   function setActive(){
     navEl.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
     const nb=navEl.querySelector(sel(state.view)); if(nb)nb.classList.add("on");
     syncSegInd();
   }
   /* 세그먼트 선택 표시가 탭 사이를 미끄러진다 — 어디로 옮겨갔는지 눈이 따라간다 */
   function syncSegInd(){
     const seg=navEl.querySelector(".nav-seg"); if(!seg)return;
     let ind=seg.querySelector(".seg-ind");
     if(!ind){ ind=document.createElement("span"); ind.className="seg-ind"; ind.setAttribute("aria-hidden","true"); seg.prepend(ind); }
     const on=seg.querySelector("button.on");
     if(!on){ ind.style.opacity=0; return; }
     ind.style.opacity=1;
     ind.style.width=on.offsetWidth+"px";
     ind.style.transform="translateX("+(on.offsetLeft-seg.clientLeft)+"px)";
   }
   window.__syncSeg=syncSegInd;
   window.addEventListener("resize",()=>{ try{syncSegInd();}catch(_){} });
   window.__syncNav=setActive;   // 홈 로고 등 외부에서 활성 동기화
   setActive();
   const closeAll=()=>{};        // 드롭다운 폐기 — 호출부 호환용 no-op

   const goView=k=>{ state.view=k; state.q=""; state.page=1; if(qEl)qEl.value="";
     setActive();
     withTransition(()=>{ render(); window.scrollTo({top:0,behavior:"smooth"}); });
     try{ window.__sfx&&window.__sfx.tick(); }catch(_){} };
   navEl.querySelectorAll("button[data-k]").forEach(b=>b.addEventListener("click",()=>goView(b.dataset.k)));
   syncSegInd();

   const fab=document.getElementById("fabReq");   /* 새 글 요청 FAB → 어느 탭에서든 요청 폼으로 */
   if(fab&&!fab.__bound){ fab.__bound=1; fab.addEventListener("click",()=>goView("__request__")); }
   window.__goView=goView;   /* 외부(로고·딥링크·스트립)에서 뷰 전환 */
 }

 /* ---------- 상태 스트립 — 파이프라인 현황 1줄(구 A안 '관제 레인' 흡수) ----------
    ★표시하는 수치는 전부 실측만. 백엔드가 주지 않는 값(검수 대기 등)은 만들지 않는다.
      큐 대기/작성 중 = 백엔드 GET /requests, 나머지 = posts.json 파생. */
 let STRIP_Q={received:0,processing:0,ok:false};
 function paintStrip(){
   const el=document.getElementById("strip"); if(!el)return;
   const vis=POSTS.filter(p=>!isArchived(p));
   const newCnt=vis.filter(p=>p.ts&&(Date.now()-p.ts)<NEW_MS).length;
   const archCnt=POSTS.filter(isArchived).length;
   const pubCnt=POSTS.filter(p=>p.published).length;
   const cell=(v,l,k,cls,hide)=>`<button type="button" class="sc${cls?" "+cls:""}" data-go="${k}"${hide?" hidden":""}>`+
     `<span class="v" data-to="${v}">0</span><span class="l">${esc(l)}</span></button>`;
   el.innerHTML=
     cell(STRIP_Q.received,"큐 대기","__queue__","hot",!STRIP_Q.ok)+
     cell(STRIP_Q.processing,"작성 중","__queue__","",!STRIP_Q.ok)+
     cell(vis.length,"확인 대기","__all__","")+
     cell(newCnt,"24h 신규","__all__","")+
     cell(pubCnt,"발행 완료","__archive__","ok")+
     cell(archCnt-pubCnt,"숨김","__archive__","",(archCnt-pubCnt)<=0)+
     `<span class="sc-end${STRIP_Q.ok?"":" off"}">${STRIP_Q.ok?"백엔드 연결됨 · 큐 수치 실시간":"백엔드 미연결 — 큐 수치는 생략했어요"}</span>`;
   el.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
     if(window.__goView)window.__goView(b.dataset.go);
   }));
   countUp(el);
 }
 /* 숫자 카운트업 — 지표가 '살아 있다'는 신호. reduced-motion이면 즉시 확정값. */
 function countUp(scope){
   const slow=matchMedia("(prefers-reduced-motion: reduce)").matches;
   scope.querySelectorAll("[data-to]").forEach((el,i)=>{
     const to=+el.dataset.to||0;
     if(slow||to<=0){ el.textContent=to; return; }
     const dur=520+Math.min(360,to*1.4), t0=performance.now()+i*45;
     const tick=now=>{
       const p=Math.max(0,Math.min(1,(now-t0)/dur));
       el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
       if(p<1)requestAnimationFrame(tick);
     };
     el.textContent="0"; requestAnimationFrame(tick);
   });
 }
 qEl&&qEl.addEventListener("input",()=>{ state.q=qEl.value.trim().toLowerCase(); state.page=1; render(); });

 /* ---------- 카드 ---------- */
 function postCard(p,feat){
   const ac=ACCENT[p.author]||FALLBACK_AC;
   const title=p.title||p.topic||p.file;
   const dd=p.ts?fmtDay(p.created):"—";
   const isNew=p.ts && !p.published && (Date.now()-p.ts)<NEW_MS; /* 발행된 글엔 NEW 안 붙임 */
   const edited=p.uts && fmtDay(p.updated)!==fmtDay(p.created);
   const isHidden=HIDDEN.has(p.rel);
   /* .wnm = 이름 텍스트(행 모드에서 말줄임 필요). 아바타는 색, 이름은 잉크 — 색만으로 정보 전달하지 않는다. */
   const who=`<span class="who has-av" style="--ac:${ac}">${avatar(p.author,"s")}<span class="wnm">${esc(p.author)}</span></span>`;
   const newBadge=isNew?`<span class="badge-new">NEW</span>`:"";
   const pubBadge=p.published?`<span class="badge-pub">${svg("check")}발행됨</span>`:"";
   const hidBadge=isHidden?`<span class="badge-hid">${svg("eyeOff")}숨김</span>`:"";
   /* 우측 슬롯 1자리: 발행됨 우선, 없으면 NEW(피처 카드는 NEW 생략) */
   const rightBadge=pubBadge||(feat?"":newBadge)||hidBadge;
   const top=`<div class="c-top">${who}<span class="chip">${p.cat?esc(p.cat):""}</span>${rightBadge}</div>`;
   /* 행 모드는 .m.rm(읽기 시간)만 보이고 나머지는 CSS로 숨긴다 — 갤러리·머리기사에선 전부 노출 */
   const meta=`<div class="c-meta"><span class="m">${svg("calendar")}${esc(dd)} 등록</span>`+
     (edited?`<span class="m edited">수정 ${esc(fmtDay(p.updated))}</span>`:"")+
     (p.readmin?`<span class="m rm">${svg("clock")}${p.readmin}분</span>`:"")+`</div>`;
   const pubCls=(p.published?" pub":"")+(isHidden?" hidden-on":"");
   if(feat){
     return `<a class="feat${pubCls}" href="${enc(p.rel)}" style="--ac:${ac}" data-rel="${esc(p.rel)}" data-pub="${p.published?1:0}" data-autopub="${p.autopub?1:0}">`+
       `<div class="f-k">${svg("spark")}오늘의 머리기사</div>`+
       `<h2 class="f-title">${esc(title)}</h2>`+
       (p.excerpt?`<p class="c-ex f-ex">${esc(p.excerpt)}</p>`:"")+top+meta+`</a>`;
   }
   return `<a class="card${pubCls}" href="${enc(p.rel)}" style="--ac:${ac}" data-rel="${esc(p.rel)}" data-pub="${p.published?1:0}" data-autopub="${p.autopub?1:0}">${top}`+
     `<h3 class="c-title">${esc(title)}</h3>`+
     (p.excerpt?`<p class="c-ex">${esc(p.excerpt)}</p>`:"")+meta+`</a>`;
 }

 function render(){
   /* (v3: .hero 클래스 폐기 — 홈 히어로가 1면으로 대체됨) */
   mainEl.classList.remove("has-hero");
   updateNavCounts();
   { const _fab=document.getElementById("fabReq"); if(_fab)_fab.style.display=(state.view==="__request__")?"none":""; }  /* 요청 폼에선 FAB 숨김 */
   const isArchiveView=state.view==="__archive__";
   if(state.view==="__queue__"){ searchBox.style.display="none"; renderQueue(); return; }
   if(state.view==="__request__"){ searchBox.style.display="none"; renderRequest(); return; }
   if(state.view==="__trend__"){ searchBox.style.display=""; renderTrend(); return; }
   if(state.view==="__today__"&&!state.q){ searchBox.style.display=""; renderToday(); return; }
   if(state.view==="__today__"){ state.view="__all__"; if(window.__syncNav)window.__syncNav(); }   /* 오늘 화면에서 검색하면 글 목록으로 — 네비 활성도 같이 옮긴다 */
   searchBox.style.display=""; if(qEl)qEl.placeholder=isArchiveView?"서고 검색":"제목·내용 검색";
   let list;
   if(isArchiveView){ list=POSTS.filter(isArchived); }                          /* 아카이브 = 발행·숨김 글만 */
   else { list=state.view==="__all__"?POSTS:POSTS.filter(p=>p.author===state.view); list=list.filter(p=>!isArchived(p)); }  /* 전체·작성자 = 비아카이브만 */
   if(state.q){ list=list.filter(p=>(p.title+" "+p.excerpt+" "+p.cat+" "+p.group+" "+p.topic).toLowerCase().includes(state.q)); }
   /* 아카이브 하위 필터(전체/발행됨/숨김). 숨김 카운트는 '발행 안 됐는데 숨김'만(발행됨 표기 우선). */
   const archPub=isArchiveView?list.filter(p=>p.published).length:0;
   const archHid=isArchiveView?list.filter(p=>HIDDEN.has(p.rel)&&!p.published).length:0;
   if(isArchiveView){
     if(state.archiveSub==="pub")list=list.filter(p=>p.published);
     else if(state.archiveSub==="hid")list=list.filter(p=>HIDDEN.has(p.rel)&&!p.published);
   }

   const dir=state.sortDir==="asc"?1:-1;
   list=list.slice().sort((x,y)=>(x.ts-y.ts)*dir || x.title.localeCompare(y.title,"ko"));

   const total=list.length;
   const pageSize=state.gridView?PAGE_SIZE:ROW_PAGE_SIZE;   /* 행 모드는 밀도가 높아 한 페이지에 더 담는다 */
   const pages=Math.max(1,Math.ceil(total/pageSize));
   if(state.page>pages)state.page=pages; if(state.page<1)state.page=1;
   const start=(state.page-1)*pageSize;
   const pageItems=list.slice(start,start+pageSize);

   const who=isArchiveView?"서고":(state.view==="__all__"?"글":esc(state.view));
   titleEl.textContent=who;
   const tag=isArchiveView?" · 발행 완료·숨김 글 보관함":((state.view!=="__all__"&&KNOWN[state.view])?" · "+esc(KNOWN[state.view].tag):" · 아직 확인하지 않은 글");
   const sortLabel=state.sortDir==="asc"?"등록일 오래된순":"등록일 최신순";
   subEl.innerHTML=`<b>${sortLabel}</b> · 총 <b>${total}</b>편`+tag+(state.q?` · '${esc(state.q)}' 검색`:"")+(pages>1?` · <b>${state.page}</b>/${pages}페이지`:"");

   const isWriterView=!isArchiveView&&state.view!=="__all__";
   /* 목록에는 히어로를 두지 않는다(1면은 '오늘'이 전담). 작성자 헤더만 유지 — 누구 목록인지가 정보. */
   const heroHtml = (isWriterView&&!state.q) ? wheroHtml(state.view) : "";
   const clusHtml = isArchiveView ? clusterHtml() : "";   /* 검색 중에도 유지 — 사라지면 선택 해제·전환 UI가 없어진다(칩 .on 이 현재 선택 표시) */
   const toolbar=toolbarHtml(total,isArchiveView,archPub,archHid);

   if(!total){
     const emsg=isArchiveView?'서고가 비어 있어요.<br>글을 ‘발행 완료’ 또는 ‘숨기기’ 하면 여기로 모여요.'
       :(state.q?`‘${esc(state.q)}’에 맞는 글이 없어요.`:'확인 대기 중인 글이 없어요. 발행·숨김된 글은 서고에 있어요.');
     const ekind=isArchiveView?'archive':(state.q?'search':'base');
     contentEl.innerHTML=heroHtml+clusHtml+toolbar+emptyBox(ekind,emsg); attachTools(); return; }

   const gridCls=state.gridView?" grid":"";
   const body=`<div class="feed${gridCls}">${pageItems.map(p=>postCard(p,false)).join("")}</div>`;
   contentEl.innerHTML=heroHtml+clusHtml+toolbar+body+pagerHtml(state.page,pages);
   attachTools();
 }

 /* ---------- 오늘 — 좌: 확인 대기 10편 패널 / 우: 데스크·큐·서고 패널 ----------
    v4 변경: 「오늘의 머리기사」 폐기(사용자 요청). 이 화면의 목적은 '읽을거리 추천'이 아니라

 /* 오늘 사이드의 큐 요약 — 실패하면 '못 불러왔다'고 말한다(0건으로 위장하지 않는다) */
 async function paintTodayQueue(){
   const box=document.getElementById("todayQueue"); if(!box)return;
   /* ★패널 헤더는 건드리지 않고 .panel-b 안쪽만 교체 — 헤더를 다시 그리면 '전체' 버튼 리스너가 날아간다 */
   const put=h=>{ const b=document.querySelector("#todayQueue .panel-b"); if(b)b.innerHTML=h; };
   if(!RequestService.isConnected()){ put(`<div class="srow-empty">백엔드 미연결 — 큐를 불러올 수 없어요.</div>`); return; }
   try{
     const all=await queueFetch();
     const wait=all.filter(x=>x.status==="received"||x.status==="processing")
                   .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
     if(!wait.length){ put(`<div class="srow-empty">대기 중인 요청이 없어요.</div>`); return; }
     put(wait.slice(0,3).map(r=>`<div class="srow"><span class="p q">${esc(r.status==="processing"?"작성중":"대기")}</span>`+

       (wait.length>3?`<div class="srow-empty">외 ${wait.length-3}건</div>`:""));
   }catch(e){ put(`<div class="srow-empty">큐를 불러오지 못했어요.</div>`); }
 }

 /* ---------- 서고 클러스터 — group(폴더 2뎁스)별 집계. 자산이 어디에 쌓였는지 보여준다 ---------- */

   }).join("")+`</div>`;

 function pagerHtml(page,pages){
   if(pages<=1)return"";
   const win=1, slots=[]; let last=0;
   for(let i=1;i<=pages;i++){
     if(i===1||i===pages||(i>=page-win&&i<=page+win)){
       if(last&&i-last>1)slots.push("gap"); slots.push(i); last=i;
     }
   }
   const nums=slots.map(s=> s==="gap" ? `<span class="gap">…</span>`
     : `<button data-page="${s}"${s===page?' class="cur" aria-current="page"':""}>${s}</button>`).join("");
   return `<nav class="pager" aria-label="페이지">`+
     `<button data-page="${page-1}"${page<=1?" disabled":""} aria-label="이전 페이지">${svg("chevL")}이전</button>`+
     nums+
     `<button data-page="${page+1}"${page>=pages?" disabled":""} aria-label="다음 페이지">다음${svg("chevR")}</button>`+
   `</nav>`;
 }
