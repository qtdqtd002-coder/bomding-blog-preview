 /* 뷰 전환 — 나갈 땐 짧게 접히고, 들어올 땐 아래에서 올라온다.
    render()는 여러 곳에서 불리므로 '이동'에 해당하는 호출에서만 감싼다. */
 let VT_BUSY=false;
 function withTransition(fn){
   const el=contentEl;
   let reduced=false; try{ reduced=matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(_){}
   if(reduced||VT_BUSY||!el){ fn(); return; }
   VT_BUSY=true;
   el.classList.remove("vt-in"); el.classList.add("vt-out");
   setTimeout(()=>{
     el.classList.remove("vt-out");
     fn();
     el.classList.add("vt-in");
     setTimeout(()=>{ el.classList.remove("vt-in"); VT_BUSY=false; },340);
   },160);
 }
 /* 글로 나갈 때 — 화면이 툭 끊기지 않고 한 겹 물러난 뒤 이동한다 */
 document.addEventListener("click",e=>{
   const a=e.target.closest&&e.target.closest("a[href]");
   if(!a)return;
   if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
   if(a.target==="_blank"||a.hasAttribute("download"))return;
   const href=a.getAttribute("href")||"";
   if(!href||href[0]==="#"||/^(https?:)?\/\//i.test(href)||/^(mailto|tel):/i.test(href))return;
   if(e.target.closest(".admin-menu"))return;          /* 관리 메뉴 클릭은 이동 아님 */
   let reduced=false; try{ reduced=matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(_){}
   if(reduced)return;
   e.preventDefault();
   try{ window.__sfx&&window.__sfx.swish(); }catch(_){}
   document.body.classList.add("leaving-page");
   setTimeout(()=>{ location.href=a.href; },210);
 });
 /* 뒤로가기로 돌아왔을 때 하얗게 굳어 있지 않도록 */

 /* 콘텐츠 최상위 블록에 순차 등장 — 화면이 '조립되는' 느낌을 주고 영역 경계를 인지시킨다 */
 function stagger(root){ [...root.children].forEach((el,i)=>{ el.classList.add("reveal"); el.style.setProperty("--i",i); }); }

 /* ---------- 토스트 (모듈 스코프) ----------
    2026-08-14: 원래 구현이 '관리자 모드' IIFE 안에만 있어서, 밖에서 부르는 cancelQueued()·renderQueue()의
    toast() 는 ReferenceError 였다(요청 취소 시 성공/실패 알림이 뜨지 않고 예외로 끊김). 발주 모달도 같은
    함수를 쓰므로 여기 모듈 스코프로 올린다 — 관리자 IIFE 안의 중복 정의는 제거해 구현을 하나로 유지한다. */
 let _toastEl=null,_toastT=0;
 function toast(msg,kind){
   if(!_toastEl){ _toastEl=document.createElement("div"); _toastEl.className="adm-toast";
     _toastEl.setAttribute("role","status"); _toastEl.setAttribute("aria-live","polite");
     _toastEl.setAttribute("aria-atomic","true"); document.body.appendChild(_toastEl); }
   _toastEl.textContent=msg; _toastEl.className="adm-toast show "+(kind||"");
   clearTimeout(_toastT); _toastT=setTimeout(()=>{ _toastEl.className="adm-toast"; }, kind==="err"?6500:3800);
 }

 /* ---------- 작업 큐 · 히스토리 (백엔드 GET /requests 전체 — 누구나 열람) ---------- */
 /* 대기/진행 중인 글, 실패·취소 히스토리(사유 포함), 큐 깊이를 보여주고, 접수 대기 요청은 취소(삭제)한다. */
 let QUEUE_TIMER=null;
 function qTime(ms){ try{ const d=new Date(ms); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }catch(e){ return ""; } }
 async function queueFetch(){ const r=await fetch(apiBase()+"/requests?ts="+Date.now()); if(!r.ok)throw new Error("HTTP "+r.status); const a=await r.json(); return Array.isArray(a)?a:[]; }

 async function maintenanceFetch(){ try{ const r=await fetch(apiBase()+"/maintenance?ts="+Date.now()); if(!r.ok)return null; return await r.json(); }catch(_){ return null; } }
 async function refreshQueueBadge(){
   const el=document.getElementById("navQueueCnt");

   try{

 async function cancelQueued(id,topic){

 /* ---------- 큐 상단 사용량 대시보드 (발주 실측 + 토큰 추정) ----------
    왜 여기인가: 트렌드 데스크에서 오늘 발주를 정하기 전에 «어제까지 누가 얼마나 썼나»를 봐야 하는데,
    그 판단이 필요한 화면이 큐다(발주가 실제로 쌓이는 곳).
    발주 = /requests 의 createdAt — 실측. 취소·실패분도 '발주는 발주'라 상태로 거르지 않는다.
    토큰 = _trend/_usage.json — 데스크 회차가 `_tools/usage-daily.cjs` 로 굽는다(작성자 귀속은 추정).
    ★파일이 없으면 «없다»고 적고 발주 축만 그린다 — 0으로 위장하지 않는다(KPI 카드 규칙). */
 const USAGE_DAYS=7;
 let USAGE=null, USAGE_P=null;
 function usageFetch(force){
   if(force) USAGE_P=null;
   if(!USAGE_P) USAGE_P=fetch("_trend/_usage.json?ts="+Date.now())
     .then(r=>r.ok?r.json():null)
     .then(j=>{ USAGE=(j&&Array.isArray(j.days))?j:null; return USAGE; })
     .catch(()=>{ USAGE=null; return null; });
   return USAGE_P;
 }
 const uYmd=d=>{ const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
 /* 정체 없는 두 칸은 작성자 색을 쓰지 않는다. 단, 서로도 구분돼야 해서 명도를 갈라 둔다
    (기타/공용=진한 중립, 자동배정=옅은 중립). 라이트·다크 모두 토큰이라 자동 반전. */
 const uAc=n=>n==="기타/공용"?"var(--ink-3)":n==="자동배정"?"var(--line-strong)"
   :(ACCENT[n]||(KNOWN[n]&&KNOWN[n].ac)||FALLBACK_AC);
 const uTok=t=>t>=1e6?Math.round(t/1e6).toLocaleString()+"M":t>=1e3?Math.round(t/1e3)+"K":String(Math.round(t));
 /* 세로 막대 한 칸 — 높이=그날 총량÷최대, 내부는 작성자 몫만큼 flex 로 나눈다(비율 왜곡 없음).
    ★조각 최소높이(2px)+간격(1px) 합보다 칸이 낮으면 위쪽 조각이 잘려 «색이 사라진다» — 바닥 높이를 강제한다.
    UCOL_H(=.ucols 높이 64px)와 이 상수는 CSS 와 짝이다. 한쪽만 바꾸면 다시 잘린다. */
 const UCOL_H=64, USEG_MIN=2, USEG_GAP=1;
 function uCol(day,map,total,max,today,tip){
   const ks=Object.keys(map).filter(k=>map[k]>0).sort((a,b)=>map[b]-map[a]);
   const floor=ks.length?Math.ceil((ks.length*USEG_MIN+(ks.length-1)*USEG_GAP)/UCOL_H*100):0;
   const h=max>0?Math.max(floor,Math.round(total/max*100)):0;
   const segs=ks.map(w=>`<i style="flex:${Math.max(1,Math.round(map[w]/(total||1)*1000))} 1 0;background:${uAc(w)}" title="${esc(tip(day,w,map[w],total))}"></i>`).join("");
   return `<div class="ucol${day===today?" on":""}">`+
     (h>0&&segs?`<div class="ustack" style="height:${h}%">${segs}</div>`:`<i class="zero"></i>`)+`</div>`;
 }
 function usageBlock(all){
   const t0=new Date(); t0.setHours(0,0,0,0);
   const days=[]; for(let i=USAGE_DAYS-1;i>=0;i--) days.push(uYmd(new Date(t0.getTime()-i*86400000)));
   const today=days[days.length-1];
   const label=d=>{ const a=d.split("-"); return (+a[1])+"/"+(+a[2]); };
   /* 발주(실측) */
   const ord={}; days.forEach(d=>ord[d]={});
   const ordTot={};
   (all||[]).forEach(r=>{ const d=uYmd(new Date(r.createdAt||0)); if(!ord[d])return;
     const w=r.writer||"자동배정"; ord[d][w]=(ord[d][w]||0)+1; ordTot[w]=(ordTot[w]||0)+1; });
   const ordSum={}; days.forEach(d=>ordSum[d]=Object.values(ord[d]).reduce((s,v)=>s+v,0));
   const ordMax=Math.max(1,...days.map(d=>ordSum[d]));
   const ordAll=days.reduce((s,d)=>s+ordSum[d],0);
   /* 토큰(추정) — 데이터가 있는 날만 그린다 */
   const tk={}, tkTot={}; let tkAll=0, tkDays=0;
   if(USAGE) USAGE.days.forEach(x=>{ if(days.indexOf(x.d)<0)return;
     tk[x.d]=x; tkDays++; tkAll+=x.tok||0;
     Object.entries(x.by||{}).forEach(([w,v])=>tkTot[w]=(tkTot[w]||0)+v); });
   const tkMax=Math.max(1,...days.map(d=>(tk[d]&&tk[d].tok)||0));
   /* 범례 = 두 축 합집합. 정체 없는 칸(기타/공용·자동배정)은 항상 아래로. */
   const isDim=w=>w==="기타/공용"||w==="자동배정";
   const names=[...new Set([...Object.keys(tkTot),...Object.keys(ordTot)])]
     .sort((a,b)=>(isDim(a)-isDim(b))||((tkTot[b]||0)-(tkTot[a]||0))||((ordTot[b]||0)-(ordTot[a]||0))||a.localeCompare(b,"ko"));
   const leg=names.map(w=>{
     const pct=tkAll>0&&tkTot[w]!=null?Math.round(tkTot[w]/tkAll*100)+"%":"—";
     return `<div class="uleg-r"><span class="dot" style="background:${uAc(w)}"></span>`+
       `<span class="nm">${esc(w)}</span>`+
       `<span class="vv">${ordTot[w]||0}건 <em>·</em> ${pct}</span></div>`;
   }).join("");
   const ordTip=(d,w,v)=>`${label(d)} ${w} ${v}건`;
   const tkTip=(d,w,v,t)=>`${label(d)} ${w} ${uTok(v)} (${t>0?Math.round(v/t*100):0}%)`;
   const axis=days.map(d=>`<span class="${d===today?"on":""}">${label(d)}</span>`).join("");
   const ordChart=`<div class="uch"><h4 class="uch-t">발주 <i>${ordAll}건</i></h4>`+
     `<div class="ucols">${days.map(d=>uCol(d,ord[d],ordSum[d],ordMax,today,ordTip)).join("")}</div>`+
     `<div class="uaxis">${axis}</div></div>`;
   const tkChart=tkDays
     ? `<div class="uch"><h4 class="uch-t">토큰 <i>${uTok(tkAll)}</i></h4>`+
       `<div class="ucols">${days.map(d=>uCol(d,(tk[d]&&tk[d].by)||{},(tk[d]&&tk[d].tok)||0,tkMax,today,tkTip)).join("")}</div>`+
       `<div class="uaxis">${axis}</div></div>`
     : `<div class="uch"><h4 class="uch-t">토큰 <i>—</i></h4>`+
       `<div class="uempty">아직 사용량 스냅샷이 없어요.<br>트렌드 데스크 회차가 돌면 채워져요.</div></div>`;
   const upd=USAGE&&USAGE.updated?` · 갱신 ${qTime(Date.parse(USAGE.updated))}`:"";
   return `<section class="upan"><div class="upan-h"><b>작성자 사용량</b>`+
     `<span class="u-sub">최근 ${USAGE_DAYS}일${esc(upd)}</span>`+   /* 차트마다 제 이름이 있다 — 여기 설명문 금지 */
     `<span class="u-est">토큰=추정</span></div>`+
     `<div class="upan-b">${ordChart}${tkChart}<div class="uleg">${leg||`<div class="uleg-r"><span class="nm">기록 없음</span></div>`}</div></div></section>`;
 }

 function renderQueue(){
   titleEl.textContent="작업 큐"; subEl.textContent="대기·진행 중인 글과 실패·취소 기록 — 작성자별로, 큐가 얼마나 쌓였는지 한눈에";
   if(QUEUE_TIMER){ clearInterval(QUEUE_TIMER); QUEUE_TIMER=null; }
   const mast=`<div class="masthead" style="--ac:var(--a-queue)"><div class="mk">${svg("inbox")}작업 큐</div><div class="mt">발행 요청 대기열 · 실패·취소 기록</div><div class="ms">요청이 작성→검수→발행되는 줄이에요. 아직 시작 안 한 요청은 취소할 수 있고, 발행 완료 글은 <b>서고</b>에 있어요.</div></div>`;
   if(!RequestService.isConnected()){
     contentEl.innerHTML=`<div class="news">${mast}${emptyBox("request","백엔드가 연결돼 있지 않아 큐를 불러올 수 없어요.")}</div>`; return;
   }
   contentEl.innerHTML=`<div class="news">${mast}<div id="qBox"><div class="q-loading">${svg("refresh")} 큐를 불러오는 중…</div></div></div>`;
   const paint=(all,maint)=>{
     const box=document.getElementById("qBox"); if(!box)return;
     const maintBanner=(maint&&maint.active)
       ? `<div class="q-maint" role="status">${svg("alertTri")}<div class="q-maint-tx"><b>점검 중 — 발행 일시 중단</b><span>스킬 점검 중이라 글 발행을 잠시 멈췄어요. 새 글 요청은 정상 접수되며, 점검이 끝나면 대기 순서대로 다시 자동 발행됩니다.</span></div></div>`
       : "";
     const by=s=>all.filter(x=>x.status===s);
     /* 발행됨(published)은 '전체 글'에 나오므로 큐에서 제외(사용자 06-14). */
     const received=by("received"), processing=by("processing"), failed=by("failed"), skipped=by("skipped");
     const active=[...processing,...received].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
     const history=[...failed,...skipped].sort((a,b)=>(b.statusAt||b.createdAt||0)-(a.statusAt||a.createdAt||0));
     const stat=(n,label,cls)=>`<div class="qstat ${cls}"><b>${n}</b><span>${label}</span></div>`;
     const bar=`<div class="qstats">${stat(received.length,"대기","s-received")}${stat(processing.length,"진행 중","s-processing")}${stat(failed.length,"실패","s-failed")}</div>`;
     const isCancel=r=>r.status==="skipped"&&/취소/.test(r.error||"");
     const item=(r)=>{
       const wr=r.writer||""; const wac=ACCENT[wr]||"var(--line-strong)";
       const cancel=isCancel(r);
       const stCls=cancel?"cancel":r.status; const stLab=cancel?"취소됨":(REQ_STATUS_LABEL[r.status]||r.status);
       const reason=(r.status==="failed"||r.status==="skipped")&&r.error
         ? `<div class="q-reason${cancel?" cancel":""}">${svg(cancel?"info":"alertTri")}<span><b>${cancel?"취소":"실패 사유"}</b> ${esc(r.error)}</span></div>` : "";
       const tWhen=r.status==="received"?r.createdAt:(r.statusAt||r.createdAt);
       const meta=[r.purpose?"목적 "+esc(r.purpose):"", r.source?esc(r.source):"", esc(qTime(tWhen))].filter(Boolean).join(" · ");
       return `<div class="q-item s-${esc(stCls)}" style="--wac:${wac}">`+
         `<div class="q-top"><span class="q-who">${wr?avatar(wr,"s"):svg("inbox")}<span class="q-wname">${esc(wr||"작성자 자동배정")}</span></span><span class="rl-st s-${esc(stCls)}">${esc(stLab)}</span></div>`+
         `<div class="q-title">${esc(r.topic||"(주제 없음)")}</div>`+
         (r.material?`<div class="q-sub">${esc((r.material||"").slice(0,140))}${(r.material||"").length>140?"…":""}</div>`:"")+
         reason+
         `<div class="q-meta">${meta}</div>`+
         (r.status==="received"?`<button class="q-cancel" data-id="${esc(r.id)}" data-topic="${esc(r.topic||"")}">${svg("trash")}취소</button>`:"")+
         `</div>`;
     };
     const sec=(title,icon,arr,emptyMsg,cls)=>`<section class="q-sec ${cls}"><h3 class="q-sec-h">${svg(icon)}<span>${esc(title)}</span><span class="q-sec-n">${arr.length}</span></h3>`+
       (arr.length?`<div class="q-list">${arr.map(item).join("")}</div>`:`<div class="q-empty">${esc(emptyMsg)}</div>`)+`</section>`;
     box.innerHTML=maintBanner+bar+usageBlock(all)+
      `<div class="q-actions"><button class="q-refresh" id="qRefresh">${svg("refresh")}새로고침</button><span class="q-hint">20초마다 자동 갱신 · 발행 완료 글은 ‘서고’에서 확인</span></div>`+
       sec("작업 대기·진행 중","clock",active,"대기 중인 글이 없어요. 트렌드 데스크의 [발주 요청]이나 ‘새 글 요청’에서 보내보세요.","q-active")+
       sec("실패·취소 기록","alertTri",history,"실패하거나 취소된 글이 없어요.","q-history");
     box.querySelectorAll(".q-cancel").forEach(b=>b.addEventListener("click",()=>cancelQueued(b.dataset.id,b.dataset.topic)));
     const rf=document.getElementById("qRefresh"); if(rf)rf.addEventListener("click",()=>load(true));
   };
   const load=(manual)=>{ if(manual){ const box=document.getElementById("qBox"); if(box){ const rf=document.getElementById("qRefresh"); if(rf){ rf.disabled=true; rf.innerHTML=svg("refresh")+"갱신 중…"; } } }
     Promise.all([queueFetch(),maintenanceFetch(),usageFetch(manual)]).then(([all,maint])=>{ paint(all,maint); const el=document.getElementById("navQueueCnt"); if(el){ const a=all.filter(x=>x.status==="received"||x.status==="processing").length; if(a>0){el.textContent=a;el.hidden=false;}else{el.hidden=true;} } })
       .catch(e=>{ const box=document.getElementById("qBox"); if(box)box.innerHTML=emptyBox("base","큐를 불러오지 못했어요. 잠시 후 새로고침해주세요."); }); };
   load(false);
   QUEUE_TIMER=setInterval(()=>{ if(state.view==="__queue__"){ load(false); } else { clearInterval(QUEUE_TIMER); QUEUE_TIMER=null; } },20000);
 }

       const rec=await RequestService.submit({purpose,topic,material,writer,file:picked});
       if(rec.status==="submitted"){ showMsg("요청이 접수됐어요. 작성→검수→발행 후 알림으로 알려드릴게요.","ok"); e.target.reset(); picked=null; fname.textContent="선택된 파일 없음"; fclear.hidden=true;
         wInput.value=""; $("#rfWriterChips").querySelectorAll(".rf-wchip").forEach((x,j)=>x.classList.toggle("on",j===0)); wInfo.textContent=WRITER_INFO[""].desc;
         purHint.classList.remove("on"); purHint.innerHTML=svg("info")+' <span>목적을 고르면 그 목적에 꼭 들어갈 정보를 자동으로 안내해드려요.</span>'; }
       else if(rec.status==="failed"){ showMsg("전송에 실패했어요. 파일은 다시 첨부해서 보내주세요.","err"); }
       else if(rec.status==="queued"){ showMsg("네트워크 문제로 임시 저장했어요. 연결되면 다시 시도하세요.","err"); e.target.reset(); picked=null; fname.textContent="선택된 파일 없음"; fclear.hidden=true; }
       else { showMsg("임시 저장했어요(백엔드 미연결).","ok"); e.target.reset(); picked=null; fname.textContent="선택된 파일 없음"; fclear.hidden=true; }
       drawList();
     }catch(err){ showMsg("전송 실패: "+((err&&err.message)||err),"err"); }
     finally{ btn.disabled=false; }
   });

   /* 푸시: 서비스워커가 실제 등록돼 있고 지원·설정됐을 때만 노출(미등록 시 구독 멈춤 방지) */
   (async()=>{
     if(!PushSvc.supported()||!PushSvc.configured())return;
     const reg=await navigator.serviceWorker.getRegistration().catch(()=>null);
     if(!reg)return; /* 설치형 PWA(sw.js) 등록 전이면 알림 버튼 숨김 */
     const st=await PushSvc.status().catch(()=>"unsupported");
     const pb=$("#rfPush"); if(!pb)return;
     if(st==="subscribed"){ pb.hidden=false; pb.disabled=true; pb.innerHTML=svg("check")+"알림 켜짐"; }
     else if(st==="ready"){ pb.hidden=false; pb.addEventListener("click",async()=>{ pb.disabled=true; const s=await PushSvc.subscribe().catch(()=>null); if(s){ pb.innerHTML=svg("check")+"알림 켜짐"; } else { pb.disabled=false; showMsg("알림 권한이 필요해요.","err"); } }); }
   })();
 }

 /* ========================================================================
    트렌드 = 일간 토픽 데스크 (2026-08-14 전면 개편)
    ------------------------------------------------------------------------
    옛 방식: 작성자 5인별 브리핑 HTML 5편 → 글 안의 위젯에서 발행 요청.
    새 방식: **작성자와 무관한 하루치 뉴스 1판**을 분류별로 내고,
             주제마다 [발주 요청] → 모달에서 **그때 작성자를 고른다**.
    데이터 = _trend/trend.json (schema 2, editions[] 배열). 별도 HTML 파일 없음.

    ★2026-08-15 2차 개편(사용자 지시) — 세 가지가 바뀌었다.
      ⑴ 탭 최상단에 **꼭 다룰 게임 상자**(최대 8종). 백엔드 /pins 에 저장되고, 다음 날 아침 데스크가
         읽어 **게임마다 주제 3~5개**를 반드시 만든다(분류 pinned).
      ⑵ 목록 행은 **게임명 · 주제 · [발주 요청]** 셋으로 줄였다. 플랫폼·화제도·작성자·왜지금·목적·시점·출처는
         행에서 빼고 **발주 모달**로 옮겼다 — 모바일에서 한 화면에 들어오는 항목 수가 목적이다.
         (남긴 예외 = 이미 다룬 글 경고. 이건 장식이 아니라 '발주할지 말지'를 뒤집는 신호라 행에 남긴다.)
      ⑶ 콘솔 게임 분류 폐지 · 마스트헤드 안내문단/에디션 리드 제거(읽지 않아도 잘못 쓸 일이 없는 문장).
    ======================================================================== */
 /* 분류 5개 — cap 은 '상한'이지 '채워야 할 수'가 아니다. 못 채우면 비운다(사용자 지시 08-14).
    ★2026-08-15 개편: 맨 앞에 pinned(꼭 다룰 게임) 신설 · console(콘솔 게임) 폐지(사용자 지시).
    pinned cap 40 = 지정 게임 8종 × 게임당 최대 5주제. 다른 분류와 달리 '게임마다 3~5건'이 규칙이라
    한 분류에 여러 건이 같은 게임으로 모이는 유일한 칸이다. */
 const DESK_SECTIONS=[
   {key:"pinned", label:"꼭 다룰 게임",       desc:"내가 지정한 게임",          icon:"pin",     ac:"var(--c-pin)",  cap:40},
   {key:"core",   label:"주로 다루는 게임",   desc:"봄딩·영도가 계속 쓰는 게임", icon:"star",    ac:"var(--c-core)", cap:10},
   /* 육아는 게임이 아니라 봄딩 전용 상시 레인이다(쿠팡 파트너스 수익형).
      pinned·core 뒤, new 앞에 두는 이유 = 앞 셋은 "우리가 계속 쓰는 것"(내부 축)이고
      new·update·hot 은 "밖에서 일어난 일"(외부 축)이라, 육아는 내부 축에 속한다.
      2026-08-14 개편 때 옛 trend-analysis-team 의 🍼육아 트랙이 통째로 사라졌던 것을 08-18 복원한 칸. */
   {key:"parenting", label:"육아 제품",       desc:"봄딩이 쓰는 쿠팡 제휴 비교글", icon:"gift", ac:"var(--c-par)", cap:5},
   {key:"new",    label:"신작 게임",          desc:"막 나왔거나 곧 나오는 게임", icon:"spark",   ac:"var(--c-new)",  cap:5},
   {key:"update", label:"최근 업데이트 게임",  desc:"화제성 있는 패치·시즌",      icon:"refresh", ac:"var(--c-upd)",  cap:5},
   {key:"hot",    label:"최근 화제되는 게임",  desc:"지금 검색·화제가 몰리는 쪽",  icon:"flame",   ac:"var(--c-hot)",  cap:5}
 ];
 const DESK_SEC=Object.fromEntries(DESK_SECTIONS.map(s=>[s.key,s]));
 /* ── 긴 문장을 읽을 수 있는 줄로 쪼갠다 (2026-09-02 사용자 지적: "개행도 없고 쭉 이어져 보기 어렵다") ──
    데스크가 남기는 note·detail 은 ★ 로 절을 나눈 한 덩어리 문자열이었다. 화면에선 그게 벽이 된다.
    ⑴ 09-02 부터 note 는 배열로 쓴다. ⑵ 그 전 14일치는 문자열이라 여기서 ★·줄바꿈 기준으로 쪼갠다
       — 데이터를 손대지 않아도 지난 판이 같이 읽힌다(마이그레이션 없는 하위호환). */
 function splitLines(v){
   const arr=Array.isArray(v)?v:String(v||"").split(/\r?\n|(?=★)/);
   return arr.map(s=>String(s||"").replace(/^[\s·•]+/,"").trim()).filter(Boolean);
 }
 /* ★로 시작하는 줄 = "확인 못 했다·주의하라"는 경고. 본문 사실과 섞어 두면 눈에 안 띈다. */
 const isCaution=s=>/^★/.test(s);
 /* trend.json 정규화 — schema 2(editions)만 읽는다. 옛 issues 스키마는 08-14 폐기(잔재가 오면 조용히 버린다). */
 function normEditions(raw){
   const eds=(raw&&Array.isArray(raw.editions))?raw.editions:[];
   /* lead(2~3문장 리드)는 08-15 개편에서 렌더를 끊었다 — headline + 분류별 건수 칩이 같은 말을 이미 한다.
      옛 데이터에 남아 있어도 조용히 무시한다(스키마 하위호환). */
   return eds.filter(e=>e&&e.date).map(e=>({
     date:String(e.date), headline:String(e.headline||""),
     /* note = 배열(09-02~) 또는 긴 문자열(~09-01). 화면은 언제나 줄 목록으로만 그린다. */
     note:splitLines(e.note),
     sections:DESK_SECTIONS.map(s=>{
       const src=(e.sections||[]).find(x=>x&&x.key===s.key)||{};
       const items=(src.items||[]).filter(Boolean).map((it,i)=>({
         id:String(it.id||(e.date+"-"+s.key+"-"+i)),
         sec:s.key, game:String(it.game||""), title:String(it.title||""),
         purpose:String(it.purpose||""), platform:String(it.platform||""),
         why:String(it.why||""), detail:String(it.detail||""), angle:String(it.angle||""),
         when:String(it.when||""), heat:Math.max(0,Math.min(3,Number(it.heat)||0)),
         /* lane = 이 게임을 주로 쓰는 작성자(주로 다루는 게임 분류에만 붙는다).
            발주 모달이 이 값으로 작성자 칩을 미리 골라 준다 — 배정을 강제하는 게 아니라 기본값만 준다. */
         lane:(function(w){ return (w&&PREF.indexOf(w)>=0&&INACTIVE_WRITERS.indexOf(w)<0)?w:""; })(String(it.lane||"")),
         keywords:(it.keywords||[]).map(String).filter(Boolean),
         sources:(it.sources||[]).filter(s2=>s2&&s2.url).map(s2=>({label:String(s2.label||"출처"),url:String(s2.url)})),
         coverage:(it.coverage||[]).filter(c=>c&&c.writer).map(c=>({writer:String(c.writer),title:String(c.title||"")}))
       })).filter(it=>it.title).slice(0,s.cap||99);
       return {key:s.key,items};
     })
   })).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 }
 const edItems=ed=>ed?ed.sections.reduce((a,s)=>a.concat(s.items),[]):[];
 /* 전량(trend.json 14일치) 지연 로드 — 경량본 밖의 날짜로 넘어가거나 검색할 때만 부른다.
    한 번 받으면 세션 안에서 재사용하고, 실패해도 갖고 있던 경량본으로 계속 돈다(화면이 죽지 않는다). */
 function ensureFullTrend(){
   if(TREND_FULL)return Promise.resolve(TREND);
   if(!TREND_FULL_P) TREND_FULL_P=fetch("_trend/trend.json?ts="+Date.now())
     .then(r=>r.ok?r.json():null)
     .then(j=>{ if(j&&j.editions){ TREND=normEditions(j); TREND_FULL=true;
                                   if(TREND.length)TREND_DATES=TREND.map(e=>e.date); }
                return TREND; })
     .catch(()=>TREND);
   return TREND_FULL_P;
 }
 /* 발주 양식 문자열 — 모달 프리필·복사에 같이 쓴다(백엔드 material 필드와 1:1). */
 function deskMaterial(it){
   /* 09-02: 라벨 + 줄바꿈 구조로 바꿨다. 전에는 시점·왜지금·사실이 라벨 없이 이어 붙어,
      작성자가 받는 발주서에서 "어디까지가 확인된 사실이고 어디부터가 각도인지"가 구분되지 않았다. */
   const parts=[];
   if(it.when)parts.push("[시점] "+it.when);
   if(it.why)parts.push("[왜 지금] "+it.why);
   if(it.detail)parts.push("[확인된 사실]\n"+splitLines(it.detail).map(s=>"- "+s).join("\n"));
   if(it.angle)parts.push("[각도] "+it.angle);
   if(it.keywords.length)parts.push("[키워드] "+it.keywords.join(", "));
   if(it.sources.length)parts.push("[참고]\n"+it.sources.map(s=>"- "+s.label+" "+s.url).join("\n"));
   if(it.coverage.length)parts.push("★기존 글 확인 필요: "+it.coverage.map(c=>c.writer+" 「"+c.title+"」").join(" / ")+" — 각도가 겹치면 새 각도로 잡거나 발주를 취소할 것");
   return parts.join("\n\n");
 }

 /* ---------- 꼭 다룰 게임 상자 (트렌드 탭 최상단) ----------
    여기 적은 게임은 **다음 회차(다음 날 아침 6시) 데스크**가 게임마다 주제 3~5개를 반드시 만든다.
    오늘 판에 즉시 반영되지 않는다는 게 이 UI 의 유일한 오해 소지라, 그 한 줄만 상자 안에 둔다. */
 function pinBox(){
   const full=PINS.length>=PINS_MAX;
   const chips=PINS.map((g,i)=>
     `<span class="pin-chip"><span class="pin-nm">${esc(g)}</span>`+
     `<button type="button" class="pin-x" data-pin-rm="${i}" title="${esc(g)} 빼기" aria-label="${esc(g)} 빼기">${svg("x")}</button></span>`
   ).join("");
   return `<section class="pinbox" style="--ac:var(--c-pin)">`+
     `<div class="pin-h">`+
       `<span class="pin-ic">${svg("pin")}</span>`+
       `<span class="pin-t">꼭 다룰 게임</span>`+
       `<span class="pin-note">다음 회차부터 게임마다 주제 3~5개</span>`+
       `<span class="pin-n${full?" full":""}">${PINS.length} / ${PINS_MAX}</span>`+
     `</div>`+
     `<div class="pin-b">`+
       (PINS.length?`<div class="pin-chips">${chips}</div>`:"")+
       `<form class="pin-add" id="pinForm" autocomplete="off">`+
         `<input id="pinInput" class="pin-i" type="text" maxlength="40" ${full?"disabled":""}`+
           ` placeholder="${full?"8칸을 다 썼어요 — 빼야 더 넣을 수 있어요":"게임 이름 (예: 메이플플래닛)"}"`+
           ` aria-label="꼭 다룰 게임 추가">`+
         `<button type="submit" class="pin-go" ${full?"disabled":""}>${svg("plus")}<span>추가</span></button>`+
       `</form>`+
     `</div>`+
   `</section>`;
 }
 /* 상자만 다시 그린다 — 목록 전체를 render() 로 재생성하면 스크롤 위치가 튄다. */
 function repaintPinBox(focus){
   const old=contentEl.querySelector(".pinbox"); if(!old)return;
   const tmp=document.createElement("div"); tmp.innerHTML=pinBox();
   old.replaceWith(tmp.firstElementChild);
   bindPinBox();
   if(focus){ const i=contentEl.querySelector("#pinInput"); if(i&&!i.disabled)i.focus(); }
 }
 function bindPinBox(){
   const form=contentEl.querySelector("#pinForm");
   if(form)form.addEventListener("submit",async e=>{
     e.preventDefault();
     const el=contentEl.querySelector("#pinInput"); if(!el)return;
     const name=el.value.replace(/\s+/g," ").trim();
     if(!name){ el.focus(); return; }
     if(PinSvc.has(name)){ toast("이미 지정한 게임이에요."); el.value=""; el.focus(); return; }
     if(PINS.length>=PINS_MAX){ toast("최대 "+PINS_MAX+"개까지만 지정할 수 있어요.","err"); return; }
     el.disabled=true;
     try{ await PinSvc.save(PINS.concat([name])); toast("‘"+name+"’ 추가 — 다음 회차 데스크부터 반영돼요.","ok"); repaintPinBox(true); }
     catch(err){ el.disabled=false; toast("저장 실패: "+((err&&err.message)||err),"err"); }
   });
   contentEl.querySelectorAll("[data-pin-rm]").forEach(b=>b.addEventListener("click",async()=>{
     const i=Number(b.dataset.pinRm); const name=PINS[i]; if(!name)return;
     b.disabled=true;
     try{ await PinSvc.save(PINS.filter((_,n)=>n!==i)); toast("‘"+name+"’ 뺐어요."); repaintPinBox(false); }
     catch(err){ b.disabled=false; toast("저장 실패: "+((err&&err.message)||err),"err"); }
   }));
 }

 /* ---------- 트렌드(일간 토픽 데스크) ---------- */
 function renderTrend(){
   titleEl.textContent="트렌드 데스크"; if(qEl)qEl.placeholder="주제 검색 (예: 명조, 스위치, 사전예약)";
   const mast=`<div class="masthead" style="--ac:var(--a-trend)"><div class="mk">${svg("news")}일간 토픽 데스크</div>`+
     `<div class="mt">오늘 쓸 만한 게임 주제, 뉴스처럼 하루 한 판</div></div>`;
   if(!TREND.length){
     subEl.textContent="일간 토픽 데스크";
     contentEl.innerHTML=`<div class="news">${pinBox()}${mast}`+
       emptyBox("base","아직 발행된 토픽 데스크가 없어요.<br>매일 아침 6시 루틴이 그날의 주제를 모아 올립니다.")+`</div>`;
     bindPinBox();
     return;
   }
   /* ★페이저는 «전체 날짜»를 그린다(경량본이 allDates 로 실어 준다) — 안 그러면 3일치만 있는 것처럼 보인다.
      경량본에 없는 날짜를 고르면 아래에서 전량을 받아 다시 그린다. */
   const dates=TREND_DATES.length?TREND_DATES:TREND.map(e=>e.date);
   if(!state.trendDate||dates.indexOf(state.trendDate)<0)state.trendDate=dates[0];

   /* 목록 행 = 게임명 · 주제 · [발주 요청]. 그 외 정보는 전부 발주 모달로 갔다(08-15 사용자 지시).
      '이미 다룬 글' 경고만 예외로 남긴다 — 발주 여부를 뒤집는 신호라 누르기 전에 보여야 한다. */
   const row=(it)=>{
     const s=DESK_SEC[it.sec]||DESK_SECTIONS[0];
     const warn=it.coverage.length
       ? `<span class="tr-warn" title="${esc(it.coverage.map(c=>c.writer+" 「"+c.title+"」").join(" · "))} — 발주 전에 각도가 겹치지 않는지 확인하세요"`+
         ` aria-label="이미 다룬 글 ${it.coverage.length}건">${svg("alertTri")}<b>${it.coverage.length}</b></span>` : "";
     return `<div class="trow" style="--ac:${s.ac}">`+
       `<span class="tr-bar" aria-hidden="true"></span>`+
       `<span class="tr-g">${esc(it.game||"—")}</span>`+
       `<span class="tr-m"><span class="tr-h">${esc(it.title)}</span>${warn}</span>`+
       `<span class="tr-a">`+
         `<button type="button" class="tr-req" data-req="${esc(it.id)}"><span class="lbl">발주 요청</span><span class="knob">${svg("arrowR")}</span></button>`+
       `</span>`+
     `</div>`;
   };

   /* 검색 = 전체 에디션 횡단 — 경량본만 있으면 3일치만 뒤져 «없다»고 거짓말하게 된다. 먼저 전량을 받는다. */
   if(state.q&&!TREND_FULL){
     subEl.textContent="지난 판을 불러오는 중…";
     contentEl.innerHTML=`<div class="news">${pinBox()}${mast}`+
       `<div class="tsec"><div class="tsec-b"><div class="ed-empty">지난 판을 불러오는 중이에요…</div></div></div></div>`;
     bindPinBox();
     ensureFullTrend().then(()=>{ if(state.view==="__trend__")renderTrend(); });
     return;
   }
   /* 검색 = 전체 에디션 횡단 */
   if(state.q){
     const q=state.q;
     const hits=[];
     TREND.forEach(ed=>edItems(ed).forEach(it=>{
       const hay=(it.title+" "+it.game+" "+it.why+" "+it.detail+" "+it.angle+" "+it.purpose+" "+
                  it.platform+" "+it.keywords.join(" ")+" "+ed.date).toLowerCase();
       if(hay.includes(q))hits.push(it);
     }));
     subEl.innerHTML=`'${esc(q)}' 검색 · <b>${hits.length}</b>건 · 전체 ${dates.length}일치`;
     contentEl.innerHTML=`<div class="news">${pinBox()}${mast}`+
       (hits.length?`<div class="tsec"><div class="tlist" style="border-radius:var(--r-lg);border-top:1px solid var(--line)">`+
         hits.map(row).join("")+`</div></div>`
        :emptyBox("search",`‘${esc(q)}’에 해당하는 주제가 없어요.`))+`</div>`;
     bindPinBox(); bindDesk();
     return;
   }

   /* 고른 날짜가 경량본에 없다 = 3일 밖의 과거 판. 여기서만 전량을 받는다(부팅에서 받지 않는 이유). */
   const edHit=TREND.find(e=>e.date===state.trendDate);
   if(!edHit&&!TREND_FULL){
     subEl.innerHTML=`<b>${esc(state.trendDate)}</b> 데스크 · 불러오는 중…`;
     contentEl.innerHTML=`<div class="news">${pinBox()}${mast}`+
       datePager(dates,state.trendDate,"trend","var(--a-trend)")+
       `<div class="tsec"><div class="tsec-b"><div class="ed-empty">지난 판을 불러오는 중이에요…</div></div></div></div>`;
     attachPager("trend",dates); bindPinBox();
     ensureFullTrend().then(()=>{ if(state.view==="__trend__")renderTrend(); });
     return;
   }
   const ed=edHit||TREND[0];
   const all=edItems(ed);
   const stats=DESK_SECTIONS.map(s=>{
     const n=(ed.sections.find(x=>x.key===s.key)||{items:[]}).items.length;
     return `<span class="ed-stat" style="--cc:${s.ac}"><b>${n}</b>${esc(s.label)}</span>`;
   }).join("");
   const head=`<div class="masthead" style="--ac:var(--a-trend)"><div class="mk">${svg("news")}일간 토픽 데스크</div>`+
     `<div class="mt">${esc(ed.headline||"오늘의 게임 주제")}</div>`+
     `<div class="ed-stats">${stats}</div>`+
     /* 데스크 노트 = 한 덩어리 문단이 아니라 줄 목록. ★로 시작하는 줄은 경고로 따로 세운다.
        (08-14~09-01 판은 문자열이라 splitLines 가 ★ 기준으로 쪼갠다 — 옛 판도 같이 읽힌다) */
     (ed.note.length?`<ul class="ed-note">`+ed.note.map(n=>
       `<li${isCaution(n)?` class="warn"`:""}>${esc(n.replace(/^★+\s*/,""))}</li>`).join("")+`</ul>`:"")+`</div>`;
   const secs=DESK_SECTIONS.map((s,si)=>{
     const items=(ed.sections.find(x=>x.key===s.key)||{items:[]}).items;
     /* 빈 칸 문구는 분류마다 뜻이 다르다 — pinned 가 비었다면 '소식이 없어서'가 아니라
        아직 아무것도 지정하지 않았거나(=상자가 비었음) 지정이 다음 회차에 반영되기 전이다. */
     const emptyTx=(s.key!=="pinned")
       ? "오늘은 이 분류에서 건질 만한 주제가 없었어요.<br>없는 걸 채우지 않는 게 원칙이라 비워 둡니다."
       : (PINS.length
           ? "지정한 게임의 주제는 <b>다음 회차 데스크</b>부터 올라와요.<br>지금 지정된 게임 "+PINS.length+"종"
           : "위 상자에 게임을 지정하면 <b>게임마다 주제 3~5개</b>를 여기에 모아 둡니다.");
     const body=items.length
       ? `<div class="tlist">${items.map(row).join("")}</div>`
       : `<div class="tsec-b"><div class="ed-empty">${emptyTx}</div></div>`;
     return `<section class="tsec reveal" style="--ac:${s.ac};--i:${si+1}">`+
       `<div class="tsec-h"><span class="tsec-ic">${svg(s.icon)}</span>`+
         `<span class="tsec-t">${esc(s.label)}</span><span class="tsec-d">${esc(s.desc)}</span>`+
         `<span class="tsec-n">${items.length}</span></div>`+
       body+`</section>`;
   }).join("");
   subEl.innerHTML=`<b>${esc(ed.date)}</b> 데스크 · 주제 ${all.length}건 · 전체 ${dates.length}일치 누적`;
   contentEl.innerHTML=`<div class="news">${pinBox()}${head}`+
     datePager(dates,state.trendDate,"trend","var(--a-trend)")+secs+`</div>`;
   attachPager("trend",dates);
   bindPinBox(); bindDesk();
 }
 /* 데스크 카드의 버튼 배선 — id로 현재 에디션(또는 전체)에서 아이템을 되찾는다 */
 function deskItemById(id){
   for(const ed of TREND){ const hit=edItems(ed).find(x=>x.id===id); if(hit)return hit; }
   return null;
 }
 /* 발주 양식 클립보드 복사 — 08-15 개편으로 목록 행에서 빠지고 발주 모달 안으로 들어갔다.
    ★모달 안에서 부르므로 화면에 보이는 '지금 값'(사용자가 고친 주제·목적·소재)을 그대로 받는다.
      원본 it 을 다시 조립하면 사용자가 방금 고친 내용이 복사본에서 사라진다. */
 async function copyOrderForm(o){
   const block="[목적] "+(o.purpose||"기타")+"\n[작성자] "+(o.writer||"미지정")+"\n[주제] "+(o.topic||"")+
     "\n[소재/참고메모] "+(o.material||"(없음)");
   try{ await navigator.clipboard.writeText(block); toast("발주 양식을 복사했어요."); return true; }
   catch(_){ try{ const ta=document.createElement("textarea"); ta.value=block; document.body.appendChild(ta);
     ta.select(); document.execCommand("copy"); document.body.removeChild(ta); toast("발주 양식을 복사했어요."); return true; }
     catch(e2){ toast("복사에 실패했어요.","err"); return false; } }
 }
 function bindDesk(){
   contentEl.querySelectorAll("[data-req]").forEach(b=>b.addEventListener("click",()=>{
     const it=deskItemById(b.dataset.req); if(it)openOrderModal(it,b);
   }));
 }

 /* ========================================================================
    발주 요청 모달 — 주제를 고른 뒤 '누가 쓸지'를 여기서 정한다.
    작성자를 트렌드 데이터에 박아두지 않는 게 이 개편의 핵심이라, 배정은 전적으로 이 창의 몫이다.
    백엔드 계약은 '새 글 요청' 폼과 동일(POST /requests) — source 만 trend-desk 로 구분한다.
    ======================================================================== */
 const DESK_PURPOSES=["사전예약","출시·첫인상","업데이트·패치","게임 정보","게임 공략","쿠폰·이벤트","티어·추천","제품 비교·추천","사용 후기·리뷰","기타"];
 let ORDER_MODAL=null;
 function closeOrderModal(){
   if(!ORDER_MODAL)return;
   const back=ORDER_MODAL.back, prev=ORDER_MODAL.opener;
   document.removeEventListener("keydown",ORDER_MODAL.onKey);
   back.classList.remove("on");
   ORDER_MODAL=null;
   setTimeout(()=>{ if(back.parentNode)back.parentNode.removeChild(back); },300);
   document.body.style.overflow="";
   if(prev&&prev.focus)try{prev.focus();}catch(_){}
 }
 function openOrderModal(it,opener){
   if(ORDER_MODAL)closeOrderModal();
   const s=DESK_SEC[it.sec]||DESK_SECTIONS[0];
   const writers=PREF.filter(w=>INACTIVE_WRITERS.indexOf(w)<0);
   const WI={
     "봄딩":{plat:"네이버",ac:"--a-bomding"}, "영도":{plat:"네이버",ac:"--a-yeongdo"},
     "겜더쿠":{plat:"티스토리",ac:"--a-gemdeokku"}, "연봄":{plat:"티스토리",ac:"--a-yeonbom"},
     "하루살이":{plat:"네이버",ac:"--a-harusari"}
   };
   /* 레인이 있으면(주로 다루는 게임) 그 작성자를 기본 선택으로 둔다 — 강제가 아니라 기본값. 언제든 바꿀 수 있다. */
   const pre=(it.lane&&writers.indexOf(it.lane)>=0)?it.lane:"";
   const chips=`<button type="button" class="rf-chip rf-wchip${pre?"":" on"}" data-w="">자동 배정</button>`+
     writers.map(w=>{const i=WI[w]||{};
       return `<button type="button" class="rf-chip rf-wchip${w===pre?" on":""}" data-w="${esc(w)}" style="--ac:var(${i.ac||"--brand"})">`+
         `${avatar(w,"s")}${esc(w)}<span class="rf-chip-plat">${esc(i.plat||"")}</span></button>`;}).join("");
   const purOpts=DESK_PURPOSES.map(p=>
     `<option value="${esc(p)}"${p===it.purpose?" selected":""}>${esc(p)}</option>`).join("");
   /* 주제 브리핑 — 08-15 개편으로 목록 행에서 뺀 맥락(게임·플랫폼·시점·화제도·왜 지금·출처)이 여기로 왔다.
      행은 훑는 자리, 이 창은 정하는 자리다. 판단 근거는 정하는 자리에 있어야 한다. */
   const heat=it.heat?`<span class="tr-heat" title="화제도 ${it.heat}/3" aria-label="화제도 ${it.heat}/3">`+
     [1,2,3].map(n=>`<i class="${n<=it.heat?"on":""}"></i>`).join("")+`</span>`:"";
   /* detail = 검증된 사실 2~3문장 + ★확인 필요 표시가 한 덩어리로 붙어 있다.
      textarea 안에만 두면 발주 판단을 스크롤하며 해야 한다 — 라벨 붙은 줄로 밖에 세운다(09-02). */
   const dl=splitLines(it.detail);
   const facts=dl.filter(s=>!isCaution(s)), cautions=dl.filter(isCaution);
   const fld=(k,v)=>v?`<div class="rf-bf"><span class="rf-bk">${k}</span><span class="rf-bv">${esc(v)}</span></div>`:"";
   const brief=`<div class="rf-brief">`+
     `<div class="rf-bh"><span class="rf-bg">${esc(it.game||"—")}</span>`+
       (it.platform?`<span class="rf-bp">${esc(it.platform)}</span>`:"")+
       (it.when?`<span class="rf-bw">${esc(it.when)}</span>`:"")+heat+`</div>`+
     fld("왜 지금",it.why)+
     (facts.length?`<div class="rf-bf"><span class="rf-bk">확인된 사실</span><span class="rf-bv">`+
       facts.map(s=>`<span class="rf-bl">${esc(s)}</span>`).join("")+`</span></div>`:"")+
     fld("각도",it.angle)+
     (cautions.length?`<div class="rf-bcau">`+cautions.map(s=>
       `<span class="rf-bl">${esc(s.replace(/^★+\s*/,""))}</span>`).join("")+`</div>`:"")+
     (it.sources.length?`<div class="rf-bsrc">`+it.sources.map(s2=>
       `<a href="${esc(s2.url)}" target="_blank" rel="noopener noreferrer">${esc(s2.label)}${svg("arrowUR")}</a>`).join("")+`</div>`:"")+
   `</div>`;
   const back=document.createElement("div");
   back.className="mdl-back"; back.setAttribute("role","dialog"); back.setAttribute("aria-modal","true");
   back.setAttribute("aria-labelledby","mdlTitle");
   back.innerHTML=`<div class="mdl" style="--ac:${s.ac}"><div class="mdl-core">
     <div class="mdl-h">
       <span class="hic">${svg("send")}</span>
       <div><div class="mdl-ht" id="mdlTitle">발주 요청</div>
         <div class="mdl-hs">${esc(s.label)} · 누가 쓸지 정하면 작업 큐로 바로 들어가요</div></div>
       <button type="button" class="mdl-x" id="mdlX" aria-label="닫기">${svg("x")}</button>
     </div>
     <div class="mdl-b">
       ${brief}
       <div class="rf-sec">누가 쓸까요</div>
       <div class="rf-chips" id="mdlChips">${chips}</div>
       <div class="rf-winfo" id="mdlWInfo">${pre
         ? `${esc((WI[pre]||{}).plat||"")} · <b>${esc(pre)}</b>가 이 게임을 계속 써 온 작성자라 미리 골라뒀어요 — 바꿔도 됩니다`
         : "주제에 맞는 작성자를 회사가 배정해요"}</div>
       <div class="rf-sec">무엇을 쓸까요</div>
       <label class="rf-l" for="mdlPurpose">글의 목적</label>
       <select id="mdlPurpose" class="rf-i">${purOpts}</select>
       <label class="rf-l" for="mdlTopic" style="margin-top:16px">주제 <span class="rf-req">*</span></label>
       <input id="mdlTopic" class="rf-i" type="text" maxlength="200" value="${esc(it.title)}">
       <label class="rf-l" for="mdlMaterial" style="margin-top:16px">소재·참고 메모 <span class="rf-opt">(그대로 보내도 되고, 고쳐도 돼요)</span></label>
       <textarea id="mdlMaterial" class="rf-i rf-ta" maxlength="2000">${esc(deskMaterial(it))}</textarea>
       ${it.coverage.length?`<div class="rf-hint on" style="margin-top:12px">${svg("alertTri")}<span><b>이미 다룬 글</b> — `+
         it.coverage.map(c=>`${esc(c.writer)} 「${esc(c.title)}」`).join(" · ")+
         `. 같은 각도면 발주하지 말고, 새 각도라면 무엇이 다른지 소재 메모에 적어주세요.</span></div>`:""}
     </div>
     <div class="mdl-f">
       <button type="button" class="mdl-copy" id="mdlCopy" title="발주 양식 복사">${svg("copy")}<span>양식 복사</span></button>
       <button type="button" class="mdl-cancel" id="mdlCancel">취소</button>
       <button type="button" class="mdl-go" id="mdlGo"><span class="lbl">작업 큐로 보내기</span><span class="knob">${svg("arrowR")}</span></button>
       <div class="mdl-msg" id="mdlMsg" role="status" aria-live="polite"></div>
     </div>
   </div></div>`;
   document.body.appendChild(back);
   document.body.style.overflow="hidden";
   const $=q=>back.querySelector(q);
   let writer=pre;
   $("#mdlChips").querySelectorAll(".rf-wchip").forEach(c=>c.addEventListener("click",()=>{
     $("#mdlChips").querySelectorAll(".rf-wchip").forEach(x=>x.classList.remove("on"));
     c.classList.add("on"); writer=c.dataset.w;
     const i=WI[writer];
     $("#mdlWInfo").textContent=writer?(i&&i.plat?i.plat+" · ":"")+writer+" 계정으로 발행돼요":"주제에 맞는 작성자를 회사가 배정해요";
   }));
   const onKey=e=>{
     if(e.key==="Escape"){ e.preventDefault(); closeOrderModal(); return; }
     if(e.key!=="Tab")return;
     const f=[...back.querySelectorAll('button,select,input,textarea,a[href]')].filter(el=>!el.disabled&&el.offsetParent!==null);
     if(!f.length)return;
     const first=f[0],last=f[f.length-1];
     if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
     else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
   };
   document.addEventListener("keydown",onKey);
   back.addEventListener("mousedown",e=>{ if(e.target===back)closeOrderModal(); });
   $("#mdlX").addEventListener("click",closeOrderModal);
   $("#mdlCancel").addEventListener("click",closeOrderModal);
   $("#mdlCopy").addEventListener("click",()=>copyOrderForm({
     purpose:$("#mdlPurpose").value, writer, topic:$("#mdlTopic").value.trim()||it.title,
     material:$("#mdlMaterial").value.trim()
   }));
   const msg=(t,k)=>{ const m=$("#mdlMsg"); m.textContent=t; m.className="mdl-msg"+(k?" "+k:""); };
   if(!RequestService.isConnected())msg("백엔드가 연결돼 있지 않아 임시 저장만 됩니다.","err");
   $("#mdlGo").addEventListener("click",async()=>{
     const topic=$("#mdlTopic").value.trim();
     if(!topic){ msg("주제를 입력해주세요.","err"); $("#mdlTopic").focus(); return; }
     const go=$("#mdlGo"); go.disabled=true; msg("보내는 중…");
     try{
       const rec=await RequestService.submit({purpose:$("#mdlPurpose").value,topic,
         material:$("#mdlMaterial").value.trim(),writer,source:"trend-desk"});
       if(rec.status==="submitted"){
         closeOrderModal();
         toast((writer||"자동 배정")+" · 작업 큐로 보냈어요.");
         if(opener){ opener.classList.add("done"); opener.disabled=true;
           opener.querySelector(".lbl").textContent="발주함"; opener.querySelector(".knob").innerHTML=svg("check"); }
         refreshQueueBadge();
       } else if(rec.status==="queued"){ msg("네트워크 문제로 임시 저장했어요. 연결되면 ‘새 글 요청’에서 다시 보내주세요.","err"); go.disabled=false; }
       else { msg("임시 저장했어요(백엔드 미연결).","ok"); go.disabled=false; }
     }catch(e){ msg("전송 실패: "+((e&&e.message)||e),"err"); go.disabled=false; }
   });
   ORDER_MODAL={back,onKey,opener:opener||null};
   requestAnimationFrame(()=>{ back.classList.add("on"); const t=$("#mdlTopic"); if(t)t.focus(); });
 }

 /* ========================================================================
    관리자 모드 — GitHub 토큰으로 잠금 해제 후 미발행 글을 사이트에서 직접 삭제.
    삭제 = GitHub Git Data API 로 글 폴더의 파일(blob)들을 제거하고 posts.json/
           manifest.json 을 갱신하는 단일 커밋을 만든다(서버·PC 불필요).
    보안: 진짜 잠금은 토큰. 토큰이 없으면 패널을 열어도 아무 것도 못 한다.
          발행된 글(published)은 삭제 버튼 자체가 안 붙는다.
    ===================================================================== */
 (function(){
   const OWNER="qtdqtd002-coder", REPO="bomding-blog-preview", BRANCH="main";
   const API="https://api.github.com/repos/"+OWNER+"/"+REPO;
   const LSK="bc_admin_token";
   let on=false, token="", who="";

   const authHdr=t=>({"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
   async function gh(path,opts){
     const url=path.indexOf("http")===0?path:API+path;
     const res=await fetch(url,Object.assign({headers:authHdr(token)},opts||{}));
     if(!res.ok){ let m=""; try{ m=(await res.json()).message; }catch(_){ } throw new Error("GitHub "+res.status+(m?": "+m:"")); }
     return res.status===204?null:res.json();
   }
   async function validate(t){
     const r=await fetch("https://api.github.com/user",{headers:authHdr(t)});
     if(!r.ok) throw new Error("토큰이 유효하지 않습니다 (HTTP "+r.status+").");
     const u=await r.json();
     const rr=await fetch(API,{headers:authHdr(t)});
     if(!rr.ok) throw new Error("이 토큰으로 리포에 접근할 수 없어요 (HTTP "+rr.status+"). 리포 권한을 확인하세요.");
     const repo=await rr.json();
     if(repo.permissions&&repo.permissions.push===false) throw new Error("이 토큰엔 쓰기(Contents: Read and write) 권한이 없어요.");
     return u.login;
   }
   async function getFile(p){
     const r=await gh("/contents/"+p.split("/").map(encodeURIComponent).join("/")+"?ref="+BRANCH);
     const bin=atob(String(r.content||"").replace(/\s/g,""));
     const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
     return new TextDecoder("utf-8").decode(bytes);
   }

   function relFolder(rel){ const i=rel.lastIndexOf("/"); return i<0?"":rel.slice(0,i); }
   function delScope(rel){
     const f=relFolder(rel);
     const same=POSTS.filter(x=>relFolder(x.rel)===f);
     return (f && same.length<=1) ? {folder:f,whole:true} : {folder:f,whole:false};
   }

   async function deletePost(rel,title){
     const p=POSTS.find(x=>x.rel===rel);
     if(!p) throw new Error("목록에 없는 글입니다.");
     if(p.published) throw new Error("발행된 글은 삭제할 수 없습니다.");
     const sc=delScope(rel);

     const ref=await gh("/git/ref/heads/"+BRANCH);
     const headSha=ref.object.sha;
     const commit=await gh("/git/commits/"+headSha);
     const baseTree=commit.tree.sha;
     const tree=await gh("/git/trees/"+baseTree+"?recursive=1");
     if(tree.truncated) throw new Error("리포 트리가 너무 커 안전 처리 불가(트리 잘림).");

     let delPaths;
     if(sc.whole){ delPaths=tree.tree.filter(t=>t.type==="blob"&&(t.path===rel||t.path.indexOf(sc.folder+"/")===0)).map(t=>t.path); }
     else { delPaths=[rel]; }
     if(!delPaths.length) throw new Error("삭제할 파일을 찾지 못했습니다.");

     // posts.json / manifest.json 갱신본 준비(삭제된 rel 제거)
     let postsArr=JSON.parse(await getFile("posts.json"));
     if(!Array.isArray(postsArr)) postsArr=[postsArr];
     postsArr=postsArr.filter(x=>delPaths.indexOf(x.rel)<0);
     let manObj=JSON.parse(await getFile("manifest.json"));
     delPaths.forEach(dp=>{ if(Object.prototype.hasOwnProperty.call(manObj,dp)) delete manObj[dp]; });

     const items=delPaths.map(pth=>({path:pth,mode:"100644",type:"blob",sha:null}));
     items.push({path:"posts.json",mode:"100644",type:"blob",content:JSON.stringify(postsArr,null,2)});
     items.push({path:"manifest.json",mode:"100644",type:"blob",content:JSON.stringify(manObj,null,2)});

     const newTree=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:baseTree,tree:items})});
     const newCommit=await gh("/git/commits",{method:"POST",body:JSON.stringify({
       message:"글 삭제(관리자): "+title+"\n\nrel: "+rel,tree:newTree.sha,parents:[headSha]})});
     await gh("/git/refs/heads/"+BRANCH,{method:"PATCH",body:JSON.stringify({sha:newCommit.sha})});

     POSTS=POSTS.filter(x=>delPaths.indexOf(x.rel)<0);
     return {count:delPaths.length};
   }

   /* 발행 완료(수동)는 이제 백엔드 MpubSvc(무토큰·가역)로 처리한다 → onTogglePublished 참고.
      (옛 깃 published.json 커밋 방식은 토큰이 필요해 제거했고, 자동검증 발행은 check-published.ps1 가 계속 담당) */

   /* ---- 토스트 ---- 2026-08-14 모듈 스코프로 이관(위 `function toast` 하나만 남긴다). */

   /* ---- 카드 우상단 아이콘 메뉴(미발행만): 발행 완료 · 글 삭제 ---- */
   let _pop=null;
   function ensurePop(){
     if(_pop) return _pop;
     _pop=document.createElement("div"); _pop.className="admin-menu-pop"; _pop.hidden=true;
     /* 숨기기/해제·발행완료/취소: 토큰 불필요(누구나). 삭제만: 관리자(GitHub 토큰) 필요. */
     _pop.innerHTML='<button type="button" data-act="hide"></button>'+
                    '<button type="button" data-act="pub"></button>'+
                    '<div class="admin-menu-sep"></div>'+
                    '<button type="button" data-act="del">'+svg("trash")+'글 삭제</button>';
     _pop.querySelectorAll("[data-act]").forEach(it=>it.addEventListener("click",ev=>{
       ev.preventDefault(); ev.stopPropagation();
       const act=it.dataset.act, rel=_pop._rel, card=_pop._card; _pop.hidden=true;
       if(act==="hide") onToggleHide(rel,card);          /* 토큰 불필요 */
       else if(act==="pub") onTogglePublished(rel,card); /* 토큰 불필요 */
       else if(act==="del") requireUnlock(()=>onDelete(rel,card));
     }));
     document.body.appendChild(_pop);
     return _pop;
   }
   function closePop(){ if(_pop)_pop.hidden=true; }
   function openPopFor(btn,rel,card){
     const pop=ensurePop(); pop._rel=rel; pop._card=card; pop.hidden=false;
     const hb=pop.querySelector('[data-act="hide"]'); const isH=HIDDEN.has(rel);   /* 현재 숨김 상태로 라벨 결정 */
     if(hb)hb.innerHTML=svg(isH?"eye":"eyeOff")+(isH?"숨김 해제":"숨기기");
     const pbtn=pop.querySelector('[data-act="pub"]'); const isM=MPUB.has(rel);     /* 수동 발행완료 상태로 라벨 결정 */
     if(pbtn)pbtn.innerHTML=svg(isM?"eyeOff":"checkCircle")+(isM?"발행 완료 취소":"발행 완료");
     /* 삭제는 발행됨(자동·수동) 글엔 막혀 있으므로, 발행 상태면 삭제 버튼을 숨긴다(취소 후 삭제). */
     const dbtn=pop.querySelector('[data-act="del"]'); if(dbtn)dbtn.style.display=(card&&card.dataset.pub==="1")?"none":"";
     const r=btn.getBoundingClientRect(); const pw=pop.offsetWidth||150;
     let left=r.right-pw; if(left<8)left=8;
     let top=r.bottom+6; if(top+pop.offsetHeight>window.innerHeight-8)top=Math.max(8,r.top-pop.offsetHeight-6);
     pop.style.top=top+"px"; pop.style.left=left+"px";
   }
   /* 메뉴 아이콘은 항상 노출(미발행 글). 실제 삭제/발행완료를 누를 때만 토큰 인증을 요구한다. */
   function injectButtons(){
     contentEl.querySelectorAll(".card,.feat").forEach(card=>{
       if(card.dataset.autopub==="1") return;       /* 자동검증 발행글만 보호(메뉴 없음). 수동 발행완료는 메뉴 유지(취소 가능) */
       if(card.querySelector(".admin-menu")) return;
       const rel=card.dataset.rel; if(!rel) return;
       const wrap=document.createElement("div"); wrap.className="admin-menu";
       wrap.innerHTML='<button type="button" class="admin-menu-btn" title="관리 (숨기기·발행완료·삭제)" aria-label="글 관리 메뉴">'+svg("dots")+'</button>';
       const btn=wrap.querySelector(".admin-menu-btn");
       btn.addEventListener("click",ev=>{ ev.preventDefault(); ev.stopPropagation();
         if(_pop&&!_pop.hidden&&_pop._card===card){ closePop(); return; }
         openPopFor(btn,rel,card);
       });
       card.appendChild(wrap); card.classList.add("has-mgmt"); if(on)card.classList.add("admin-on");
     });
   }
   function syncOutlines(){ document.querySelectorAll(".card,.feat").forEach(c=>{ if(c.querySelector(".admin-menu"))c.classList.toggle("admin-on",on); }); }
   document.addEventListener("click",e=>{ if(_pop&&!_pop.hidden&&!e.target.closest(".admin-menu")&&!e.target.closest(".admin-menu-pop")) closePop(); });
   window.addEventListener("scroll",closePop,true);
   window.addEventListener("resize",closePop);

   async function onDelete(rel,card){
     const p=POSTS.find(x=>x.rel===rel); const title=(p&&p.title)||rel;
     const sc=delScope(rel);
     const scopeTxt=sc.whole?"글 폴더 전체(본문·이미지·붙여넣기본 포함)":"이 글 HTML 1개(폴더에 다른 글이 있어 폴더는 유지)";
     if(!confirm("정말 삭제할까요?\n\n「"+title+"」\n"+rel+"\n\n"+scopeTxt+"가 깃에서 제거되고 즉시 커밋됩니다.\n사이트/앱 반영까지 1~2분 · 깃 히스토리로 복구 가능.")) return;
     toast("삭제 중…");
     try{
       const r=await deletePost(rel,title);
       toast("삭제 완료 ("+r.count+"개 파일 제거) · 사이트 반영 1~2분","ok");
       render();
     }catch(e){ toast("삭제 실패: "+(e&&e.message||e),"err"); }
   }

   /* ---- 숨기기/숨김 해제 (토큰 불필요 — 누구나) ---- */
   async function onToggleHide(rel,card){
     const p=POSTS.find(x=>x.rel===rel); const title=(p&&p.title)||rel;
     const isH=HIDDEN.has(rel);
     if(!HiddenSvc.isConnected()){ toast("백엔드 미연결 — 숨김은 서버 연결이 필요해요.","err"); return; }
     if(!isH && !confirm("이 글을 숨길까요?\n\n「"+title+"」\n\n목록에서 모두에게 가려집니다(글은 삭제되지 않고 그대로 보존돼요).\n누구나 ‘숨긴 글 보기’에서 다시 해제할 수 있어요 · 즉시 반영.")) return;
     toast(isH?"숨김 해제 중…":"숨기는 중…");
     try{
       if(isH) await HiddenSvc.unhide(rel); else await HiddenSvc.hide(rel);
       toast(isH?"숨김을 해제했어요 · 모두에게 다시 보여요":"숨겼어요 · 모두에게 적용됐어요","ok");
       render();
     }catch(e){ toast((isH?"숨김 해제 실패: ":"숨김 실패: ")+(e&&e.message||e),"err"); }
   }

   /* ---- 발행 완료 / 발행 완료 취소 (토큰 불필요 — 누구나, 백엔드 저장) ---- */
   async function onTogglePublished(rel,card){
     const p=POSTS.find(x=>x.rel===rel); const title=(p&&p.title)||rel;
     const isM=MPUB.has(rel);
     if(!MpubSvc.isConnected()){ toast("백엔드 미연결 — 발행완료는 서버 연결이 필요해요.","err"); return; }
     if(!isM && !confirm("이 글을 ‘발행 완료’로 표시할까요?\n\n「"+title+"」\n\n‘발행됨’ 라벨이 붙고 딤드 처리돼요(‘발행글 보기’를 끄면 가려짐).\n누구나 다시 ‘발행 완료 취소’할 수 있어요 · 즉시 반영.")) return;
     toast(isM?"발행 완료 취소 중…":"발행 완료 처리 중…");
     try{
       if(isM) await MpubSvc.unmark(rel); else await MpubSvc.mark(rel);
       if(p) p.published=p.autopub||MPUB.has(rel);   /* 표시값 즉시 갱신(로드 후 토글 반영) */
       toast(isM?"발행 완료를 취소했어요 · 모두에게 반영":"발행 완료로 표시했어요 · 모두에게 반영","ok");
       render();
     }catch(e){ toast((isM?"발행 완료 취소 실패: ":"발행 완료 처리 실패: ")+(e&&e.message||e),"err"); }
   }

   /* ---- 관리자 상태 ---- */
   function requireUnlock(fn){ if(on){ fn(); } else { openModal(fn); } }   /* 잠금 풀려 있으면 즉시, 아니면 토큰 인증 후 이어서 실행 */
   function setOn(t,login){ on=true; token=t; who=login||""; try{ localStorage.setItem(LSK,t); }catch(_){ } updateBtn(); injectButtons(); syncOutlines(); chip(true); }
   function setOff(){ on=false; token=""; who=""; try{ localStorage.removeItem(LSK); }catch(_){ } closePop(); syncOutlines(); chip(false); updateBtn(); }
   function updateBtn(){ const b=document.getElementById("adminToggle"); if(!b) return; b.classList.toggle("on",on);
     b.innerHTML=svg(on?"lockOpen":"lock"); b.title=on?("관리자 모드 ON"+(who?" · "+who:"")):"관리자 모드"; }

   let _chip=null;
   function chip(show){
     if(show){ if(!_chip){ _chip=document.createElement("div"); _chip.className="adm-chip";
         _chip.innerHTML=svg("lockOpen")+"<span>관리자 모드</span>"; const x=document.createElement("button"); x.textContent="끄기";
         x.addEventListener("click",setOff); _chip.appendChild(x); document.body.appendChild(_chip); } }
     else if(_chip){ _chip.remove(); _chip=null; }
   }

   /* ---- 로그인/상태 모달 ---- (onSuccess: 잠금 해제 직후 이어서 실행할 동작) */
   function openModal(onSuccess){
     const mask=document.createElement("div"); mask.className="adm-mask";
     const close=()=>mask.remove();
     mask.addEventListener("click",e=>{ if(e.target===mask) close(); });
     let inner;
     if(on){
       inner=document.createElement("div"); inner.className="adm-box";
       inner.innerHTML=
         '<h3>'+svg("lockOpen")+'관리자 모드 켜짐</h3>'+
         '<p>로그인: <b>'+esc(who||"(확인됨)")+'</b><br>관리자 모드는 이제 <b>글 삭제</b>에만 필요해요. 숨기기·발행 완료는 토큰 없이 누구나 ⋮ 메뉴에서 할 수 있어요. 자동검증 발행글은 보호됩니다.</p>'+
         '<div class="adm-row"><button class="adm-btn danger" id="admLogout">로그아웃(토큰 지움)</button>'+
         '<button class="adm-btn ghost" id="admClose">닫기</button></div>';
       mask.appendChild(inner); document.body.appendChild(mask);
       inner.querySelector("#admClose").addEventListener("click",close);
       inner.querySelector("#admLogout").addEventListener("click",()=>{ setOff(); close(); toast("관리자 모드를 껐어요.",""); });
       return;
     }
     inner=document.createElement("div"); inner.className="adm-box";
     inner.innerHTML=
       '<h3>'+svg("lock")+'관리자 모드 켜기</h3>'+
       '<p>이 사이트의 깃허브 저장소에 쓰기 권한이 있는 <b>GitHub 토큰</b>으로 잠금을 풉니다. (계정 비밀번호가 아니라 토큰이에요.)</p>'+
       '<label>GitHub Personal Access Token</label>'+
       '<input id="admTok" type="password" placeholder="github_pat_… 또는 ghp_…" autocomplete="off" spellcheck="false">'+
       '<div class="adm-note">토큰 만들기 → <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained token 생성</a><br>· Repository access: <b>'+REPO+'</b>만 선택 · Permissions → <b>Contents: Read and write</b><br>· 입력한 토큰은 이 브라우저에만 저장되고 외부로 보내지 않습니다(깃허브 API 직접 호출).</div>'+
       '<div class="adm-msg" id="admMsg"></div>'+
       '<div class="adm-row"><button class="adm-btn primary" id="admGo">켜기</button>'+
       '<button class="adm-btn ghost" id="admCancel">취소</button></div>';
     mask.appendChild(inner); document.body.appendChild(mask);
     const tokEl=inner.querySelector("#admTok"), msg=inner.querySelector("#admMsg"), go=inner.querySelector("#admGo");
     inner.querySelector("#admCancel").addEventListener("click",close);
     tokEl.focus();
     async function submit(){
       const t=tokEl.value.trim(); if(!t){ msg.className="adm-msg err"; msg.textContent="토큰을 입력하세요."; return; }
       go.disabled=true; msg.className="adm-msg"; msg.textContent="확인 중…";
       try{ const login=await validate(t); setOn(t,login); close(); toast("관리자 모드 ON · "+login,"ok"); if(typeof onSuccess==="function")onSuccess(); }
       catch(e){ go.disabled=false; msg.className="adm-msg err"; msg.textContent=(e&&e.message)||String(e); }
     }
     go.addEventListener("click",submit);
     tokEl.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
   }

   /* ---- 초기화 ---- */
   const btn=document.getElementById("adminToggle");
   if(btn){ updateBtn(); btn.addEventListener("click",()=>openModal()); }
   let saved=""; try{ saved=localStorage.getItem(LSK)||""; }catch(_){ }
   if(saved){ validate(saved).then(login=>setOn(saved,login)).catch(()=>{ try{ localStorage.removeItem(LSK); }catch(_){ } }); }
   if(location.hash==="#admin") openModal();
   const obs=new MutationObserver(()=>{ injectButtons(); });   /* 메뉴는 항상 주입(인증은 동작 시점) */
   if(contentEl){ obs.observe(contentEl,{childList:true,subtree:true}); injectButtons(); }
 })();

})();
</script>
</body></html>
