/* ══════════ 홈 — AI 브리핑 인용 · 일별 방문자 (2026-09-05) ══════════
   출처 = _trend/_citations.json(_tools/mate-citations.cjs, 데스크 [E] 하루 1회, 네이버 공개 프로필 스냅샷).
   행 값의 뜻: citations = 그 날짜 스냅샷→다음 스냅샷 사이 증분(어제까지만 있고 오늘은 집계 전) · visitors = 달력일 방문자(XML) 또는 06:00→06:00 차분.
   인용수는 네이버 메이트로 선정된 블로그만 공개 — 영도처럼 선정 전이면 «비공개»로 적지 0 으로 그리지 않는다(0 위장 금지). */
function fmtKo(n,sign){
  n=Number(n)||0; var a=Math.abs(n), t;
  if(a>=1e8)t=(a/1e8).toFixed(a>=1e9?0:1).replace(/\.0$/,'')+'억';
  else if(a>=1e4)t=(a/1e4).toFixed(a>=1e5?0:1).replace(/\.0$/,'')+'만';
  else t=a.toLocaleString('ko-KR');
  return (n<0?'−':(sign&&n>0?'+':''))+t;
}
function citeDays(n){ var out=[], now=Date.now(); for(var i=n;i>=1;i--)out.push(kstDay(now-i*DAY)); return out; }
function citeWriters(){ return CITES?CITES.writers.filter(function(w){ return w&&PREF.indexOf(w.name)>=0; }):[]; }
function rowMap(w){ var m={}; (w.rows||[]).forEach(function(r){ if(r&&r.d)m[r.d]=r; }); return m; }
function lastVal(w,key){ var rows=(w.rows||[]).filter(function(r){ return r&&r[key]!=null; }); return rows.length?rows[rows.length-1]:null; }

function citeRow(w){
  var L=w.latest||{}, m=w.mate, col=wac(w.name);
  var head='<div class="cr-h"><span class="cr-dot" style="--c:'+col+'"></span><b class="cr-n">'+esc(w.name)+'</b>'+
    (m?'<span class="cr-tag">'+esc(String(m.month||'')+'월 '+(m.topic||'')+' 메이트')+'</span>':'<span class="cr-tag off">메이트 선정 전</span>')+
    (w.error?'<span class="cr-err">수집 실패</span>':'')+'</div>';
  if(L.cum==null)return '<div class="cr">'+head+'<div class="cr-state">인용수 비공개 · 메이트 선정 시 자동 공개</div></div>';
  var last=lastVal(w,'citations');
  var stats='<div class="ks-stats">'+
    '<span><span class="ks-k">'+(last?esc(mdLabel(last.d)+(last.span>1?' · '+last.span+'일 합':'')):'어제')+'</span>'+(last?'<b class="ks-v">'+fmtKo(last.citations,true)+'</b>':'<b class="ks-v pend">집계 전</b>')+'</span>'+
    '<span><span class="ks-k">'+(L.monthNo||'')+'월</span><b class="ks-v">'+fmtKo(L.month)+'</b></span>'+
    '<span><span class="ks-k">기준월 '+(L.selMonth||'')+'월</span><b class="ks-v">'+fmtKo(L.sel)+'</b></span>'+
    '<span><span class="ks-k">누적</span><b class="ks-v">'+fmtKo(L.cum)+'</b></span></div>';
  var days=citeDays(14), rm=rowMap(w), vals=days.map(function(d){ var r=rm[d]; return r&&r.citations!=null?Number(r.citations):null; });
  var has=vals.some(function(v){ return v!=null; }), chart='';
  if(has){
    var W=chartW(560),H=150,padL=44,padR=8,padT=16,padB=24,pw=W-padL-padR,ph=H-padT-padB,slot=pw/days.length,bw=Math.min(24,slot*.5);
    var max=Math.max.apply(null,vals.map(function(v){ return v||0; }).concat([1])), step=niceStep(max), grid='';
    for(var v=0;v<=max;v+=step){ var gy=padT+ph-(v/max)*ph;
      grid+='<line class="grid" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'"/>'+
        '<text class="axis" x="'+(padL-7)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end">'+fmtKo(v)+'</text>'; }
    var maxI=-1, lastI=-1; vals.forEach(function(v,i){ if(v==null)return; lastI=i; if(maxI<0||v>vals[maxI])maxI=i; });
    var every=slot<30?2:1;   /* 좁은 폭(모바일)에선 날짜 라벨을 하루 걸러 — 11px 모노 «8.23» 이 18px 슬롯에 겹친다 */
    var cols=days.map(function(d,i){
      var v=vals[i], x=padL+slot*i+(slot-bw)/2, r=rm[d]||{}, bar='', cap='';
      var lab=(i%every===(days.length-1)%every)?'<text class="axis" x="'+(padL+slot*i+slot/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+mdLabel(d)+'</text>':'';   /* 끝(어제)에서부터 위상을 맞춘다 — «9.3 9.4» 붙음 방지(사용량 타일과 같은 공식) */
      if(v!=null){ var h=Math.max(2,(Math.max(0,v)/max)*ph), y=padT+ph-h;
        bar='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+col+'"/>';
        if(i===maxI||i===lastI)cap='<text class="cap" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle">'+fmtKo(v,true)+'</text>'; }
      var tip=mdLabel(d)+'|'+(v!=null?fmtKo(v,true)+(r.span>1?' ('+r.span+'일 합)':''):'집계 전')+'||'+(r.cum!=null?'누적|'+fmtKo(r.cum):'')+(r.at?';스냅샷|'+hhmm(Date.parse(r.at)):'');
      return '<g class="col">'+bar+cap+lab+
        '<rect class="hit" tabindex="0" x="'+(padL+slot*i).toFixed(1)+'" y="'+padT+'" width="'+slot.toFixed(1)+'" height="'+ph+'" data-tip="'+esc(tip)+'" aria-label="'+esc(mdLabel(d)+' '+(v!=null?fmtKo(v,true):'집계 전'))+'"/></g>';
    }).join('');
    var table='<table class="sr"><caption>'+esc(w.name)+' 일별 AI 브리핑 인용 증분</caption><tr><th>날짜</th><th>증분</th><th>누적</th></tr>'+
      days.map(function(d,i){ var r=rm[d]||{}; return '<tr><td>'+esc(d)+'</td><td>'+(vals[i]!=null?fmtKo(vals[i],true):'—')+'</td><td>'+(r.cum!=null?fmtKo(r.cum):'—')+'</td></tr>'; }).join('')+'</table>';
    chart='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+grid+cols+'</svg>'+table+'</div>';
  } else chart='<div class="cr-state">일별 증분 집계 전 · 스냅샷 '+((w.rows||[]).filter(function(r){ return r&&r.at; }).length)+'개</div>';
  return '<div class="cr">'+head+stats+chart+'</div>';
}

function livePosts(){
  var list=POSTS.filter(isLive);
  if(S.writer)list=list.filter(function(p){ return p.author===S.writer; });
  if(S.q){
    var q=S.q.toLowerCase();
    list=list.filter(function(p){
      return (p.title+' '+p.cat+' '+p.author).toLowerCase().indexOf(q)>=0;
    });
  }
  return list;
}
function renderPosts(){
  setTitle('작성 글');

  var all=POSTS.filter(isLive);
  /* 필터는 «목록에 실제로 있는 작성자»만 — 휴면이든 아니든 글이 없으면 칩도 없다 */
  var counts={};
  all.forEach(function(p){ counts[p.author]=(counts[p.author]||0)+1; });
  var names=Object.keys(counts).sort(function(a,b){
    var ia=PREF.indexOf(a), ib=PREF.indexOf(b);
    if(ia<0)ia=99; if(ib<0)ib=99;
    return ia-ib||a.localeCompare(b,'ko');
  });
  if(S.writer&&!counts[S.writer])S.writer='';

  var newCnt=all.filter(function(p){ return p.isNew; }).length;
  setMeta('<span><b>'+all.length+'</b> 편</span>'+
    (newCnt?'<span>새 글 <b>'+newCnt+'</b></span>':''));

  var chips='<button type="button" class="chip'+(S.writer?'':' on')+'" data-w="">전체'+
    '<span class="n">'+all.length+'</span></button>'+
    names.map(function(n){
      return '<button type="button" class="chip'+(S.writer===n?' on':'')+'" data-w="'+esc(n)+'"'+
        ' style="--ac:'+wac(n)+'"><span class="dot"></span>'+esc(n)+
        '<span class="n">'+counts[n]+'</span></button>';
    }).join('')+
    '<span class="fsearch">'+svg('search')+
      '<input id="q" type="search" placeholder="제목·카테고리 검색" autocomplete="off" aria-label="검색" value="'+esc(S.q)+'">'+
    '</span>';

  viewEl.innerHTML='<div class="filters" id="filters">'+chips+'</div>'+
    '<div class="tray"><div class="core" id="listCore"></div></div>'+
    '<div class="more" id="moreWrap" hidden><button type="button" id="more"></button></div>';

  paintRows();
  var fch=viewEl.querySelectorAll('#filters > *');
  if(MO.live()&&fch.length)MO.g.fromTo(fch,{opacity:0},
    {opacity:1,duration:.4,stagger:{amount:.16},ease:'expo.out',clearProps:'opacity'});
  bindPosts();
  paintNav();
}
/* 목록만 다시 그린다 — 검색창을 재생성하지 않아야 한글 조합(IME)이 끊기지 않는다.
   GSAP 이 있으면 «살아남는 행은 제자리에서 미끄러지고(FLIP), 새 행은 떠오르고, 빠지는 행은 접힌다». */
function paintRows(){
  var core=el('listCore'); if(!core)return;
  var list=livePosts();
  var shown=list.slice(0,S.page*PAGE);
  var rowsEl=core.querySelector('.rows');
  function more(){
    var wrap=el('moreWrap'), btn=el('more'); if(!wrap||!btn)return;
    var rest=list.length-shown.length, num=btn.querySelector('.num');
    wrap.hidden=rest<=0;
    if(num)MO.count(num,rest); else btn.innerHTML='더 보기 <span class="num">'+rest+'</span>';
  }
  if(!list.length){
    var emptyHtml='<div class="empty"><div class="empty-t">'+
      (S.q?'검색 결과가 없어요':(S.writer?esc(S.writer)+' 글이 없어요':'확인할 글이 없어요'))+
      '</div><div class="empty-s">'+
      (S.q||S.writer?'필터를 지우면 전체가 보여요':'새 글이 완성되면 여기에 올라와요')+'</div></div>';
    if(MO.live()&&core.firstElementChild){
      MO.g.to(core.firstElementChild,{opacity:0,duration:.14,ease:'power2.in',onComplete:function(){
        core.innerHTML=emptyHtml;
        MO.g.fromTo(core.firstElementChild,{opacity:0,y:6},
          {opacity:1,y:0,duration:.4,ease:'expo.out',clearProps:'transform,opacity'});
      }});
    }else core.innerHTML=emptyHtml;
    more(); return;
  }
  if(!rowsEl||!MO.live()||!MO.F){
    core.innerHTML='<div class="rows">'+shown.map(rowHtml).join('')+'</div>';
    MO.rise(core.querySelectorAll('.row'),{y:8,amount:.3,dur:.45});
    more(); return;
  }
  /* FLIP — 이전 자리(기록) → DOM 재배치 → 새 자리로 보간 */
  Array.prototype.forEach.call(rowsEl.querySelectorAll('.row.leaving'),function(r){ r.parentNode.removeChild(r); });
  var F=MO.F, before=Array.prototype.slice.call(rowsEl.children);
  if(F.killFlipsOf)F.killFlipsOf(before);
  var old={}; before.forEach(function(r){ old[r.dataset.rel]=r; });
  var state=F.getState(before,{simple:true});
  var keep={};
  shown.forEach(function(p){
    var r=old[p.rel];
    if(!r){ var t=document.createElement('div'); t.innerHTML=rowHtml(p); r=t.firstElementChild; }
    keep[p.rel]=1; rowsEl.appendChild(r);      /* appendChild 가 순서까지 맞춘다(기존 노드는 이동) */
  });
  var leaving=[];
  before.forEach(function(r){
    if(!keep[r.dataset.rel]){ r.classList.add('leaving'); r.style.display='none'; leaving.push(r); }
  });
  F.from(state,{
    targets:Array.prototype.slice.call(rowsEl.children), duration:.42, ease:'expo.out', simple:true, absoluteOnLeave:true,
    onEnter:function(els){ if(!els.length)return; return MO.g.fromTo(els,{opacity:0,y:10},{opacity:1,y:0,duration:.42,ease:'expo.out',
      stagger:{amount:Math.min(.28,.018*els.length)},clearProps:'transform,opacity'}); },
    onLeave:function(els){ if(!els.length)return; return MO.g.to(els,{opacity:0,y:-6,duration:.16,ease:'power2.in'}); },
    onComplete:function(){
      leaving.forEach(function(r){ if(r.parentNode)r.parentNode.removeChild(r); });
      var kept=rowsEl.querySelectorAll('.row'); if(kept.length)MO.g.set(kept,{clearProps:'transform'});
    }
  });
  more();
}
function rowHtml(p){
  return '<div class="row" data-rel="'+esc(p.rel)+'" style="--ac:'+wac(p.author)+'">'+
    '<a class="row-w" href="'+encRel(p.rel)+'" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">'+
      '<span class="dot"></span><span>'+esc(p.author)+'</span></a>'+
    '<a class="row-t" href="'+encRel(p.rel)+'" target="_blank" rel="noopener">'+
      '<span class="tx">'+esc(p.title)+'</span>'+
      (p.isNew?'<span class="tag-new">NEW</span>':'')+
    '</a>'+
    '<span class="row-c">'+esc(p.cat||'—')+'</span>'+
    '<span class="row-d num'+(p.hasOrder?'':' approx')+'"'+dateTip(p)+'>'+dateTx(p)+'</span>'+
    '<span class="row-meta-m"><span class="wnm">'+esc(p.author)+'</span> · '+esc(p.cat||'—')+' · '+
      '<span class="num'+(p.hasOrder?'':' approx')+'"'+dateTip(p)+'>'+dateTx(p)+'</span></span>'+
    '<span class="row-a"><button type="button" class="arch" title="아카이브" aria-label="'+
      esc(p.title)+' 아카이브">'+svg('archive')+'</button></span>'+
  '</div>';
}
function bindPosts(){
  var fl=el('filters');
  if(fl)fl.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b)return;
    S.writer=b.dataset.w; S.page=1;
    fl.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on',c===b); });
    paintRows();
  });
  var q=el('q');
  if(q){
    var composing=false, t=0;
    var run=function(){ S.q=q.value.trim(); S.page=1; paintRows(); };
    q.addEventListener('compositionstart',function(){ composing=true; });
    q.addEventListener('compositionend',function(){ composing=false; clearTimeout(t); t=setTimeout(run,60); });
    q.addEventListener('input',function(){
      if(composing)return;              /* 한글 조합 중엔 목록을 건드리지 않는다 */
      clearTimeout(t); t=setTimeout(run,80);   /* 타자마다 FLIP 을 돌리지 않게 잠깐 모은다 */
    });
  }
  var m=el('more');
  if(m)m.addEventListener('click',function(){ S.page++; paintRows(); });
  /* 아카이브 버튼은 위임 — 행이 FLIP 으로 살아남아도 리스너가 중복되지 않는다 */
  var core=el('listCore');
  if(core)core.addEventListener('click',function(e){
    var b=e.target.closest('.arch'); if(!b||b.disabled)return;
    e.preventDefault(); e.stopPropagation();
    var row=b.closest('.row'); if(row)archive(row);
  });
}
/* 아카이브 — 행이 오른쪽으로 미끄러져 나가고 아래 행들이 FLIP 으로 올라온다(transform 만 사용). */
function archive(row){
  var rel=row.dataset.rel;
  var post=POSTS.filter(function(p){ return p.rel===rel; })[0];
  var btn=row.querySelector('.arch'); if(btn)btn.disabled=true;
  HiddenSvc.hide(rel).then(function(){
    var rowsEl=row.parentNode;
    function settle(){
      paintNav(); refreshChipCounts();
      if(!viewEl.querySelectorAll('.row:not(.leaving)').length)paintRows();
    }
    if(MO.live()&&MO.F&&rowsEl){
      /* 두 박자 — ①행이 오른쪽으로 빠져나가고(0.2s) ②그 다음에야 아래 행들이 틈을 메운다(0.42s).
         동시에 돌리면 반투명한 행 위로 아래 행이 올라와 잠깐 겹쳐 보인다(design-reviewer 09-04 지적). */
      var F=MO.F, all=Array.prototype.slice.call(rowsEl.children);
      if(F.killFlipsOf)F.killFlipsOf(all);
      var state=F.getState(all,{simple:true});   /* transform 만 움직이므로 지금 기록한 자리가 그대로 유효하다 */
      row.classList.add('leaving','nt');
      MO.g.to(row,{x:28,opacity:0,duration:.2,ease:'power2.in',onComplete:function(){
        row.style.display='none';
        F.from(state,{targets:all,duration:.42,ease:'expo.out',simple:true,absoluteOnLeave:true,
          onLeave:function(els){ if(els.length)MO.g.set(els,{opacity:0}); },   /* 이미 빠진 행 — 다시 보이지 않게만 */
          onComplete:function(){
            if(row.parentNode)row.parentNode.removeChild(row);
            var kept=rowsEl.querySelectorAll('.row'); if(kept.length)MO.g.set(kept,{clearProps:'transform'});
          }});
      }});
    }else if(row.parentNode)row.parentNode.removeChild(row);
    settle();
    toast('아카이브했어요',{action:'되돌리기',onAction:function(){
      HiddenSvc.unhide(rel).then(function(){ MO.swap(viewEl,{dir:0,top:false},renderPosts); toast('되돌렸어요'); })
        .catch(function(err){ toast('되돌리기 실패: '+((err&&err.message)||err),{kind:'err'}); });
    }});
  }).catch(function(err){
    if(btn)btn.disabled=false;
    toast(String((err&&err.message)||err),{kind:'err'});
  });
  return post;
}
/* 아카이브 뒤 칩 숫자만 제자리에서 굴린다(검색창을 다시 만들지 않으려고) */
function refreshChipCounts(){
  var fl=el('filters'); if(!fl)return;
  var all=POSTS.filter(isLive), counts={};
  all.forEach(function(p){ counts[p.author]=(counts[p.author]||0)+1; });
  fl.querySelectorAll('.chip').forEach(function(c){
    var w=c.dataset.w, n=c.querySelector('.n');
    if(!n)return;
    MO.count(n,w?(counts[w]||0):all.length);
    if(w&&!counts[w]&&!c.hidden)MO.out(c,function(){ c.hidden=true; });   /* 그 작성자 글이 다 빠지면 칩도 사라진다 */
  });
  var newCnt=all.filter(function(p){ return p.isNew; }).length;
  setMeta('<span><b>'+all.length+'</b> 편</span>'+(newCnt?'<span>새 글 <b>'+newCnt+'</b></span>':''));
}

/* ══════════ 트렌드 = 일간 토픽 데스크 ══════════ */
var DESK_SECTIONS=[
  {key:'pinned',    label:'꼭 다룰 게임',      desc:'내가 지정한 게임',           icon:'pin',     ac:'var(--s-pinned)',    cap:40},
  {key:'core',      label:'주로 다루는 게임',   desc:'봄딩·영도가 계속 쓰는 게임',  icon:'star',    ac:'var(--s-core)',      cap:10},
  {key:'parenting', label:'육아 제품',         desc:'봄딩 쿠팡 제휴 비교글',      icon:'gift',    ac:'var(--s-parenting)', cap:5},
  {key:'new',       label:'신작 게임',         desc:'막 나왔거나 곧 나오는 게임',  icon:'spark',   ac:'var(--s-new)',       cap:5},
  {key:'update',    label:'최근 업데이트 게임', desc:'화제성 있는 패치·시즌',      icon:'refresh', ac:'var(--s-update)',    cap:5},
  {key:'hot',       label:'최근 화제되는 게임', desc:'지금 검색·화제가 몰리는 쪽',  icon:'flame',   ac:'var(--s-hot)',       cap:5}
];
var DESK_SEC={}; DESK_SECTIONS.forEach(function(s){ DESK_SEC[s.key]=s; });
var DESK_PURPOSES=['사전예약','출시·첫인상','업데이트·패치','게임 정보','게임 공략','쿠폰·이벤트','티어·추천','제품 비교·추천','사용 후기·리뷰','기타'];

/* note·detail 은 ★ 로 절을 나눈 한 덩어리 문자열(~09-01)이거나 배열(09-02~). 화면은 언제나 줄 목록으로 그린다. */
function splitLines(v){
  var arr=Array.isArray(v)?v:String(v||'').split(/\r?\n|(?=★)/);
  return arr.map(function(s){ return String(s||'').replace(/^[\s·•]+/,'').trim(); })
            .filter(function(s){ return !!s; });
}
function isCaution(s){ return /^★/.test(s); }

function normEditions(raw){
  var eds=(raw&&Array.isArray(raw.editions))?raw.editions:[];
  return eds.filter(function(e){ return e&&e.date; }).map(function(e){
    return {
      date:String(e.date), headline:String(e.headline||''), note:splitLines(e.note),
      sections:DESK_SECTIONS.map(function(s){
        var src=(e.sections||[]).filter(function(x){ return x&&x.key===s.key; })[0]||{};
        var items=(src.items||[]).filter(Boolean).map(function(it,i){
          var lane=String(it.lane||'');
          return {
            id:String(it.id||(e.date+'-'+s.key+'-'+i)), sec:s.key,
            game:String(it.game||''), title:String(it.title||''),
            purpose:String(it.purpose||''), platform:String(it.platform||''),
            why:String(it.why||''), detail:String(it.detail||''), angle:String(it.angle||''),
            when:String(it.when||''), heat:Math.max(0,Math.min(3,Number(it.heat)||0)),
            /* lane = 이 게임을 주로 쓰는 작성자. 발주 모달의 기본 선택값일 뿐 강제가 아니다. */
            lane:(PREF.indexOf(lane)>=0&&INACTIVE.indexOf(lane)<0)?lane:'',
            keywords:(it.keywords||[]).map(String).filter(Boolean),
            sources:(it.sources||[]).filter(function(x){ return x&&x.url; })
              .map(function(x){ return {label:String(x.label||'출처'),url:String(x.url)}; }),
            coverage:(it.coverage||[]).filter(function(c){ return c&&c.writer; })
              .map(function(c){ return {writer:String(c.writer),title:String(c.title||'')}; })
          };
        }).filter(function(it){ return !!it.title; }).slice(0,s.cap||99);
        return {key:s.key,items:items};
      })
    };
  }).sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
}
function edItems(ed){
  return ed?ed.sections.reduce(function(a,s){ return a.concat(s.items); },[]):[];
}
/* 전량(14일치) 지연 로드 — 경량본 밖 날짜로 넘어가거나 검색할 때만 부른다 */
function ensureFullTrend(){
  if(TREND_FULL)return Promise.resolve(TREND);
  if(!TREND_FULL_P)TREND_FULL_P=jget('_trend/trend.json?ts='+Date.now(),null).then(function(j){
    if(j&&j.editions){
      TREND=normEditions(j); TREND_FULL=true;
      if(TREND.length)TREND_DATES=TREND.map(function(e){ return e.date; });
    }
    return TREND;
  });
  return TREND_FULL_P;
}
/* 발주 양식 문자열 — 모달 프리필·복사에 같이 쓴다(백엔드 material 필드와 1:1) */
function deskMaterial(it){
  var p=[];
  if(it.when)p.push('[시점] '+it.when);
  if(it.why)p.push('[왜 지금] '+it.why);
  if(it.detail)p.push('[확인된 사실]\n'+splitLines(it.detail).map(function(s){ return '- '+s; }).join('\n'));
  if(it.angle)p.push('[각도] '+it.angle);
  if(it.keywords.length)p.push('[키워드] '+it.keywords.join(', '));
  if(it.sources.length)p.push('[참고]\n'+it.sources.map(function(s){ return '- '+s.label+' '+s.url; }).join('\n'));
  if(it.coverage.length)p.push('★기존 글 확인 필요: '+it.coverage.map(function(c){ return c.writer+' 「'+c.title+'」'; }).join(' / ')+
    ' — 각도가 겹치면 새 각도로 잡거나 발주를 취소할 것');
  return p.join('\n\n');
}
function deskItemById(id){
  for(var i=0;i<TREND.length;i++){
    var hit=edItems(TREND[i]).filter(function(x){ return x.id===id; })[0];
    if(hit)return hit;
  }
  return null;
}

/* 꼭 다룰 게임 상자 — 여기 적은 게임은 다음 회차 데스크가 주제 3~5개를 만든다 */
function pinBox(){
  var full=PINS.length>=PINS_MAX;
  var chips=PINS.map(function(g,i){
    return '<span class="pin-chip"><span>'+esc(g)+'</span>'+
      '<button type="button" class="pin-x" data-rm="'+i+'" aria-label="'+esc(g)+' 빼기">'+svg('x')+'</button></span>';
  }).join('');
  return '<section class="tray pinbox"><div class="core"><div class="pin-in">'+
    '<div class="pin-h"><span class="pin-ic">'+svg('pin')+'</span>'+
      '<span class="pin-t">꼭 다룰 게임</span>'+
      '<span class="pin-note">다음 회차부터 반영</span>'+
      '<span class="pin-n'+(full?' full':'')+'">'+PINS.length+' / '+PINS_MAX+'</span></div>'+
    (PINS.length?'<div class="pin-chips">'+chips+'</div>':'')+
    '<form class="pin-add" id="pinForm" autocomplete="off">'+
      '<input id="pinInput" class="pin-i" type="text" maxlength="40"'+(full?' disabled':'')+
        ' placeholder="'+(full?'8칸을 다 썼어요':'게임 이름')+'" aria-label="꼭 다룰 게임 추가">'+
      '<button type="submit" class="pin-go"'+(full?' disabled':'')+'>'+svg('plus')+'<span>추가</span></button>'+
    '</form></div></div></section>';
}
function repaintPinBox(focus){
  var old=viewEl.querySelector('.pinbox'); if(!old)return;
  var tmp=document.createElement('div'); tmp.innerHTML=pinBox();
  old.replaceWith(tmp.firstElementChild);
  bindPinBox();
  if(focus){ var i=el('pinInput'); if(i&&!i.disabled)i.focus(); }
}
function bindPinBox(){
  var form=el('pinForm');
  if(form)form.addEventListener('submit',function(e){
    e.preventDefault();
    var input=el('pinInput'); if(!input)return;
    var name=input.value.replace(/\s+/g,' ').trim();
    if(!name){ input.focus(); return; }
    if(PinSvc.has(name)){ toast('이미 지정한 게임이에요'); input.value=''; input.focus(); return; }
    if(PINS.length>=PINS_MAX){ toast('최대 '+PINS_MAX+'개까지예요',{kind:'err'}); return; }
    input.disabled=true;
    PinSvc.save(PINS.concat([name])).then(function(){
      toast('‘'+name+'’ 추가 — 다음 회차부터 반영돼요'); repaintPinBox(true);
      var chips=viewEl.querySelectorAll('.pin-chip'); MO.pop(chips[chips.length-1]);   /* 새 칩이 떠오르고 */
      var ic=viewEl.querySelector('.pin-ic');                                          /* 핀이 꽂힌다 */
      if(ic&&MO.live()){ ic.classList.add('bump'); ic.addEventListener('animationend',function(){ ic.classList.remove('bump'); },{once:true}); }
    }).catch(function(err){
      input.disabled=false; toast('저장 실패: '+((err&&err.message)||err),{kind:'err'});
    });
  });
  viewEl.querySelectorAll('[data-rm]').forEach(function(b){
    b.addEventListener('click',function(){
      var i=Number(b.dataset.rm), name=PINS[i]; if(!name)return;
      b.disabled=true;
      var chip=b.closest('.pin-chip');
      MO.out(chip,null,{scale:.85});                       /* 먼저 접히기 시작하고(낙관), 실패하면 되살린다 */
      PinSvc.save(PINS.filter(function(_,n){ return n!==i; })).then(function(){
        toast('‘'+name+'’ 뺐어요'); repaintPinBox(false);
      }).catch(function(err){
        b.disabled=false;
        if(MO.live()&&chip)MO.g.to(chip,{opacity:1,scale:1,x:0,duration:.25,ease:'expo.out',clearProps:'transform,opacity'});
        toast('저장 실패: '+((err&&err.message)||err),{kind:'err'});
      });
    });
  });
}

function datePager(dates,cur){
  var i=dates.indexOf(cur);
  var opt=dates.map(function(d){ return '<option value="'+esc(d)+'"'+(d===cur?' selected':'')+'>'+esc(d)+'</option>'; }).join('');
  return '<div class="dpager">'+
    '<button type="button" class="dpbtn" data-go="older"'+(i<dates.length-1?'':' disabled')+'>'+svg('chevL')+'과거</button>'+
    '<select class="dpsel" id="dpsel" aria-label="날짜 선택">'+opt+'</select>'+
    '<button type="button" class="dpbtn" data-go="newer"'+(i>0?'':' disabled')+'>최신'+svg('chevR')+'</button>'+
    '<span class="dpos">'+(dates.length-i)+'/'+dates.length+'</span></div>';
}
function attachPager(dates){
  function goDate(d){
    if(!d||d===S.trendDate)return;
    var i=dates.indexOf(S.trendDate), j=dates.indexOf(d);
    S.trendDate=d;
    /* 날짜 축은 최신이 오른쪽 — 과거로 가면 왼쪽에서, 최신으로 가면 오른쪽에서 들어온다 */
    renderTrend({dir:j>i?-1:1,top:true});
  }
  viewEl.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.disabled)return;
      var i=dates.indexOf(S.trendDate);
      goDate(b.dataset.go==='older'?dates[i+1]:dates[i-1]);
    });
  });
  var sel=el('dpsel');
  if(sel)sel.addEventListener('change',function(){ goDate(sel.value); });
}

function trendRow(it){
  var s=DESK_SEC[it.sec]||DESK_SECTIONS[0];
  var warn=it.coverage.length
    ? '<span class="tr-warn" title="'+esc(it.coverage.map(function(c){ return c.writer+' 「'+c.title+'」'; }).join(' · '))+
      '" aria-label="이미 다룬 글 '+it.coverage.length+'건">'+svg('alertTri')+it.coverage.length+'</span>'
    : '';
  return '<div class="trow" style="--ac:'+s.ac+'">'+
    '<span class="tr-g">'+esc(it.game||'—')+'</span>'+
    '<span class="tr-m"><span class="tr-h">'+esc(it.title)+'</span>'+warn+'</span>'+
    '<button type="button" class="cta" data-req="'+esc(it.id)+'">발주 요청'+
      '<span class="knob">'+svg('arrowR')+'</span></button>'+
  '</div>';
}
function skel(n){
  var r=''; for(var i=0;i<n;i++)r+='<div class="skel-row"><i></i><i></i><i></i><i></i></div>';
  return '<div class="tray"><div class="core"><div class="skel" role="status" aria-live="polite">'+
    '<span class="sr">불러오는 중</span>'+r+'</div></div></div>';
}
/* 트렌드 뷰 = 검색줄(고정 셸) + 본문(#tbody). 본문만 갈아끼우므로 타자 중에도 입력창이 유지되고,
   날짜 이동은 방향(o.dir)을 갖고 미끄러진다. 셸이 방금 생겼으면(탭 전환) 즉시 그린다 — 뷰 전환이 이미 보간 중이라서. */
function renderTrend(o){
  o=o||{};
  setTitle('트렌드');
  var fresh=!(el('tq')&&el('tbody'));
  if(fresh){ viewEl.innerHTML=trendSearchBar()+'<div id="tbody"></div>'; bindTrendSearch(); }
  var body=el('tbody');
  function paint(html,after){
    if(fresh||!MO.live()){
      body.innerHTML=html; if(after)after();
      if(o.top&&!fresh)window.scrollTo({top:0,behavior:'auto'});
      return;
    }
    MO.swap(body,{dir:o.dir||0,top:!!o.top},function(){ body.innerHTML=html; if(after)after(); });
  }

  if(!TREND.length){
    setMeta('');
    paint(pinBox()+'<div class="tray"><div class="core"><div class="empty">'+
      '<div class="empty-t">아직 데스크 판이 없어요</div>'+
      '<div class="empty-s">매일 아침 6시에 그날 주제가 올라와요</div></div></div></div>', bindPinBox);
    return;
  }
  var dates=TREND_DATES.length?TREND_DATES:TREND.map(function(e){ return e.date; });
  if(!S.trendDate||dates.indexOf(S.trendDate)<0)S.trendDate=dates[0];

  /* 경량본만 있는데 3일 밖 날짜를 고르면 여기서만 전량을 받는다 */
  var edHit=TREND.filter(function(e){ return e.date===S.trendDate; })[0];
  if(!edHit&&!TREND_FULL){
    paint(pinBox()+datePager(dates,S.trendDate)+skel(4),function(){ bindPinBox(); attachPager(dates); });
    ensureFullTrend().then(function(){ if(S.view==='trend')renderTrend(); });
    return;
  }
  /* 검색은 전체 판 횡단 — 경량본만 있으면 3일치만 뒤지고 «없다»고 거짓말하게 된다. 먼저 전량을 받는다. */
  if(S.q&&!TREND_FULL){
    paint(skel(4));
    ensureFullTrend().then(function(){ if(S.view==='trend')renderTrend(); });
    return;
  }
  if(S.q){
    var q=S.q.toLowerCase(), hits=[];
    TREND.forEach(function(e){
      edItems(e).forEach(function(it){
        var hay=(it.title+' '+it.game+' '+it.why+' '+it.detail+' '+it.angle+' '+
                 it.purpose+' '+it.platform+' '+it.keywords.join(' ')+' '+e.date).toLowerCase();
        if(hay.indexOf(q)>=0)hits.push(it);
      });
    });
    setMeta('<span>검색 <b>'+hits.length+'</b></span><span>전체 '+dates.length+'일</span>');
    paint('<div class="tray"><div class="core">'+
      (hits.length?hits.map(trendRow).join('')
        :'<div class="empty"><div class="empty-t">해당하는 주제가 없어요</div></div>')+
      '</div></div>', bindOrderButtons);
    return;
  }

  var ed=edHit||TREND[0];
  var all=edItems(ed);
  setMeta('<span class="num">'+esc(ed.date)+'</span><span>주제 <b>'+all.length+'</b></span>');

  var stats=DESK_SECTIONS.map(function(s){
    var n=(ed.sections.filter(function(x){ return x.key===s.key; })[0]||{items:[]}).items.length;
    return '<span class="mh-stat" style="--cc:'+s.ac+'"><b>'+n+'</b>'+esc(s.label)+'</span>';
  }).join('');
  var mast='<section class="tray rise"><div class="core"><div class="masthead">'+
    '<div class="mh-t">'+esc(ed.headline||'오늘의 게임 주제')+'</div>'+
    '<div class="mh-stats">'+stats+'</div>'+
    (ed.note.length?'<ul class="mh-note">'+ed.note.map(function(n){
      return '<li'+(isCaution(n)?' class="warn"':'')+'>'+esc(n.replace(/^★+\s*/,''))+'</li>';
    }).join('')+'</ul>':'')+
    '</div></div></section>';

  var secs=DESK_SECTIONS.map(function(s){
    var items=(ed.sections.filter(function(x){ return x.key===s.key; })[0]||{items:[]}).items;
    var emptyTx=(s.key!=='pinned')
      ? '오늘은 이 분류에서 건질 주제가 없었어요.'
      : (PINS.length
          ? '지정한 게임 주제는 <b>다음 회차</b>부터 올라와요.'
          : '위 상자에 게임을 지정하면 <b>게임마다 주제 3~5개</b>가 여기 모여요.');
    var body=items.length
      ? items.map(trendRow).join('')
      : '<div class="tsec-empty">'+emptyTx+'</div>';
    return '<section class="tray tsec rise" style="--ac:'+s.ac+'"><div class="core">'+
      '<div class="tsec-h"><span class="tsec-ic">'+svg(s.icon)+'</span>'+
        '<span class="tsec-t">'+esc(s.label)+'</span><span class="tsec-d">'+esc(s.desc)+'</span>'+
        '<span class="tsec-n">'+items.length+'</span></div>'+
      body+'</div></section>';
  }).join('');

  paint(pinBox()+mast+datePager(dates,S.trendDate)+secs,function(){
    observeRise(body); bindPinBox(); attachPager(dates); bindOrderButtons();
  });
}
function trendSearchBar(){
  return '<div class="filters"><span class="fsearch">'+svg('search')+
    '<input id="tq" type="search" placeholder="주제 검색 (전체 판)" autocomplete="off" aria-label="주제 검색" value="'+esc(S.q)+'">'+
    '</span></div>';
}
function bindTrendSearch(){
  var q=el('tq'); if(!q)return;
  var composing=false, t=0;
  var run=function(){ S.q=q.value.trim(); renderTrend(); };   /* 셸이 남으므로 포커스·커서를 다시 잡을 필요가 없다 */
  q.addEventListener('compositionstart',function(){ composing=true; });
  q.addEventListener('compositionend',function(){ composing=false; clearTimeout(t); t=setTimeout(run,220); });
  q.addEventListener('input',function(){
    if(composing)return;
    clearTimeout(t); t=setTimeout(run,220);   /* 전체 판 횡단이라 매 글자마다 돌리지 않는다 */
  });
}
function bindOrderButtons(){
  viewEl.querySelectorAll('[data-req]').forEach(function(b){
    b.addEventListener('click',function(){
      var it=deskItemById(b.dataset.req); if(it)openOrder(it,b);
    });
  });
}

/* ══════════ 모달 셸 (포커스 트랩·ESC·배경 클릭) ══════════ */
var MODAL=null;
function closeModal(){
  if(!MODAL)return;
  var back=MODAL.back, opener=MODAL.opener;
  document.removeEventListener('keydown',MODAL.onKey);
  MODAL=null;
  document.body.style.overflow='';
  function drop(){ if(back.parentNode)back.parentNode.removeChild(back); }
  if(MO.live()){
    var mdl=back.querySelector('.mdl');
    MO.g.killTweensOf([back,mdl]);
    MO.g.timeline({onComplete:drop})
      .to(mdl,{y:8,scale:.985,opacity:0,duration:.16,ease:'power2.in'},0)
      .to(back,{opacity:0,duration:.2,ease:'power2.in'},.02);
  }else{
    back.classList.remove('on');
    setTimeout(drop,340);
  }
  if(opener&&opener.focus)try{ opener.focus(); }catch(e){}
}
function openModal(inner,opener,label){
  if(MODAL)closeModal();
  var back=document.createElement('div');
  back.className='back'; back.setAttribute('role','dialog'); back.setAttribute('aria-modal','true');
  back.setAttribute('aria-label',label||'대화상자');
  back.innerHTML='<div class="mdl"><div class="mdl-core">'+inner+'</div></div>';
  document.body.appendChild(back);
  document.body.style.overflow='hidden';
  function onKey(e){
    if(e.key==='Escape'){ e.preventDefault(); closeModal(); return; }
    if(e.key!=='Tab')return;
    var f=Array.prototype.slice.call(back.querySelectorAll('button,select,input,textarea,a[href],[tabindex="0"]'))
      .filter(function(n){ return !n.disabled&&n.offsetParent!==null; });
    if(!f.length)return;
    var first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
  document.addEventListener('keydown',onKey);
  back.addEventListener('mousedown',function(e){ if(e.target===back)closeModal(); });
  back.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click',closeModal); });
  MODAL={back:back,onKey:onKey,opener:opener||null};
  if(MO.live()){
    /* 배경이 깔리고 → 판이 떠오르고 → 안의 항목이 순서대로 자리 잡는다 */
    var mdl=back.querySelector('.mdl');
    var kids=back.querySelectorAll('.mdl-b > :not(form), .mdl-b > form > *');
    back.classList.add('on');
    MO.g.set(back,{opacity:0}); MO.g.set(mdl,{y:18,scale:.975,opacity:0});
    var tl=MO.g.timeline()
      .to(back,{opacity:1,duration:.24,ease:'power2.out'},0)
      .to(mdl,{y:0,scale:1,opacity:1,duration:.5,ease:'expo.out',clearProps:'transform'},.02);
    if(kids.length){
      MO.g.set(kids,{opacity:0,y:8});
      tl.to(kids,{opacity:1,y:0,duration:.42,stagger:{amount:.22},ease:'expo.out',clearProps:'transform,opacity'},.1);
    }
  }else requestAnimationFrame(function(){ back.classList.add('on'); });
  return back;
}
/* 작성자 칩 (요청·발주 공용) */
/* 작성자 칩 — «자동 배정» 없음. 발주는 사람이 정한다(pre 가 없으면 아무것도 선택되지 않은 채 열린다) */
function writerChips(pre){
  var live=PREF.filter(function(w){ return INACTIVE.indexOf(w)<0; });
  return live.map(function(w){
      var i=WMAP[w]||{};
      return '<button type="button" class="wchip'+(w===pre?' on':'')+'" data-w="'+esc(w)+'" style="--ac:'+wac(w)+'">'+
        '<span class="dot"></span>'+esc(w)+'<span class="plat">'+esc(i.plat||'')+'</span></button>';
    }).join('');
}
function bindWriterChips(root,onPick){
  root.querySelectorAll('.wchip').forEach(function(c){
    c.addEventListener('click',function(){
      root.querySelectorAll('.wchip').forEach(function(x){ x.classList.remove('on'); });
      c.classList.add('on'); root.classList.remove('need');
      onPick(c.dataset.w);
    });
  });
}
/* 작성자 미선택으로 보내기를 눌렀을 때 — 칩 무리에 경고 테두리 + 첫 칩으로 포커스 */
function needChips(root){
  if(!root)return;
  root.classList.add('need');
  var first=root.querySelector('.wchip'); if(first)first.focus();
  setTimeout(function(){ root.classList.remove('need'); },1800);
}

/* ══════════ 발주 요청 모달 (트렌드) ══════════ */
function copyOrderForm(o){
  var block='[목적] '+(o.purpose||'기타')+'\n[작성자] '+(o.writer||'미지정')+
    '\n[주제] '+(o.topic||'')+'\n[소재/참고메모] '+(o.material||'(없음)');
  function done(){ toast('발주 양식을 복사했어요'); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(block).then(done).catch(function(){ legacy(); });
  }else legacy();
  function legacy(){
    try{
      var ta=document.createElement('textarea'); ta.value=block;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); done();
    }catch(e){ toast('복사에 실패했어요',{kind:'err'}); }
  }
}
function openOrder(it,opener){
  var s=DESK_SEC[it.sec]||DESK_SECTIONS[0];
  var pre=it.lane||'';
  var dl=splitLines(it.detail);
  var facts=dl.filter(function(x){ return !isCaution(x); });
  var cautions=dl.filter(isCaution);
  function fld(k,v){
    return v?'<div class="bf-f"><span class="bf-k">'+k+'</span><span class="bf-v">'+esc(v)+'</span></div>':'';
  }
  var heat=it.heat?'<span class="bf-heat" aria-label="화제도 '+it.heat+'/3">'+
    [1,2,3].map(function(n){ return '<i class="'+(n<=it.heat?'on':'')+'"></i>'; }).join('')+'</span>':'';
  var brief='<div class="brief">'+
    '<div class="bf-h"><span class="bf-g">'+esc(it.game||'—')+'</span>'+
      (it.platform?'<span class="bf-p">'+esc(it.platform)+'</span>':'')+
      (it.when?'<span class="bf-w">'+esc(it.when)+'</span>':'')+heat+'</div>'+
    fld('왜 지금',it.why)+
    (facts.length?'<div class="bf-f"><span class="bf-k">확인된 사실</span><span class="bf-v">'+
      facts.map(function(x){ return '<span class="bf-l">'+esc(x)+'</span>'; }).join('')+'</span></div>':'')+
    fld('각도',it.angle)+
    (cautions.length?'<div class="bf-cau">'+cautions.map(function(x){
      return '<span class="bf-l">'+esc(x.replace(/^★+\s*/,''))+'</span>'; }).join('')+'</div>':'')+
    (it.sources.length?'<div class="bf-src">'+it.sources.map(function(x){
      return '<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.label)+svg('arrowUR')+'</a>';
    }).join('')+'</div>':'')+
  '</div>';
  /* 글의 목적은 화면에서 뺐다(주제에 이미 담긴다) — 데스크가 판정한 purpose 는 조용히 같이 보낸다 */
  var back=openModal(
    '<div class="mdl-h"><span class="mdl-hic">'+svg('send')+'</span>'+
      '<div><div class="mdl-ht">발주 요청</div><div class="mdl-hs">'+esc(s.label)+'</div></div>'+
      '<button type="button" class="mdl-x" data-close aria-label="닫기">'+svg('x')+'</button></div>'+
    '<div class="mdl-b">'+brief+
      '<label class="f-l" for="oTopic">주제</label>'+
      '<input id="oTopic" class="f-i" type="text" maxlength="200" value="'+esc(it.title)+'">'+
      '<label class="f-l" for="oMaterial">요청 사항</label>'+
      '<textarea id="oMaterial" class="f-i f-ta">'+esc(deskMaterial(it))+'</textarea>'+
      '<label class="f-l">작성자</label>'+
      '<div class="f-chips" id="oChips">'+writerChips(pre)+'</div>'+
      (it.coverage.length?'<div class="f-hint warn">'+svg('alertTri')+'<span><b>이미 다룬 글</b> — '+
        it.coverage.map(function(c){ return esc(c.writer)+' 「'+esc(c.title)+'」'; }).join(' · ')+
        '. 같은 각도면 발주하지 마세요.</span></div>':'')+
    '</div>'+
    '<div class="mdl-f">'+
      '<button type="button" class="ghost" id="oCopy">'+svg('copy')+'양식 복사</button>'+
      '<button type="button" class="ghost" data-close>취소</button>'+
      '<button type="button" class="cta" id="oGo">작업 큐로 보내기<span class="knob">'+svg('arrowR')+'</span></button>'+
      '<div class="mdl-msg" id="oMsg"></div>'+
    '</div>', opener, '발주 요청');

  var $=function(q){ return back.querySelector(q); };
  var writer=pre;
  bindWriterChips($('#oChips'),function(w){ writer=w; });
  function msg(t,k){ var m=$('#oMsg'); m.textContent=t; m.className='mdl-msg'+(k?' '+k:''); }
  if(!RequestService.isConnected())msg('백엔드 미연결 — 임시 저장만 됩니다','err');
  $('#oCopy').addEventListener('click',function(){
    copyOrderForm({purpose:it.purpose,writer:writer,
      topic:$('#oTopic').value.trim()||it.title,material:$('#oMaterial').value.trim()});
  });
  $('#oGo').addEventListener('click',function(){
    var topic=$('#oTopic').value.trim();
    if(!topic){ msg('주제를 입력해주세요','err'); $('#oTopic').focus(); return; }
    if(!writer){ msg('작성자를 선택해주세요','err'); needChips($('#oChips')); return; }
    var go=$('#oGo'); go.disabled=true; msg('보내는 중…');
    RequestService.submit({purpose:it.purpose,topic:topic,
      material:$('#oMaterial').value.trim(),writer:writer,source:'trend-desk'}).then(function(rec){
      if(rec.status==='submitted'){
        closeModal();
        toast(writer+' · 작업 큐로 보냈어요');
        if(opener)MO.pulse(opener,function(){
          opener.disabled=true; opener.classList.add('done');
          opener.innerHTML='발주함<span class="knob">'+svg('check')+'</span>';
          MO.draw(opener.querySelector('.ic'),.05,.4);   /* 체크가 그려진다 */
        });
      }else if(rec.status==='sendfail'){ msg(rec.error||'전송 실패','err'); go.disabled=false; }
      else if(rec.status==='queued'){ msg('네트워크 문제로 임시 저장했어요','err'); go.disabled=false; }
      else { msg('임시 저장했어요(백엔드 미연결)','ok'); go.disabled=false; }
    }).catch(function(e){ msg('전송 실패: '+((e&&e.message)||e),'err'); go.disabled=false; });
  });
  requestAnimationFrame(function(){ var t=$('#oTopic'); if(t)t.focus(); });
}

/* ══════════ 새 글 요청 모달 (FAB · 양식 유지) ══════════ */
var REQ_STATUS_LABEL={local:'임시저장',queued:'전송 대기',sendfail:'전송 실패',submitted:'접수됨',received:'접수됨',
  processing:'발행중',published:'발행됨',failed:'실패',skipped:'건너뜀'};
/* 글의 목적(purpose)은 2026-09-05부터 화면에서 묻지 않는다 — 백엔드는 null 을 받고 러너가 주제·소재로 추정한다(정본 post-purpose-guide.md).
   트렌드 발주만 데스크가 판정한 purpose 를 조용히 실어 보낸다. */
/* 새 글 요청 — 주제·메모·작성자·요청 문서 네 칸뿐. 글의 목적은 주제에 담기므로 묻지 않는다(러너가 주제로 추정).
   작성자는 기본 선택 없음 — 안 고르고 보내면 안내하고 고르게 한다(자동 배정 없음). 요청 문서 = 광고주 가이드(1회용·최우선 규칙). */
function openRequest(opener){
  var back=openModal(
    '<div class="mdl-h"><span class="mdl-hic">'+svg('edit')+'</span>'+
      '<div><div class="mdl-ht">새 글 요청</div>'+
      (RequestService.isConnected()?'':'<div class="mdl-hs">백엔드 미연결 — 임시 저장</div>')+'</div>'+
      '<button type="button" class="mdl-x" data-close aria-label="닫기">'+svg('x')+'</button></div>'+
    '<div class="mdl-b"><form id="rForm" novalidate>'+
      '<label class="f-l" for="rTopic">주제</label>'+
      '<input id="rTopic" class="f-i" type="text" placeholder="예: 명조 2.0 신규 캐릭터 정보 정리" maxlength="200" required>'+
      '<label class="f-l" for="rMaterial">요청 사항</label>'+
      '<textarea id="rMaterial" class="f-i f-ta" maxlength="2000" placeholder="예: 9/10 2.0 업데이트 기준 신규 캐릭터 2명 정리&#10;- 꼭 넣기: 이름·속성·역할, 뽑기 추천 여부와 이유&#10;- 참고: 공식 공지 링크 https://…&#10;- 톤: 처음 하는 독자 기준, 표 1개 이상&#10;- 빼기: 유출 정보·과장 표현"></textarea>'+
      '<label class="f-l">작성자</label>'+
      '<div class="f-chips" id="rChips">'+writerChips('')+'</div>'+
      '<label class="f-l">요청 문서</label>'+
      '<div class="dz" id="rDz" tabindex="0" role="button" aria-label="요청 문서 — 파일을 놓거나 클릭해 선택, 최대 5개">'+
        '<input id="rFile" type="file" accept="'+esc(CFG.ACCEPT)+'" multiple hidden>'+
        '<div class="dz-idle" id="rDzIdle">'+svg('paperclip','dz-ic')+
          '<div class="dz-t">파일을 여기에 놓거나 클릭</div>'+
          '<div class="dz-s">docx xlsx pdf txt hwpx · 파일당 20MB · 최대 5개 · 이 요청 1건에만 최우선 규칙으로 적용</div></div>'+
        '<div class="dz-list" id="rDzList" hidden></div>'+
      '</div>'+
      '<div id="rList"></div>'+
    '</form></div>'+
    '<div class="mdl-f">'+
      '<button type="button" class="ghost" data-close>취소</button>'+
      '<button type="button" class="cta" id="rGo">요청 보내기<span class="knob">'+svg('send')+'</span></button>'+
      '<div class="mdl-msg" id="rMsg"></div>'+
    '</div>', opener, '새 글 요청');

  var $=function(q){ return back.querySelector(q); };
  var files=[], writer='';
  function msg(t,k){ var m=$('#rMsg'); m.textContent=t; m.className='mdl-msg'+(k?' '+k:''); }

  bindWriterChips($('#rChips'),function(w){ writer=w; });
  /* 요청 문서 드롭존 — 클릭(파일 선택창)·Enter/Space·드래그 앤 드롭. 최대 5개·파일당 20MB·형식은 브라우저에서 먼저 거른다(백엔드와 같은 기준) */
  var dz=$('#rDz'), fi=$('#rFile'), idle=$('#rDzIdle'), listEl=$('#rDzList');
  var EXT=(CFG.ACCEPT.match(/\.(\w+)/g)||[]).map(function(s){ return s.slice(1).toLowerCase(); });
  var MAXF=5, MAXB=20*1024*1024;
  function fmtBytes(n){ return n>=1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB'; }
  function paintFiles(){
    listEl.textContent='';
    if(!files.length){ idle.hidden=false; listEl.hidden=true; dz.classList.remove('has'); return; }
    idle.hidden=true; listEl.hidden=false; dz.classList.add('has');
    files.forEach(function(f,i){
      var row=document.createElement('div'); row.className='dz-row';
      row.innerHTML=svg('check','dz-ic')+'<span class="dz-t"></span><span class="dz-s"></span>'+
        '<button type="button" class="f-fclear" data-i="'+i+'" aria-label="'+esc(f.name)+' 지우기">지우기</button>';
      row.querySelector('.dz-t').textContent=f.name; row.querySelector('.dz-s').textContent=fmtBytes(f.size);
      listEl.appendChild(row);
    });
    var more=document.createElement('div'); more.className='dz-more';
    more.textContent=files.length+'/'+MAXF+(files.length<MAXF?' · 더 놓거나 클릭':'');
    listEl.appendChild(more);
  }
  function addFiles(fs){
    var added=[], bad=[];
    Array.prototype.forEach.call(fs||[],function(f){
      if(files.length>=MAXF){ bad.push('최대 '+MAXF+'개'); return; }
      var ext=(String(f.name).split('.').pop()||'').toLowerCase();
      if(EXT.indexOf(ext)<0){ bad.push(f.name+' 형식 불가'); return; }
      if(f.size>MAXB){ bad.push(f.name+' 20MB 초과'); return; }
      if(files.some(function(x){ return x.name===f.name&&x.size===f.size; }))return;   /* 같은 파일은 한 번만 */
      files.push(f); added.push(f);
    });
    paintFiles();
    if(files.length&&listEl.lastElementChild){   /* 새 행·«N/5» 줄이 모달 내부 스크롤 밖에 남지 않게(게이트 09-05) */
      listEl.lastElementChild.scrollIntoView({block:'nearest',behavior:'smooth'});
      var ft=dz.closest('.mdl').querySelector('.mdl-f'); if(ft)ft.scrollIntoView({block:'nearest',behavior:'smooth'});   /* 모바일은 본문 캡이 없어 판(.back)이 스크롤 — 5개 채우면 풋터가 첫 화면 밖 14px 였다(재게이트 09-05) */
    }
    if(bad.length){ var u=bad.filter(function(v,i){ return bad.indexOf(v)===i; }); msg(u.slice(0,2).join(' · ')+(u.length>2?' 외 '+(u.length-2)+'건':''),'err'); }
    else if(added.length)msg('');
    added.forEach(function(f){ var i=files.indexOf(f); if(i>=0&&listEl.children[i])MO.pop(listEl.children[i]); });
  }
  dz.addEventListener('click',function(e){
    var rm=e.target.closest('.f-fclear');
    if(rm){ e.stopPropagation(); files.splice(Number(rm.dataset.i),1); paintFiles(); dz.focus(); return; }
    fi.click();
  });
  dz.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target===dz){ e.preventDefault(); fi.click(); } });
  fi.addEventListener('change',function(){ addFiles(fi.files); fi.value=''; });
  ['dragenter','dragover'].forEach(function(t){
    dz.addEventListener(t,function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.add('over'); });
  });
  dz.addEventListener('dragleave',function(e){ if(!dz.contains(e.relatedTarget))dz.classList.remove('over'); });
  dz.addEventListener('drop',function(e){
    e.preventDefault(); e.stopPropagation(); dz.classList.remove('over');
    var fs=e.dataTransfer&&e.dataTransfer.files; if(!fs||!fs.length)return;
    addFiles(fs);
  });
  /* 판 밖에 떨어뜨리면 브라우저가 파일을 열어 버린다 — 모달 전체에서 기본 동작을 막는다 */
  back.addEventListener('dragover',function(e){ e.preventDefault(); });
  back.addEventListener('drop',function(e){ e.preventDefault(); });

  function drawList(){
    var reqs=RequestService.list().filter(function(r){ return r.status!=='published'; });
    var box=$('#rList');
    if(!reqs.length){ box.innerHTML=''; return; }
    box.innerHTML='<div class="rl-h">내 요청 '+reqs.length+'</div>'+reqs.map(function(r){
      return '<div class="rl-item"><div class="rl-top"><b>'+esc(r.topic||'(주제 없음)')+'</b>'+
        '<span class="rl-st s-'+esc(r.status)+'">'+esc(REQ_STATUS_LABEL[r.status]||r.status)+'</span></div>'+
        '<div class="rl-meta">'+(r.purpose?esc(r.purpose)+' · ':'')+esc(r.writer||'자동')+' · '+
        '<span class="num">'+fmtTs(r.createdAt)+'</span>'+
        (r.publishUrl?' · <a href="'+esc(r.publishUrl)+'" target="_blank" rel="noopener">보기</a>':'')+'</div>'+
        '<button type="button" class="rl-del" data-id="'+esc(r.id)+'">삭제</button></div>';
    }).join('');
    box.querySelectorAll('.rl-del').forEach(function(b){
      b.addEventListener('click',function(){ RequestService.remove(b.dataset.id); drawList(); });
    });
  }
  drawList();
  RequestService.syncStatuses().then(function(c){ if(c&&MODAL)drawList(); });

  $('#rGo').addEventListener('click',function(){
    var topic=$('#rTopic').value.trim(), material=$('#rMaterial').value.trim();
    if(!topic){ msg('주제를 입력해주세요','err'); $('#rTopic').focus(); return; }
    if(!writer){ msg('작성자를 선택해주세요','err'); needChips($('#rChips')); return; }
    var go=$('#rGo'); go.disabled=true; msg('보내는 중…');
    RequestService.submit({topic:topic,material:material,writer:writer,files:files.slice()})
      .then(function(rec){
        go.disabled=false;
        if(rec.status==='submitted'){
          closeModal();
          toast('요청이 접수됐어요 · 발행되면 알림으로 알려드려요');
        }else if(rec.status==='sendfail'){ msg((rec.error||'전송 실패')+(files.length?' — 파일은 다시 첨부해 주세요':''),'err'); drawList(); }
        else if(rec.status==='queued'){ msg('네트워크 문제로 임시 저장했어요','err'); drawList(); }
        else { msg('임시 저장했어요(백엔드 미연결)','ok'); drawList(); }
      }).catch(function(e){ go.disabled=false; msg('전송 실패: '+((e&&e.message)||e),'err'); });
  });
  requestAnimationFrame(function(){ var t=$('#rTopic'); if(t)t.focus(); });
}

/* ══════════ 알림 (실패한 글 작성) ══════════ */
var SEEN_LS='sseudam_notif_seen', NOTIFS=[];
function notifTs(r){ return r.statusAt||r.createdAt||0; }
function buildNotifs(){
  var cut=Date.now()-NOTIF_DAYS*DAY;
  NOTIFS=REQS.filter(function(r){
    return r&&(r.status==='failed'||r.status==='skipped')&&notifTs(r)>=cut;
  }).sort(function(a,b){ return notifTs(b)-notifTs(a); }).slice(0,NOTIF_MAX);
  paintBell();
  paintNotifPanel();
}
function unreadCount(){
  var seen=Number(ls(SEEN_LS,0))||0;
  return NOTIFS.filter(function(r){ return notifTs(r)>seen; }).length;
}
var lastUnread=-1;
function paintBell(){
  var dot=el('bellDot'), bell=el('bell'), n=unreadCount();
  dot.textContent=n>9?'9+':String(n);
  dot.classList.toggle('on',n>0);
  bell.setAttribute('aria-label',n?('알림 '+n+'건'):'알림');
  if(n>0&&n>lastUnread&&MO.live()){ bell.classList.remove('ring'); void bell.offsetWidth; bell.classList.add('ring'); }   /* 늘었을 때만 울린다 */
  lastUnread=n;
}
function paintNotifPanel(){
  var seen=Number(ls(SEEN_LS,0))||0;
  var list=NOTIFS.length
    ? NOTIFS.map(function(r,i){
        var w=r.writer&&WMAP[r.writer]?wac(r.writer):'var(--ink-3)';
        return '<button type="button" class="np-item'+(notifTs(r)>seen?' unread':'')+'" data-i="'+i+'">'+
          '<div class="np-top"><span class="np-w" style="--ac:'+w+'">'+esc(r.writer||'미배정')+'</span>'+
            '<span class="np-d">'+esc(fmtRel(notifTs(r)))+'</span></div>'+
          '<div class="np-topic">'+esc(r.topic||'(주제 없음)')+'</div>'+
          '<div class="np-why">'+esc(r.error||(r.status==='skipped'?'건너뜀':'사유 없음'))+'</div></button>';
      }).join('')
    : '<div class="np-empty">실패한 글이 없어요</div>';

  el('npCore').innerHTML=
    '<div class="np-h"><span class="np-t">작성 실패</span>'+
      '<span class="np-n">'+(NOTIFS.length||'')+'</span></div>'+
    '<div class="np-list">'+list+'</div>'+
    '<div class="np-f"><button type="button" class="np-push" id="npPush">'+svg('bell')+'완료 알림 켜기</button>'+
      '<span class="np-hint" id="npHint"></span></div>';

  el('npCore').querySelectorAll('.np-item').forEach(function(b){
    b.addEventListener('click',function(){ b.classList.toggle('open'); });
  });
  paintPushBtn();
}
/* 발행 완료 → 윈도우 알림. 백엔드가 status=published 로 바꿀 때 웹푸시를 쏜다. */
function paintPushBtn(){
  var b=el('npPush'), h=el('npHint'); if(!b)return;
  PushSvc.status().then(function(st){
    if(st==='subscribed'){ b.disabled=true; b.innerHTML=svg('check')+'완료 알림 켜짐'; h.textContent=''; return; }
    if(st==='denied'){ b.disabled=true; b.innerHTML=svg('bell')+'알림 차단됨'; h.textContent='브라우저 설정에서 허용'; return; }
    if(st==='unsupported'||st==='unconfigured'){ b.disabled=true; h.textContent='이 브라우저는 미지원'; return; }
    b.disabled=false; b.innerHTML=svg('bell')+'완료 알림 켜기'; h.textContent='';
    b.onclick=function(){
      b.disabled=true;
      PushSvc.subscribe().then(function(sub){
        if(sub){ b.innerHTML=svg('check')+'완료 알림 켜짐'; toast('글이 발행되면 알림이 떠요'); }
        else { b.disabled=false; toast('알림 권한이 필요해요',{kind:'err'}); }
      }).catch(function(e){ b.disabled=false; toast('알림 설정 실패: '+((e&&e.message)||e),{kind:'err'}); });
    };
  });
}
var npOpen=false;
function toggleNotif(force){
  npOpen=(force==null)?!npOpen:force;
  var panel=el('npanel');
  el('bell').setAttribute('aria-expanded',npOpen?'true':'false');
  panel.inert=!npOpen;   /* 닫힌 판의 항목이 Tab 순서에 끼지 않게(보이지 않는 컨트롤 4개 건너뛰기 방지) */
  if(MO.live()){
    MO.g.killTweensOf(panel);
    if(npOpen){
      panel.classList.add('on');
      MO.g.fromTo(panel,{y:-8,scale:.96,opacity:0},{y:0,scale:1,opacity:1,duration:.38,ease:'expo.out'});
      var items=panel.querySelectorAll('.np-item');
      if(items.length)MO.g.fromTo(items,{y:6,opacity:0},
        {y:0,opacity:1,duration:.34,stagger:{amount:.16},ease:'expo.out',clearProps:'transform,opacity'});
    }else{
      MO.g.to(panel,{y:-6,scale:.97,opacity:0,duration:.16,ease:'power2.in',
        onComplete:function(){ panel.classList.remove('on'); }});
    }
  }else panel.classList.toggle('on',npOpen);
  if(npOpen&&NOTIFS.length){
    lset(SEEN_LS,String(notifTs(NOTIFS[0])));
    setTimeout(function(){ paintBell(); },900);   /* 열자마자 사라지면 뭘 봤는지 모른다 — 잠깐 남긴다 */
  }
}
el('bell').addEventListener('click',function(e){ e.stopPropagation(); toggleNotif(); });
el('bell').addEventListener('animationend',function(){ el('bell').classList.remove('ring'); });
document.addEventListener('click',function(e){
  if(npOpen&&!e.target.closest('#npanel')&&!e.target.closest('#bell'))toggleNotif(false);
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&npOpen)toggleNotif(false); });

/* ══════════ 초기화 ══════════ */
el('fab').addEventListener('click',function(){ openRequest(el('fab')); });

/* 서비스워커 = 설치형 PWA + 발행 완료 웹푸시 수신 채널 */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(){ paintPushBtn(); }).catch(function(){});
  });
}
/* 탭으로 돌아오면 실패 알림·발주일자를 다시 맞춘다 */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'||!CFG.API_BASE)return;
  jget(api()+'/requests?ts='+Date.now(),null).then(function(rs){
    if(!Array.isArray(rs))return;
    REQS=rs; REQS_OK=true; buildNotifs(); paintHomeLive();
  });
});
movePill(false);
})();
</script>
</body></html>
